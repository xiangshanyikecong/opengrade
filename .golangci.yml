# golangci-lint 配置(v2)。
# 原则:只开能抓真 bug 的检查器,不做风格洁癖 —— 本仓库大量手写二进制协议
# 解析(OOXML/PDF/TrueType/条码),回报最高的是 errcheck/staticcheck/govet 这一类。
version: "2"

run:
  timeout: 10m

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - misspell
  settings:
    staticcheck:
      checks:
        - all
        # 保持 golangci 默认排除的 ST 检查(ST1000 包注释/ST1003 命名/ST1016
        # 接收器一致性/ST1020-22 文档注释)—— 本仓库大量中文注释,逐条改名是噪音
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # 错误文案以中文/卷种开头("B 卷…"/"Code B…"),不适用英文小写惯例
        - -ST1005
        # QF* 是 quickfix 风格建议(改 switch / 德摩根),无行为收益
        - -QF1001
        - -QF1003
        - -QF1006
    errcheck:
      # 项目惯例:defer 的资源释放与确定性成功的写场景不强制检查;
      # fmt.Fprint* 只写 stdout/ResponseWriter(丢弃无妨),业务文件写入均有显式检查
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (*bytes.Buffer).Write
        - (*bytes.Buffer).WriteByte
        - (*bytes.Buffer).WriteString
        - (*strings.Builder).WriteByte
        - (*strings.Builder).WriteString
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*bufio.Writer).Flush
