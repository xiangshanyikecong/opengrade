<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenGrade · Grader Studio 阅卷工作台</title>
<link rel="stylesheet" href="/common.css">
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:#f5f7fa; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:16px; padding:10px 20px; background:#fff; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  header .meta { font-size:12px; color:#66707d; }
  main { flex:1; display:flex; min-height:0; }
  /* 左:切片画布 */
  .stage { flex:1; display:grid; place-items:center; background:#3a4250; position:relative; min-width:0; overflow:auto; }
  .wrap { position:relative; display:inline-block; }
  .stage img { max-width:92vw; max-height:86vh; box-shadow:0 8px 32px rgba(0,0,0,.5); background:#fff; display:block; }
  .stage.zoom img { max-width:none; max-height:none; width:170vh; }
  .stage canvas { position:absolute; left:0; top:0; cursor:crosshair; }
  .overlay { position:absolute; font-size:120px; font-weight:700; opacity:.85; pointer-events:none; }
  .overlay.check { color:#00c853; }
  .overlay.cross { color:#ff1744; }
  /* 右:操作面板 */
  .panel { width:330px; background:#fff; border-left:1px solid var(--line); display:flex; flex-direction:column; overflow:auto; }
  .panel .row { padding:12px 16px; border-bottom:1px solid var(--line); }
  .panel select, .panel input { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
  .scorebtns { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .scorebtns button, .markbtns button, .tools button { padding:9px 0; border:1px solid var(--line); border-radius:8px; background:#f8fafc; font-size:14px; cursor:pointer; }
  .scorebtns button.active { background:var(--brand); color:#fff; border-color:var(--brand); }
  .markbtns { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px; }
  .markbtns button.active { background:#fff3cd; border-color:var(--warn); }
  .tools { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:8px; }
  .tools button.active { background:#e0f2e9; border-color:var(--brand); }
  .tools button.inkRed.active { background:#fde8e8; border-color:#c0392b; }
  .status { font-size:13px; color:#4b5563; line-height:1.7; }
  /* 小问拆分(版式 v3):逐问得分行 */
  .parts { margin-bottom:10px; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .partrow { display:flex; align-items:center; gap:8px; padding:7px 12px; border-bottom:1px solid var(--line); cursor:pointer; font-size:14px; }
  .partrow:last-of-type { border-bottom:0; }
  .partrow.sel { background:#e0f2e9; font-weight:600; }
  .partrow .pl { min-width:34px; }
  .partrow .pv { min-width:30px; text-align:right; font-variant-numeric:tabular-nums; }
  .partrow .pm { color:#8a94a3; font-size:12px; }
  .ptotal { padding:5px 12px; font-size:12px; color:#8a94a3; background:#f8fafc; }
  .progress { height:8px; background:#eef2f6; border-radius:4px; overflow:hidden; }
  .progress > div { height:100%; background:var(--brand); transition:width .2s; }
  kbd { background:#eef2f6; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:1px 5px; font-size:11px; }
  .hint { font-size:12px; color:#8a94a3; line-height:2; }
  .nav { display:flex; gap:8px; }
  .nav button { flex:1; padding:10px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-size:14px; cursor:pointer; }
  .nav button.ghost { background:#eef2f6; color:var(--ink); }
  #assignBox { margin-top:8px; padding:8px; background:#fff7ed; border:1px solid #fdba74; border-radius:8px; font-size:13px; }
  #assignBox .chip { display:inline-block; margin:3px 4px 0 0; padding:4px 10px; background:#fff; border:1px solid var(--warn); border-radius:14px; cursor:pointer; }
  #assignBox input { margin-top:6px; }
  #report { max-height:38vh; overflow:auto; font-size:12px; }
  #report table { width:100%; border-collapse:collapse; }
  #report td, #report th { border-bottom:1px solid var(--line); padding:4px 6px; text-align:left; }
</style>
</head>
<body>
<header>
  <h1>Grader Studio <span class="meta" id="examMeta"></span></h1>
  <span style="flex:1"></span>
  <span class="meta"><a href="/">设计器</a> · <a href="#" id="reportLink">统分报告</a></span>
</header>
<main>
  <section class="stage" id="stage">
    <div class="wrap" id="wrap">
      <img id="sliceImg" alt="主观题切片">
      <canvas id="inkCanvas"></canvas>
    </div>
    <div class="overlay" id="markOverlay"></div>
  </section>
  <aside class="panel">
    <div class="row">
      <select id="questionSel"></select>
      <div class="progress" style="margin-top:10px"><div id="progressBar" style="width:0"></div></div>
      <div class="status" id="progressText"></div>
    </div>
    <div class="row">
      <div class="status" id="studentInfo"></div>
      <div id="assignBox" hidden></div>
      <div id="partBox" class="parts" hidden></div>
      <div class="scorebtns" id="scoreBtns"></div>
      <div class="markbtns">
        <button data-mark="check" title="正确">✓ (V)</button>
        <button data-mark="cross" title="错误">✗ (B)</button>
        <button data-mark="flag" title="待复核">⚑ (X)</button>
      </div>
      <div class="tools">
        <button id="penBtn" title="手写批注笔(画笔开/关)">✎ 笔</button>
        <button id="clearBtn" title="清除本卷批注">🧹 清</button>
        <select id="enhance" title="图像增强">
          <option value="">原图</option>
          <option value="contrast(1.35)">增强</option>
          <option value="grayscale(1) contrast(1.6) brightness(1.05)">灰度增强</option>
          <option value="invert(1)">反色</option>
        </select>
        <button id="zoomBtn" title="放大查看笔迹细节">🔍 放大</button>
      </div>
    </div>
    <div class="row nav">
      <button class="ghost" id="prevBtn">← 上一卷</button>
      <button id="nextBtn">下一卷 →</button>
    </div>
    <div class="row" style="display:flex;align-items:center;gap:8px">
      <label style="font-size:13px;display:flex;align-items:center;gap:6px;margin:0">
        <input type="checkbox" id="autoAdv" checked style="width:auto"> 打分后自动跳下一份未评
      </label>
    </div>
    <div id="toast" style="position:fixed;top:64px;right:360px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;pointer-events:none;z-index:50"></div>
    <div class="row status" id="questionStatus"></div>
    <div class="row hint">
      <kbd>0</kbd>~<kbd>9</kbd> 打分 · <kbd>Space</kbd> 满分 · <kbd>Z</kbd> 零分 · <kbd>R</kbd> 同上分<br>
      <kbd>V</kbd> 对 · <kbd>B</kbd> 错 · <kbd>X</kbd> 待复核 · <kbd>P</kbd> 画笔<br>
      <kbd>F</kbd> 下一份未评 · <kbd>G</kbd> 下一份待复核 · <kbd>←</kbd> 上一卷(打分即保存,自动跳下一份未评卷)
    </div>
    <div class="row" id="report" hidden></div>
  </aside>
</main>
<script src="/common.js"></script>
<script>
const $ = id => document.getElementById(id);
const examId = new URLSearchParams(location.search).get("exam");
let meta = null, slices = [], cur = 0, qIndex = 1, qMax = 10;
let penOn = false, curStroke = null;
let specParts = []; // 当前题的小问拆分(版式 v3);空 = 整题单分模式
let partSel = 0;    // 当前打分的小问下标
let lastScore = null; // 上一次成功保存的分值(R 键同分连评)
const AUTO_KEY = "og.autoAdvance";
if (localStorage.getItem(AUTO_KEY) === "0") { /* 默认开;读到了 0 才关 */ }

function toast(msg, ms = 2600) {
  const t = $("toast");
  t.textContent = msg;
  t.style.opacity = 1;
  clearTimeout(t._h);
  t._h = setTimeout(() => t.style.opacity = 0, ms);
}
function autoAdvOn() { return $("autoAdv") && $("autoAdv").checked; }

async function jget(url) { const r = await fetch(url); if (!r.ok) throw new Error((await r.json()).error); return r.json(); }
async function jpost(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.json()).error);
  return r.json();
}

async function init() {
  if (!await OG.init()) return;
  if (!examId) { document.body.innerHTML = "<p style='padding:40px'>缺少 ?exam= 参数。<a href='/'>返回设计器</a></p>"; return; }
  meta = await jget(`/api/v1/exams/${examId}`);
  $("examMeta").textContent = `考试 ${examId} · ${meta.students} 份卷 · 客观 ${meta.objective.length} 题`;
  const sel = $("questionSel");
  sel.innerHTML = meta.subjective.map((s, i) => {
    const t = meta.tasks && meta.tasks["q" + (i + 1)];
    const parts = (s.parts || []).length ? ":" + s.parts.map(p => p.score).join("+") : "";
    const elec = s.elective ? ",选做" : "";
    return `<option value="${i + 1}">第 ${meta.objective.length + i + 1} 题(${s.kind === "fillblank" ? "填空" : "解答"},满分 ${s.score}${parts}${elec}${t ? ",阅卷人 " + t : ""})</option>`;
  }).join("");
  sel.onchange = () => loadQuestion(+sel.value);
  // 深链:?q=N 直接落位到第 N 题(我的任务/逐题进度入口),?student=S 落位到该卷(待复核队列入口)
  const params = new URLSearchParams(location.search);
  const qDeep = +params.get("q") || 0;
  const studentDeep = +params.get("student") || 0;
  if (meta.subjective.length) {
    loadQuestion(qDeep >= 1 && qDeep <= meta.subjective.length ? qDeep : 1);
    if (studentDeep) focusStudent(studentDeep);
  } else document.body.innerHTML = "<p style='padding:40px'>该考试没有主观题</p>";
  $("reportLink").onclick = async e => { e.preventDefault(); showReport(); };
  const saved = localStorage.getItem(AUTO_KEY);
  if (saved !== null) $("autoAdv").checked = saved === "1";
  $("autoAdv").onchange = e => localStorage.setItem(AUTO_KEY, e.target.checked ? "1" : "0");
  $("penBtn").onclick = () => { penOn = !penOn; $("penBtn").classList.toggle("active", penOn); };
  $("clearBtn").onclick = async () => { slices[cur].ink = []; syncCanvas(); await saveGrade(); };
  $("enhance").onchange = e => $("sliceImg").style.filter = e.target.value;
  $("zoomBtn").onclick = () => { $("stage").classList.toggle("zoom"); $("zoomBtn").classList.toggle("active"); syncCanvas(); };
  window.addEventListener("resize", syncCanvas);
}

async function loadQuestion(q) {
  qIndex = q;
  slices = await jget(`/api/v1/exams/${examId}/slices?q=${q}&grading=1`); // 阅卷不受班级过滤(跨班职责)
  const spec = meta.subjective[q - 1];
  specParts = spec.parts || [];
  partSel = 0;
  qMax = spec.score;
  buildScoreBtns();
  // 落位:第一份未评卷(评卷惯例;全评完落第 1 卷)
  cur = Math.max(0, slices.findIndex(x => !x.graded));
  preload(Math.min(8, slices.length));
  render();
}

// 深链落位到指定卷(待复核队列入口):URL ?student=S 载入后直接切到该卷
function focusStudent(student) {
  const i = slices.findIndex(x => x.student === student);
  if (i >= 0) { cur = i; partSel = 0; buildScoreBtns(); render(); toast(`已定位到卷 ${student}(${slices[i].mark === "flag" ? "⚑ 待复核" : "当前分 " + (slices[i].score ?? "-")})`); }
}

// 本题内跳下一份未评卷;没有则返回 false(全评完)
function jumpNextUngraded() {
  for (let i = cur + 1; i < slices.length; i++) if (!slices[i].graded) { cur = i; partSel = 0; buildScoreBtns(); render(); return true; }
  for (let i = 0; i <= cur; i++) if (!slices[i].graded) { cur = i; partSel = 0; buildScoreBtns(); render(); return true; }
  return false;
}

// 本题全部阅完:自动跳到下一个有未评卷的题(循环全题序列);全部阅完则庆祝
async function crossQuestionAdvance() {
  const n = meta.subjective.length, objN = meta.objective.length;
  for (let step = 1; step < n; step++) {
    const q = ((qIndex - 1 + step) % n) + 1;
    try {
      const sl = await jget(`/api/v1/exams/${examId}/slices?q=${q}&grading=1`);
      if (sl.some(x => !x.graded)) {
        toast(`第 ${objN + qIndex} 题已全部阅完,已跳到第 ${objN + q} 题(剩 ${sl.filter(x => !x.graded).length} 卷)`);
        await loadQuestion(q);
        return;
      }
    } catch (e) { /* 单题查询失败不阻塞,继续下一题 */ }
  }
  toast("🎉 全部主观题阅卷完成!可到「学情分析」查看统分结果", 5000);
}

function buildScoreBtns() {
  const box = $("scoreBtns");
  box.innerHTML = "";
  const cap = curPartMax();
  const n = Math.min(10, Math.round(cap));
  for (let s = 0; s <= n; s++) {
    const b = document.createElement("button");
    b.textContent = s;
    b.onclick = () => setScore(s);
    box.appendChild(b);
  }
}

// curPartMax 返回当前打分目标的满分:小问模式取当前小问,整题模式取大题满分。
function curPartMax() {
  if (specParts.length) return specParts[Math.min(partSel, specParts.length - 1)].score;
  return qMax;
}

function preload(count) {
  for (let i = cur; i < Math.min(cur + count, slices.length); i++) {
    const im = new Image(); im.src = slices[i].url;
  }
}

function render() {
  if (!slices.length) return;
  const s = slices[cur];
  // 手工补录卷没有切片原图:占位提示,仍可键盘打分
  $("sliceImg").src = s.missing ? "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320"><rect width="100%" height="100%" fill="#f4f6f8"/><text x="50%" y="48%" font-size="30" fill="#8a94a3" text-anchor="middle" font-family="sans-serif">手工补录卷 · 无切片原图</text><text x="50%" y="62%" font-size="20" fill="#b6bec9" text-anchor="middle" font-family="sans-serif">可直接打分,评分正常计入统计</text></svg>'
  ) : s.url;
  $("sliceImg").onload = syncCanvas;
  $("markOverlay").className = "overlay " + (s.mark || "");
  $("markOverlay").textContent = s.mark === "check" ? "✓" : s.mark === "cross" ? "✗" : s.mark === "flag" ? "⚑" : "";
  // 选做题(版式 v3):提示该生题号区涂选与判分计入的题
  let elecNote = "";
  if (s.elective) {
    const n = s.elective.marks.length;
    const chosenTxt = s.elective.chosen
      ? `判分计入第 ${meta.objective.length + s.elective.chosen} 题`
      : "该组不计分(未涂且无批阅)";
    const marksTxt = n === 1
      ? `已涂 ${s.elective.labels[s.elective.marks[0]]}`
      : n === 0 ? "题号区未涂" : `题号区多涂(${n} 处)`;
    elecNote = ` · 选做 ${s.elective.labels.join("/")}:${marksTxt},${chosenTxt}`;
  }
  $("studentInfo").innerHTML =
    `学生 ${s.student}/${slices.length} · 考号 <b>${s.reg || "?"}</b>${s.regValid ? "" : ' <span style="color:#c0392b">⚠ 无效,请指派</span>'} · 第 ${meta.objective.length + qIndex} 题(满分 ${qMax})${elecNote}`;
  renderParts();
  const activeScore = specParts.length ? partStateOf(s)[partSel].score : s.score;
  const showActive = specParts.length || s.graded;
  [...$("scoreBtns").children].forEach((b, i) => b.classList.toggle("active", showActive && Math.abs(activeScore - i) < 0.01));
  document.querySelectorAll(".markbtns button").forEach(b => b.classList.toggle("active", s.mark === b.dataset.mark));
  const graded = slices.filter(x => x.graded).length;
  $("progressBar").style.width = (100 * graded / slices.length) + "%";
  $("progressText").textContent = `本题已阅 ${graded}/${slices.length}`;
  $("questionStatus").textContent = graded === slices.length ? "本题全部阅完,可切换下一题" : `还有 ${slices.length - graded} 卷未阅`;
  $("assignBox").hidden = s.regValid;
  if (!s.regValid) loadAssign(s.student);
  syncCanvas();
  preload(8);
}

/* —— 异常卷指派 —— */
async function loadAssign(student) {
  const box = $("assignBox");
  box.innerHTML = "推荐候选加载中…";
  try {
    const sug = await jget(`/api/v1/exams/${examId}/suggest/${student}`);
    let html = "考号无效。推荐:";
    for (const c of (sug.suggestions || [])) {
      html += `<span class="chip" onclick="assignReg('${c.reg}')">${c.reg} ${c.name}</span>`;
    }
    if (!(sug.suggestions || []).length) html += " 无(可搜索名册)";
    html += `<input placeholder="输入姓名/考号搜索名册后回车" id="rosterSearch">`;
    box.innerHTML = html;
    $("rosterSearch").onkeydown = async e => {
      if (e.key !== "Enter") return;
      const list = await jget(`/api/v1/exams/${examId}/roster?q=${encodeURIComponent(e.target.value)}`);
      box.querySelectorAll(".chip").forEach(x => x.remove());
      for (const c of list) {
        const sp = document.createElement("span");
        sp.className = "chip";
        sp.textContent = `${c.reg} ${c.name}`;
        sp.onclick = () => assignReg(c.reg);
        box.insertBefore(sp, $("rosterSearch"));
      }
    };
  } catch (err) { box.textContent = "推荐加载失败:" + err.message; }
}
async function assignReg(reg) {
  const s = slices[cur];
  await jpost("/api/v1/assign", { examId, student: s.student, reg });
  s.reg = reg; s.regValid = true;
  render();
}

/* —— 画布同步与手写批注 —— */
function syncCanvas() {
  const img = $("sliceImg"), cv = $("inkCanvas");
  if (!img.complete || !img.naturalWidth) return;
  cv.width = img.clientWidth; cv.height = img.clientHeight;
  redrawInk();
}
function redrawInk() {
  const cv = $("inkCanvas"), ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const st of (slices[cur]?.ink || [])) drawStroke(ctx, st);
  if (curStroke) drawStroke(ctx, curStroke);
}
function drawStroke(ctx, st) {
  ctx.strokeStyle = st.color === "green" ? "#00a152" : "#e53935";
  ctx.beginPath();
  for (let i = 0; i + 1 < st.pts.length; i += 2) {
    const x = st.pts[i] * cv.width, y = st.pts[i + 1] * cv.height;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
}
const cv = document.getElementById("inkCanvas");
cv.addEventListener("pointerdown", e => {
  if (!penOn || !slices.length) return;
  const r = cv.getBoundingClientRect();
  curStroke = { color: "red", pts: [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height] };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  if (!curStroke) return;
  const r = cv.getBoundingClientRect();
  curStroke.pts.push((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
  redrawInk();
});
cv.addEventListener("pointerup", async () => {
  if (!curStroke) return;
  slices[cur].ink = [...(slices[cur].ink || []), curStroke];
  curStroke = null;
  redrawInk();
  await saveGrade();
});

/* —— 小问拆分(版式 v3):逐问打分,大题总分由服务端自动求和 —— */
function partStateOf(s) {
  if (!s.parts) s.parts = specParts.map(() => ({ part: 0, score: 0, graded: false }));
  return s.parts;
}
function renderParts() {
  const box = $("partBox"), s = slices[cur];
  if (!box) return;
  if (!specParts.length) { box.hidden = true; return; }
  const st = partStateOf(s);
  box.hidden = false;
  box.innerHTML = specParts.map((p, i) =>
    `<div class="partrow ${i === partSel ? "sel" : ""}" onclick="partSel=${i};buildScoreBtns();renderParts()">
       <span class="pl">${p.label || "(" + (i + 1) + ")"}</span><span class="pm">满分 ${p.score}</span>
       <span style="flex:1"></span><span class="pv">${st[i].graded ? st[i].score : "–"}</span>
     </div>`).join("")
    + `<div class="ptotal">键盘 0-9 打当前小问分,自动跳下一问;已阅 ${st.filter(x => x.graded).length}/${specParts.length} 问,合计 ${st.filter(x => x.graded).reduce((a, x) => a + x.score, 0)} 分</div>`;
  buildScoreBtns(); // 当前小问变了,快捷分值按钮随之刷新
}

async function setScore(score) {
  const s = slices[cur];
  if (specParts.length) {
    await jpost("/api/v1/grades", { examId, student: s.student, question: qIndex, part: partSel + 1, score, mark: s.mark || "", graded: true, ink: s.ink || [] });
    lastScore = score;
    const st = partStateOf(s);
    st[partSel].score = score;
    st[partSel].graded = true;
    const allPartsDone = st.every(x => x.graded);
    if (partSel < specParts.length - 1) {
      partSel++; // 同卷内自动跳下一小问
      render();
      return;
    }
    // 已是最后一问:全部小问评完 → 自动跳下一份未评卷 / 跨题
    if (autoAdvOn()) {
      if (allPartsDone) {
        if (!jumpNextUngraded()) await crossQuestionAdvance();
        return;
      }
      partSel = 0; buildScoreBtns(); render();
      return;
    }
    render();
    return;
  }
  await jpost("/api/v1/grades", { examId, student: s.student, question: qIndex, score, mark: s.mark || "", graded: true, ink: s.ink || [] });
  lastScore = score;
  Object.assign(s, { graded: true, score });
  if (autoAdvOn()) {
    if (!jumpNextUngraded()) await crossQuestionAdvance();
    return;
  }
  render();
}
async function saveGrade() {
  const s = slices[cur];
  if (specParts.length) { // 笔迹/标注同步写进每个小问(读取端取第 1 问)
    const st = partStateOf(s);
    for (let i = 0; i < specParts.length; i++) {
      await jpost("/api/v1/grades", { examId, student: s.student, question: qIndex, part: i + 1, score: st[i].score, mark: s.mark || "", graded: st[i].graded, ink: s.ink || [] });
    }
    return;
  }
  await jpost("/api/v1/grades", { examId, student: s.student, question: qIndex, score: s.score, mark: s.mark || "", graded: s.graded, ink: s.ink || [] });
}
async function setMark(mark) {
  const s = slices[cur];
  const nextMark = s.mark === mark ? "" : mark;
  s.mark = nextMark;
  if (specParts.length) {
    const st = partStateOf(s);
    for (let i = 0; i < specParts.length; i++) {
      await jpost("/api/v1/grades", { examId, student: s.student, question: qIndex, part: i + 1, score: st[i].score, mark: nextMark, graded: st[i].graded, ink: s.ink || [] });
    }
    render();
    return;
  }
  await jpost("/api/v1/grades", { examId, student: s.student, question: qIndex, score: s.score, mark: nextMark, graded: s.graded, ink: s.ink || [] });
  render();
}

function next() { if (cur < slices.length - 1) { cur++; render(); } }
function prev() { if (cur > 0) { cur--; render(); } }

async function showReport() {
  const rep = await jget(`/api/v1/exams/${examId}/report`);
  const box = $("report");
  box.hidden = false;
  let html = "<table><tr><th>卷号</th><th>考号</th><th>客观</th><th>主观</th><th>总分</th><th>复核</th></tr>";
  for (const s of rep.students) {
    html += `<tr><td>${s.index}</td><td>${s.regNumber || "?"}</td><td>${s.objective}</td><td>${s.subjective}</td><td><b>${s.score}</b>/${rep.total}</td><td>${s.flagged ? "⚑" : ""}</td></tr>`;
  }
  html += `</table>
  <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
    <a href="/api/v1/exams/${examId}/export.xlsx">成绩册 xlsx</a>
    <a href="/api/v1/exams/${examId}/export.csv">csv</a>
    <a href="/api/v1/exams/${examId}/review.pptx">讲评课件 pptx</a>
    <a href="/api/v1/exams/${examId}/export.zip">全量数据包 zip</a>
  </div>`;
  box.innerHTML = html;
}

$("nextBtn").onclick = next;
$("prevBtn").onclick = prev;
document.querySelectorAll(".markbtns button").forEach(b => b.onclick = () => setMark(b.dataset.mark));

window.addEventListener("keydown", e => {
  if (!$("report").hidden && e.key === "Escape") { $("report").hidden = true; return; }
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (!slices.length) return;
  const k = e.key;
  if (k >= "0" && k <= "9" && curPartMax() <= 10) { setScore(+k); e.preventDefault(); }
  else if (k === " ") { setScore(curPartMax()); e.preventDefault(); }
  else if (k === "z" || k === "Z") setScore(0);
  else if (k === "v" || k === "V") setMark("check");
  else if (k === "b" || k === "B") setMark("cross");
  else if (k === "x" || k === "X") setMark("flag");
  else if (k === "p" || k === "P") { penOn = !penOn; $("penBtn").classList.toggle("active", penOn); }
  else if (k === "r" || k === "R") { if (lastScore != null) setScore(lastScore); }
  else if (k === "f" || k === "F") { // 跳到本题下一份未评;全评完提示
    if (!jumpNextUngraded()) toast("本题已全部阅完(打分会自动跨题)");
    e.preventDefault();
  }
  else if (k === "g" || k === "G") { jumpNextFlagged(); e.preventDefault(); } // 待复核队列:⚑ 卷逐份复核
  else if (k === "Enter" || k === "ArrowRight") { next(); e.preventDefault(); }
  else if (k === "Backspace") { prev(); e.preventDefault(); } // 回看上一卷(改分/复查)
  else if (k === "ArrowLeft") { prev(); e.preventDefault(); }
});

// 待复核队列(⚑ 闭环):跳到本题下一份被标「待复核」的卷,复核打分后建议清标(X 再按一次或 V/B)
function jumpNextFlagged() {
  const idx = [...slices.keys()].filter(i => slices[i].mark === "flag" && i !== cur);
  if (!idx.length) {
    toast(cur.mark === "flag" ? "没有其他待复核卷(当前已是)— 复核后可打分覆盖,再按 X 清标" : "本题没有待复核卷");
    return;
  }
  // 从当前位置环形找最近的一份
  idx.sort((a, b) => (a > cur ? a - cur : a + slices.length - cur) - (b > cur ? b - cur : b + slices.length - cur));
  cur = idx[0]; partSel = 0; buildScoreBtns(); render();
  toast(`待复核:第 ${cur + 1} 号卷(⚑ ${idx.length} 份待复核)`);
}

init();
</script>
</body>
</html>
