<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的成绩 · OpenGrade</title>
<link rel="stylesheet" href="/common.css">
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:#f5f7fa; }
  header { display:flex; align-items:center; gap:14px; padding:12px 24px; background:#fff; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; }
  header .u { font-size:13px; color:#66707d; }
  main { max-width:1000px; margin:0 auto; padding:20px 24px; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; }
  a { color:var(--brand); text-decoration:none; }
  .scores { display:flex; gap:32px; margin:6px 0 14px; flex-wrap:wrap; }
  .scores div b { font-size:30px; display:block; }
  .scores div span { font-size:12px; color:#66707d; }
  .wrong { background:#fff2f0; }
  .right { color:var(--brand); }
  .hint { font-size:12px; color:#8a94a3; }
  .free { color:var(--brand); font-size:12px; }
  img.slicepreview { max-width:100%; border:1px solid var(--line); border-radius:6px; margin-top:6px; }
  select { padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:13px; }
  /* 打印成绩单 */
  #printArea { display:none; }
  @media print {
    body > header, .panel, .noprint { display:none !important; }
    #printArea { display:block; padding:0; }
    body { background:#fff; }
    .pa-head { text-align:center; margin-bottom:14px; }
    .pa-head h2 { margin:0 0 4px; font-size:20px; }
    table { font-size:12px; }
    td, th { border:1px solid #999; padding:4px 6px; }
  }
</style>
</head>
<body>
<header>
  <h1>我的成绩</h1>
  <span class="u" id="ogUser"></span>
</header>
<main id="app"></main>
<div id="printArea"></div>
<script src="/common.js"></script>
<script>
let list = [];
let childOf = null; // 家长当前查看的子女考号

async function main() {
  if (!await OG.init()) return;
  if (OG.is("parent")) {
    childOf = (OG.me.children && OG.me.children[0]) || "";
    if (!childOf) { document.getElementById("app").innerHTML = "<div class='panel'>尚未绑定子女考号,请联系管理员在「用户管理」中绑定。</div>"; return; }
  }
  // 首登强制改密(服务端已把其它 API 全部 403):先改密再进成绩页,不再给"即将进入改密页"的空头承诺
  if (OG.me.mustChangePassword || new URLSearchParams(location.search).get("forcePwd") === "1") {
    renderForcePwd();
    return;
  }
  const r = await OG.jget("/api/v1/student/exams" + qs());
  list = r.exams || [];
  unmatched = r.unmatched || 0;
  renderList();
}

let unmatched = 0;

// 子女切换/返回时重拉列表(与详情同一 child 口径,列表与详情不再各说各话)
async function reloadList() {
  try {
    const r = await OG.jget("/api/v1/student/exams" + qs());
    list = r.exams || [];
    unmatched = r.unmatched || 0;
  } catch (e) { OG.toast("列表刷新失败:" + e.message, 4200); return; }
  renderList();
}

function renderForcePwd() {
  document.getElementById("app").innerHTML = `<div class="panel" style="max-width:440px">
    <b>⚠ 首次登录请先修改密码</b>
    <p class="hint" style="margin:8px 0">当前账号仍在使用初始密码。为保护成绩数据,修改密码前无法查询成绩;新密码至少 5 位,请牢记。</p>
    <label style="display:block;margin:8px 0">原密码(初始密码)<input id="fpOld" type="password" style="width:100%"></label>
    <label style="display:block;margin:8px 0">新密码(至少 5 位)<input id="fpNew" type="password" style="width:100%"></label>
    <label style="display:block;margin:8px 0">确认新密码<input id="fpNew2" type="password" style="width:100%"></label>
    <button style="padding:8px 16px;border:0;border-radius:8px;background:var(--brand);color:#fff;cursor:pointer" onclick="doForcePwd()">修改密码</button>
    <span class="hint" id="fpMsg" style="margin-left:10px"></span>
    <p class="hint" style="margin:10px 0 0">忘记初始密码请联系管理员/老师在「用户管理」重置。</p>
  </div>`;
}
async function doForcePwd() {
  const msg = document.getElementById("fpMsg");
  const n1 = document.getElementById("fpNew").value, n2 = document.getElementById("fpNew2").value;
  if (n1 !== n2) { msg.textContent = "两次输入的新密码不一致"; return; }
  try {
    await OG.jpost("/api/v1/auth/password", { oldPassword: document.getElementById("fpOld").value, newPassword: n1 });
    msg.textContent = "已修改 ✓,正在进入成绩页…";
    setTimeout(() => location.href = "/student.html", 600);
  } catch (e) { msg.textContent = e.message; }
}

function qs() { return childOf ? "?child=" + childOf : ""; }

function renderList() {
  let html = "";
  if (childOf) {
    const opts = (OG.me.children || []).map(c => `<option value="${OG.esc(c)}" ${c === childOf ? "selected" : ""}>${OG.esc(c)}</option>`).join("");
    html += `<div class="panel noprint">查看子女:<select onchange="childOf=this.value;reloadList()">${opts}</select></div>`;
  }
  // 账号设置(学生端唯一的自主改密入口;此前除首登强制改密外无法改密码)
  html += `<details class="fold noprint" style="margin-bottom:14px"><summary>账号设置</summary>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">
      <input id="cpOld" type="password" placeholder="当前密码" style="padding:6px 10px;border:1px solid var(--line);border-radius:6px">
      <input id="cpNew" type="password" placeholder="新密码(至少 5 位)" style="padding:6px 10px;border:1px solid var(--line);border-radius:6px">
      <button class="ghost" style="padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer" onclick="changeMyPwd()">修改密码</button>
      <span class="hint" id="cpMsg"></span>
    </div></details>`;
  html += `<div class="panel"><p class="free">基础查分与答卷回溯永久免费 —— 成绩属于你,不属于任何厂商。教师确认发布后即可查看。</p>
  ${unmatched ? `<p class="hint" style="margin:0 0 8px">另有 ${unmatched} 场已发布的考试没有你的答卷 —— 可能未参加,或账号未绑定考号(请联系管理员核对)。</p>` : ""}
  <table><tr><th>考试</th><th>我的得分</th><th>排名</th><th>本班均分</th><th></th></tr>`;
  if (!list.length) html += `<tr><td colspan="5" class="hint">暂无已发布的考试成绩。</td></tr>`;
  for (const e of list) {
    const badge = e.hasReply ? ' <span class="pill" style="background:#e7f5ef;color:var(--brand);border-radius:8px;padding:1px 6px;font-size:11px">复核已回复</span>'
      : (e.hasOpen ? ' <span class="pill" style="background:#fff3cd;color:#9a3412;border-radius:8px;padding:1px 6px;font-size:11px">复核待处理</span>' : "");
    // 考试列用「学科 + 考试日期」识别,12 位随机 ID 降为悬停提示(此前学生只能靠扫描时间认考试)
    const when = e.examDate || (e.createdAt || "").slice(0, 10);
    html += `<tr><td title="考试编号 ${OG.esc(e.id)}"><b>${OG.esc(e.subject || "考试")}</b>${when ? ` <span class="hint">${OG.esc(when)}</span>` : ""}${badge}</td>
      <td>${e.absent ? `<span class="hint">缺考</span>` : `<b>${e.score}</b> / ${e.total}`}</td>
      <td>${e.rank && !e.absent ? `第 ${e.rank} 名` : "-"}</td>
      <td>${e.classMean ? e.classMean.toFixed(1) : "-"}</td>
      <td><a href="#" onclick="showExam('${e.id}');return false">成绩单 / 错题本 / 答卷${e.hasReply ? " / 复核回复" : ""}</a></td></tr>`;
  }
  html += "</table></div><div id='detail'></div><div id='trendPanel'></div>";
  document.getElementById("app").innerHTML = html;
  loadTrend();
}

// 自主改密(POST /api/v1/auth/password 对全体登录角色开放)
async function changeMyPwd() {
  const msg = document.getElementById("cpMsg");
  const pw = document.getElementById("cpNew").value;
  if (pw.length < 5) { msg.textContent = "新密码至少 5 位"; return; }
  try {
    await OG.jpost("/api/v1/auth/password", { oldPassword: document.getElementById("cpOld").value, newPassword: pw });
    msg.textContent = "已修改 ✓";
    document.getElementById("cpOld").value = "";
    document.getElementById("cpNew").value = "";
    OG.toast("密码已修改");
  } catch (e) { msg.textContent = e.message; }
}

/* —— 历次成绩趋势(跨考试按考号对齐) —— */
async function loadTrend() {
  const box = document.getElementById("trendPanel");
  if (!box) return;
  let t;
  try { t = await OG.jget("/api/v1/student/trends" + qs()); } catch (e) { return; }
  const pts = t.points || [];
  if (!pts.length) { box.innerHTML = ""; return; }
  const groups = {};
  for (const p of pts) { const k = p.subject || "历次考试"; (groups[k] = groups[k] || []).push(p); }
  let html = `<div class="panel noprint"><b>历次成绩趋势</b>
    <span class="hint">按考号跨考试对齐 · 曲线为得分率(不同满分可比)·「进退」= 名次较上一场变化 · 缺考在图中断开</span>`;
  Object.entries(groups).forEach(([subj, g], gi) => {
    html += `<p style="margin:14px 0 4px"><b>${subj}</b>(共 ${g.length} 场)
      <table><tr><th>日期</th><th>得分</th><th>班级均分</th><th>年级排名</th><th>班级排名</th><th>名次进退</th></tr>`;
    g.forEach((p, i) => {
      let delta = "—";
      if (i > 0 && !p.absent && g[i - 1].rank && p.rank) {
        const d = g[i - 1].rank - p.rank;
        delta = d === 0 ? "—" : d > 0 ? `<b style="color:var(--brand)">↑${d}</b>` : `<b style="color:var(--bad)">↓${-d}</b>`;
      }
      html += `<tr><td>${p.date}</td>
        <td>${p.absent ? `<span class="hint">缺考</span>` : `<b>${p.score}</b> / ${p.total}`}</td>
        <td>${(p.classMean || p.mean) ? (p.classMean || p.mean).toFixed(1) : "-"}</td>
        <td>${p.rank || "-"}</td><td>${p.classRank || "-"}</td><td>${delta}</td></tr>`;
    });
    html += `</table><canvas id="trendCv${gi}" width="660" height="200"></canvas>`;
  });
  html += `</div>`;
  box.innerHTML = html;
  Object.entries(groups).forEach(([subj, g], gi) => {
    OG.chartLine(document.getElementById("trendCv" + gi), g.map(p => p.date.slice(5)), [
      { name: "我的得分率%", color: "#00b389", values: g.map(p => p.absent ? null : Math.round(p.rate * 1000) / 10) },
      { name: "班级/年级均分率%", color: "#9aa7b6", values: g.map(p => { const m = p.classMean || p.mean; return (m && p.total) ? Math.round(m / p.total * 1000) / 10 : null; }) },
    ], v => v.toFixed(0) + "%");
  });
}

let curExam = null;
async function showExam(id) {
  const d = await OG.jget(`/api/v1/student/exams/${id}${qs()}`);
  curExam = d;
  if (d.absent) { // 缺考:只有登记信息
    document.getElementById("detail").innerHTML = `<div class="panel">
      本场考试(${OG.esc(d.subject || "未分学科")} · ${d.createdAt})登记为 <b>缺考</b>,无成绩明细。如有疑问请联系任课老师。</div>`;
    return;
  }
  const kindName = k => ({ choice: "单选", judge: "判断", multiple: "多选", fillblank: "填空", subjective: "解答" }[k] || k);
  let html = `<div class="panel">
    <div class="scores">
      <div><b>${d.score}</b><span>总分 / ${d.total}</span></div>
      <div><b>${d.rank}</b><span>年级排名(共 ${d.count} 人)</span></div>
      <div><b>${d.classRank || "-"}</b><span>班级排名</span></div>
      <div><b>${d.mean.toFixed(1)}</b><span>年级均分</span></div>
      <div><b>${d.wrongQuestions.length}</b><span>待弄懂的错题</span></div>
    </div>
    ${d.byClass.map(c => `<span class="hint">${OG.esc(c.class)}:均分 ${c.mean.toFixed(1)}(${c.count}人)&nbsp;&nbsp;</span>`).join("")}
    <div style="margin-top:10px;display:flex;gap:16px;flex-wrap:wrap" class="noprint">
      <a href="#" onclick="printReport();return false">🖨 打印成绩报告单</a>
      <a href="#" onclick="downloadPDF('${d.id}');return false">⬇ 下载 PDF 成绩单</a>
      <a href="#" onclick="makePractice('${d.id}');return false">✎ 错题重练卡</a>
      <a href="#" onclick="toggleAppeal();return false">🙋 成绩复核申请</a>
      ${d.pageURL ? `<a href="${d.pageURL}" target="_blank">查看我的整卷(答卷回溯)→</a>` : ""}
    </div>
    <div id="appealBox" class="noprint" style="margin-top:10px;background:var(--bg);border-radius:8px;padding:10px 12px" hidden>
      <textarea id="appealReason" rows="2" maxlength="200" placeholder="请填写复核理由(哪一题、为什么有疑问),200 字以内"
        style="width:100%;max-width:520px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit" oninput="appealCount()"></textarea>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px">
        <button class="ghost" id="appealBtn" style="padding:6px 16px;border:1px solid var(--brand);color:var(--brand);border-radius:8px;background:#fff;cursor:pointer" onclick="submitAppeal('${d.id}')">提交申请</button>
        <span class="hint" id="appealMsg"></span>
        <span class="hint" id="appealCnt" style="margin-left:auto">0/200</span>
      </div>
      <p class="hint" style="margin:6px 0 0">提交后任课教师会核对你的答卷并回复;同一时间只能有一条待处理的申请;改分以教师复核结果为准。</p>
    </div>`;
  // 我的复核申请记录
  if ((d.appeals || []).length) {
    html += `<div class="panel"><b>我的复核申请</b>
      <table><tr><th>时间</th><th>理由</th><th>状态</th><th>教师回复</th></tr>
      ${d.appeals.map(a => `<tr><td>${OG.esc(a.time)}</td><td style="max-width:360px">${OG.esc(a.reason)}</td>
        <td>${a.status === "open" ? '<span class="hint">待处理</span>' : '<b style="color:var(--brand)">已回复</b>'}</td>
        <td>${OG.esc(a.reply || "-")}</td></tr>`).join("")}</table></div>`;
  }
  // 知识点掌握雷达(仅本人)
  if ((d.knowledge || []).length) {
    html += `<div class="panel"><b>我的知识点掌握度</b>
      <span class="hint">掌握度 = 该知识点相关题目的得分率;掌握度低的排前面,可优先补。</span>
      <canvas id="myKnowChart" width="760" height="${Math.max(100, d.knowledge.length * 30 + 30)}" style="margin-top:10px"></canvas>
      <table style="margin-top:8px"><tr><th>知识点</th><th>掌握度</th><th>涉及总分</th></tr>
      ${d.knowledge.map(k => `<tr><td>${OG.esc(k.name)}</td><td><span class="bar" style="display:inline-block;width:120px;height:8px;background:#eef2f6;border-radius:4px;vertical-align:middle"><div style="height:100%;border-radius:4px;width:${Math.round(k.rate*100)}%;background:${k.rate<0.5?'#e34d59':k.rate<0.75?'#ff8c00':'#00b389'}"></div></span> ${(k.rate*100).toFixed(0)}%</td><td>${k.max}</td></tr>`).join("")}
      </table></div>`;
  }
  html += `<div class="panel"><b>逐题明细</b>(标红为错题/丢分题)
    <table id="qtable"><tr><th>题号</th><th>题型</th><th>满分</th><th>我的作答/得分</th><th>参考答案</th></tr>`;
  for (const q of d.questions) {
    if (q.notCounted) { // 选做题未被所选:不计分(版式 v3)
      html += `<tr><td>${q.index}</td><td>${kindName(q.kind)}</td><td>${q.max}</td>
        <td><span class="hint">选做 ${q.elective || ""} · 未选做,不计分</span></td><td>-</td></tr>`;
      continue;
    }
    if (q.pending) { // 主观题评卷中(复核改分窗口):不按 0 分进错题本
      html += `<tr><td>${q.index}</td><td>${kindName(q.kind)}</td><td>${q.max}</td>
        <td><span class="hint">评卷中…</span></td><td>-</td></tr>`;
      continue;
    }
    const mine = q.myAnswer !== undefined && q.myAnswer !== ""
      ? OG.esc(q.myAnswer) + (q.right ? "" : "(错)")
      : (q.myScore !== undefined ? `${q.myScore} 分` : "-");
    const kindTxt = q.elective ? `${kindName(q.kind)}<span class="hint">·选做${OG.esc(q.elective)}</span>` : kindName(q.kind);
    html += `<tr class="${q.wrong ? 'wrong' : ''}"><td>${q.index}</td><td>${kindTxt}</td><td>${q.max}</td>
      <td>${mine}</td><td class="${q.right ? 'right' : ''}">${OG.esc(q.correct || "-")}</td></tr>`;
  }
  html += `</table></div>`;
  if ((d.slices || []).length) {
    html += `<div class="panel"><b>我的主观题作答</b>`;
    for (const s of d.slices) {
      html += `<p class="hint" style="margin:10px 0 2px">第 ${s.question} 题</p><img class="slicepreview" loading="lazy" src="${s.url}">`;
    }
    html += `</div>`;
  }
  document.getElementById("detail").innerHTML = html;
  document.getElementById("detail").scrollIntoView({ behavior: "smooth" });
  if ((d.knowledge || []).length) drawMyKnowledge(d.knowledge);
}

function drawMyKnowledge(ks) {
  const cv = document.getElementById("myKnowChart");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height, padL = 130, padR = 56, rowH = 30;
  ctx.clearRect(0, 0, W, H);
  ctx.font = "12px sans-serif";
  ks.forEach((k, i) => {
    const y = 14 + i * rowH;
    ctx.fillStyle = "#1c2430"; ctx.textAlign = "right";
    ctx.fillText(k.name.length > 12 ? k.name.slice(0, 12) + "…" : k.name, padL - 8, y + 12);
    const barW = W - padL - padR;
    ctx.fillStyle = "#eef2f6"; ctx.fillRect(padL, y, barW, 16);
    ctx.fillStyle = k.rate < 0.5 ? "#e34d59" : k.rate < 0.75 ? "#ff8c00" : "#00b389";
    ctx.fillRect(padL, y, barW * Math.max(0, Math.min(1, k.rate)), 16);
    ctx.fillStyle = "#1c2430"; ctx.textAlign = "left";
    ctx.fillText((k.rate * 100).toFixed(0) + "%", padL + barW + 8, y + 12);
  });
}

// 下载服务端生成的 PDF 成绩单
function downloadPDF(id) {
  window.open(`/api/v1/student/exams/${id}/report.pdf${qs()}`, "_blank");
}

/* —— 成绩复核申请(发布后可发起;教师裁决后在「我的复核申请」看回复) —— */
function toggleAppeal() {
  const box = document.getElementById("appealBox");
  if (box) box.hidden = !box.hidden;
}
function appealCount() {
  const n = (document.getElementById("appealReason") || {}).value.length || 0;
  const el = document.getElementById("appealCnt");
  if (el) el.textContent = `${n}/200`;
}
async function submitAppeal(id) {
  const msg = document.getElementById("appealMsg");
  const btn = document.getElementById("appealBtn");
  const reason = (document.getElementById("appealReason") || {}).value || "";
  if (!reason.trim()) { if (msg) msg.textContent = "请先填写复核理由"; return; }
  if (btn) { btn.disabled = true; btn.textContent = "提交中…"; } // 防双击重复提交
  try {
    await OG.jpost(`/api/v1/student/exams/${id}/appeals${qs()}`, { reason });
    OG.toast("复核申请已提交,请等待老师处理");
    await showExam(id); // 重开详情:下方「我的复核申请」出现新记录(状态待处理)
    const box = document.getElementById("appealBox");
    if (box) box.hidden = false; // 保持展开:让提交者立刻看到记录与状态
  } catch (e) {
    if (msg) msg.textContent = e.message; // 被拉黑/重复申请/未发布等拒绝原因在这里说清楚
    OG.toast(e.message, 4200);
  } finally {
    if (btn && document.body.contains(btn)) { btn.disabled = false; btn.textContent = "提交申请"; }
    else {
      const nb = document.getElementById("appealBtn");
      if (nb) { nb.disabled = false; nb.textContent = "提交申请"; }
    }
  }
}

// 错题重练卡:拉取错题重组概要 → 服务端直接出可打印 SVG → 新窗口打开
// (版式在服务端按本人错题重建,不再借道 staff-only 的 /api/v1/cards)
async function makePractice(id) {
  try {
    const r = await OG.jget(`/api/v1/student/exams/${id}/practice${qs()}`);
    const svg = await fetch(`/api/v1/student/exams/${id}/practice.svg${qs()}`).then(x => {
      if (!x.ok) throw new Error("生成练习卡失败(" + x.status + ")");
      return x.text();
    });
    const w = window.open("", "_blank");
    w.document.write(`<title>错题重练卡 · ${r.questions.length} 题</title>
      <div style="font-family:sans-serif;padding:12px">
      <p>重练题号(原卷):${r.questions.join("、")} · 客观 ${r.objective} 题 + 主观 ${r.subjective} 题。
      打印后可直接作答;保留知识点标签,便于针对性补弱。</p>
      <button onclick="print()">🖨 打印</button></div>${svg}`);
    w.document.close();
  } catch (e) { OG.toast(e.message, 4200); }
}

/* 打印版个人成绩单 */
function printReport() {
  const d = curExam;
  if (!d) return;
  const kindName = k => ({ choice: "单选", judge: "判断", multiple: "多选", fillblank: "填空", subjective: "解答" }[k] || k);
  let rows = "";
  for (const q of d.questions) {
    if (q.notCounted) { // 选做题未被所选:不计分(版式 v3)
      rows += `<tr><td>${q.index}</td><td>${kindName(q.kind)}</td><td>${q.max}</td><td>未选做,不计分</td><td>-</td></tr>`;
      continue;
    }
    if (q.pending) { // 主观题评卷中:打印版与屏显同口径,不得显示成 0 分
      rows += `<tr><td>${q.index}</td><td>${kindName(q.kind)}</td><td>${q.max}</td><td>评卷中…</td><td>-</td></tr>`;
      continue;
    }
    const mine = q.myAnswer !== undefined && q.myAnswer !== "" ? OG.esc(q.myAnswer) : (q.myScore !== undefined ? `${q.myScore} 分` : "-");
    rows += `<tr><td>${q.index}</td><td>${kindName(q.kind)}</td><td>${q.max}</td><td>${mine}</td><td>${OG.esc(q.correct || "-")}</td></tr>`;
  }
  document.getElementById("printArea").innerHTML = `
    <div class="pa-head"><h2>个人成绩报告单</h2>
      <p style="margin:0;font-size:12px">OpenGrade 开元智阅 · 考试 ${OG.esc(d.id)} · ${d.createdAt}${d.subject ? " · " + OG.esc(d.subject) : ""}</p></div>
    <p style="font-size:13px">考号 <b>${OG.esc(d.reg)}</b> · 班级 ${OG.esc(d.class || "-")} ·
      总分 <b>${d.score} / ${d.total}</b> · 年级排名 ${d.rank}/${d.count} · 班级排名 ${d.classRank || "-"} · 年级均分 ${d.mean.toFixed(1)}</p>
    <table><tr><th>题号</th><th>题型</th><th>满分</th><th>我的作答/得分</th><th>参考答案</th></tr>${rows}</table>
    <p style="font-size:11px;color:#666;margin-top:10px">本报告单由学校本机系统生成,成绩数据归学校与学生本人所有。</p>`;
  window.print();
}

/* 错题重练卡功能已并入「错题本」:此处仅保留成绩报告单打印 */

window.printReport = printReport;
main();
</script>
