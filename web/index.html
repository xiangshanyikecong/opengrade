<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenGrade · 答题卡设计器与考试工作台</title>
<link rel="stylesheet" href="/common.css">
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:#f5f7fa; }
  header { display:flex; align-items:center; gap:10px; padding:10px 24px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  header .mark { width:30px; height:30px; border-radius:8px; background:var(--brand); color:#fff; display:grid; place-items:center; font-size:15px; font-weight:700; }
  header h1 { margin:0; font-size:16px; }
  header .sub { font-size:12px; color:var(--text2); }
  nav.tabs { display:flex; gap:22px; padding:0 24px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:51px; z-index:10; }
  nav.tabs button { border:0; background:none; padding:10px 2px; font-size:14px; cursor:pointer; color:var(--ink); border-bottom:2px solid transparent; }
  nav.tabs button.active { color:var(--brand); border-bottom-color:var(--brand); font-weight:600; }
  main { padding:18px 24px; max-width:1080px; margin:0 auto; }
  main[hidden] { display:none; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:10px; padding:20px; }
  /* 双模式:编辑(全宽表单,行按钮永不被预览遮挡)/ 预览(全宽卡面) */
  .modebar { display:flex; gap:8px; align-items:center; margin-bottom:14px; position:sticky; top:96px; z-index:5;
    background:var(--bg); padding:8px 10px; border-radius:8px; }
  .modebar button { padding:8px 18px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:14px; cursor:pointer; }
  .modebar button.active { background:var(--brand); border-color:var(--brand); color:#fff; }
  #tab-design[data-mode="edit"] .preview-wrap { display:none; }
  #tab-design[data-mode="preview"] .controls { display:none; }
  .preview-wrap { display:grid; gap:8px; align-content:start; }
  .controls { display:grid; gap:12px; }
  label { font-size:13px; color:#4b5563; display:grid; gap:4px; }
  input, select, textarea { padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:14px; font-family:inherit; }
  button.primary { padding:10px 14px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-size:14px; cursor:pointer; }
  button.secondary { padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:#eef2f6; color:var(--ink); font-size:13px; cursor:pointer; }
  .spec { display:grid; grid-template-columns:26px 1fr 0.8fr 0.8fr auto auto auto; gap:5px; align-items:center; margin-bottom:5px; }
  .spec input, .spec select { padding:6px; }
  .spec .qno { font-size:12px; color:var(--text2); text-align:center; }
  .spec .know { grid-column:1/-1; }
  .spec .mv { border:0; background:none; color:var(--text2); cursor:pointer; font-size:12px; padding:2px 3px; }
  .spec .mv:hover { color:var(--brand); }
  .del { border:0; background:none; color:var(--bad); cursor:pointer; font-size:15px; }
  .totalbar { display:flex; gap:16px; align-items:center; font-size:13px; color:var(--ink); background:var(--brand-light); border-radius:8px; padding:8px 12px; }
  .totalbar b { color:var(--brand); font-size:16px; }
  .group-title { font-size:13px; font-weight:600; color:#374151; margin-top:4px; }
  .preview { min-height:60vh; overflow:auto; display:grid; place-items:start center; }
  .preview svg { height:84vh; max-width:100%; box-shadow:0 6px 24px rgba(16,24,40,.12); border-radius:4px; background:#fff; }
  .hint { font-size:12px; color:#8a94a3; margin:0; }
  .ok { color:var(--brand); font-size:13px; }
  .err { color:#c2410c; font-size:13px; white-space:pre-wrap; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; }
  a { color:var(--brand); }
</style>
</head>
<body>
<header>
  <span class="mark">开</span>
  <div><h1>开元智阅 · 答题卡设计器</h1><div class="sub">出卡 → 扫描 → 判读 → 建考,与教师工作台同账号</div></div>
  <span style="flex:1"></span>
  <a href="/teacher.html">教师工作台</a>
  <span class="u" id="ogUser" style="font-size:13px;color:var(--text2)"></span>
</header>
<nav class="tabs">
  <button class="active" data-tab="design">① 设计答题卡</button>
  <button data-tab="exam">② 建考与阅卷</button>
</nav>

<main id="tab-design" data-mode="edit">
  <div class="modebar">
    <button id="modeEdit" class="active" onclick="setDesignMode('edit')">✏️ 编辑题目</button>
    <button id="modePreview" onclick="setDesignMode('preview')">👁 预览答题卡</button>
    <span class="hint">编辑模式下全宽操作,不再被预览遮挡;点「生成」自动切换到预览。</span>
  </div>
  <section class="panel controls">
    <label>卷头标题(中文经 SVG 打印;位图预览中非 ASCII 以 ? 显示)
      <input id="title" value="高一(3)班 月考答题卡">
    </label>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
      <label>考号位数 <input id="reg" type="number" value="8" min="0" max="12"></label>
      <label>客观题分栏 <input id="columns" type="number" value="2" min="1" max="4"></label>
    </div>
    <label>考号通道(条码/二维码印在卷头右侧;双通道可用码修复涂卡漏涂,建议高速扫描选双通道)
      <select id="regMode">
        <option value="fill">填涂(默认)</option>
        <option value="fill+barcode">填涂 + 条码(双通道,推荐)</option>
        <option value="fill+qr">填涂 + 二维码(双通道)</option>
        <option value="barcode">仅条码</option>
        <option value="qr">仅二维码</option>
      </select>
    </label>
    <div class="group-title">客观题(一题一行:可单独删除 / 上下移动 / 改分值;批量插入一次加一段)</div>
    <div id="objSpecs"></div>
    <button class="secondary" onclick="addObj()">+ 加 1 道客观题</button>
    <button class="secondary" onclick="batchObj()">⇩ 批量插入客观题…</button>
    <div class="group-title">主观题(留白作答区,切片后人工阅卷)</div>
    <div id="subSpecs"></div>
    <div class="totalbar">卷面合计 <b id="totalScore">-</b><span class="hint" id="totalDetail"></span></div>
    <button class="secondary" onclick="addSub()">+ 加一道主观题</button>
    <button class="secondary" id="bankPickBtn" onclick="pickBank()">⇩ 从题库选题</button>
    <div id="bankPick" hidden style="border:1px solid var(--line);border-radius:8px;padding:10px;max-height:300px;overflow:auto"></div>
    <button class="primary" id="gen">生成 / 刷新预览</button>
    <button class="secondary" id="download" disabled>下载 SVG(可打印)</button>
    <div class="err" id="designMsg"></div>
  </section>
  <div class="preview-wrap">
    <div id="pageTabs" class="hint no-print" style="min-height:20px"></div>
    <div style="display:flex; gap:8px" class="no-print">
      <button class="secondary" onclick="setDesignMode('edit')">✏️ 返回编辑</button>
      <span style="flex:1"></span>
      <button class="secondary" id="download2" onclick="document.getElementById('download').click()" disabled>下载 SVG(可打印)</button>
    </div>
    <section class="panel preview" id="preview">点击"生成"预览</section>
  </div>
</main>

<main id="tab-exam" hidden>
  <section class="panel controls">
    <div class="group-title">创建考试</div>
    <label>版式 JSON(设计器生成的可整段粘贴过来)
      <textarea id="examLayout" rows="8" placeholder='{"version":2, ...}'></textarea>
    </label>
    <label>客观题参考答案(JSON 数组,如 ["A","T","AC",...];判断题用 T/F,多选题如 "AC")
      <textarea id="examKey" rows="3" placeholder='["A","B","T",...]'></textarea>
    </label>
    <button class="secondary" onclick="bankKey()">⇩ 从题库带出客观题答案</button>
    <span class="hint">按版式题序生成;未从题库插入的题为 ?,请手工补齐后使用(会覆盖上面文本框)</span>
    <label>学科(教师按学科过滤考试,如 数学/语文/英语)
      <input id="examSubject" placeholder="数学">
    </label>
    <label>学生名册(可选,JSON 数组或 CSV"考号,姓名,班级";用于异常卷考号推荐指派)
      <textarea id="examRoster" rows="3" placeholder='[{"reg":"20250001","name":"李雷","class":"三年二班"}] 或 20250001,李雷,三年二班'></textarea>
    </label>
    <label>二值化方式
      <select id="threshold"><option value="otsu">全局 Otsu(常规扫描)</option><option value="adaptive">局部自适应(阴影/翻拍)</option></select>
    </label>
    <label>整卷扫描件(可多选;多页版式每名学生连续上传全部页,按份扫描的自然顺序即可)
      <input id="examImages" type="file" accept="image/png,image/jpeg" multiple>
    </label>
    <button class="primary" id="createExam">创建考试并切片</button>
    <p class="hint">也可在<a href="/teacher.html" target="_blank">教师工作台 → 新建考试</a>创建(版式已自动同步)。</p>
    <div class="err" id="examMsg"></div>
  </section>
  <section class="panel" style="flex:1">
    <div class="group-title">已创建的考试(数据在本机 data/ 目录)</div>
    <table id="examList"><tr><th>考试</th><th>时间</th><th>卷数</th><th>题型</th><th></th></tr></table>
  </section>
</main>

<script src="/common.js"></script>
<script>
const $ = id => document.getElementById(id);
OG.init();

// —— Tab 切换 ——
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav.tabs button").forEach(x => x.classList.toggle("active", x === b));
  $("tab-design").hidden = b.dataset.tab !== "design";
  $("tab-exam").hidden = b.dataset.tab !== "exam";
  if (b.dataset.tab === "exam") refreshExams();
});

// —— 设计器:逐题编辑(一题一行,可单独删除/上下移动;批量插入一次加一段)——
function addObj(kind = "choice", options = 4, score = 2, knowledge = "") {
  const div = document.createElement("div");
  div.className = "spec";
  div.innerHTML = `
    <span class="qno"></span>
    <select class="k" title="题型">
      <option value="choice">单选</option><option value="judge">判断</option><option value="multiple">多选</option>
    </select>
    <input type="number" class="o" value="${options}" min="2" max="6" title="选项数">
    <input type="number" class="s" value="${score}" min="0.5" step="0.5" title="分值">
    <button class="mv" title="上移" onclick="moveSpec(this,-1)">▲</button>
    <button class="mv" title="下移" onclick="moveSpec(this,1)">▼</button>
    <button class="del" title="删除本题" onclick="delSpec(this)">×</button>
    <input type="text" class="kn know" placeholder="知识点标签(可空,多个用 , 或 、 分隔,如 函数、导数)" title="用于学情掌握度分析">`;
  div.querySelector(".k").value = kind;
  if (knowledge) div.querySelector(".kn").value = knowledge;
  syncObjRow(div);
  $("objSpecs").appendChild(div);
  refreshQnos(); updateTotal();
  return div;
}
function syncObjRow(div) {
  div.querySelector(".o").style.visibility = div.querySelector(".k").value === "judge" ? "hidden" : "visible";
  div.querySelector(".k").onchange = e => syncObjRow(e.target.closest(".spec"));
}
function batchObj() {
  const n = parseInt(prompt("批量插入几道客观题?(插入到列表末尾)", "20"), 10);
  if (!n || n < 1) return;
  const kind = (prompt("题型:choice(单选)/ judge(判断)/ multiple(多选)", "choice") || "choice").trim();
  const options = parseInt(prompt("每题选项数(判断题忽略)", "4"), 10) || 4;
  const score = parseFloat(prompt("每题分值", "2")) || 2;
  for (let i = 0; i < n; i++) addObj(kind, options, score);
}
function moveSpec(btn, dir) {
  const row = btn.closest(".spec"), parent = row.parentNode;
  if (dir < 0 && row.previousElementSibling) parent.insertBefore(row, row.previousElementSibling);
  if (dir > 0 && row.nextElementSibling) parent.insertBefore(row.nextElementSibling, row);
  refreshQnos();
}
function delSpec(btn) {
  btn.closest(".spec").remove();
  refreshQnos(); updateTotal();
}
function refreshQnos() {
  [...$("objSpecs").querySelectorAll(".spec")].forEach((row, i) => row.querySelector(".qno").textContent = i + 1);
}
// 卷面总分实时统计(客观分值之和 + 主观分值,拆小问取小问之和)
function updateTotal() {
  let n = 0, objTotal = 0, subTotal = 0;
  [...$("objSpecs").querySelectorAll(".spec")].forEach(row => {
    n++; objTotal += parseFloat(row.querySelector(".s").value) || 0;
  });
  [...$("subSpecs").querySelectorAll(".spec")].forEach(row => {
    n++;
    const parts = row.querySelector(".p").value.split(/[,，\s]+/).map(parseFloat).filter(x => x > 0);
    subTotal += parts.length ? parts.reduce((a, b) => a + b, 0) : (parseFloat(row.querySelector(".s").value) || 0);
  });
  const total = objTotal + subTotal;
  $("totalScore").textContent = total > 0 ? total + " 分" : "-";
  $("totalDetail").textContent = n ? `共 ${n} 题(客观 ${objTotal} 分 + 主观 ${subTotal} 分)` : "尚未添加题目";
}
function addSub(kind = "fillblank", label = "", score = 5, height = 16, parts = "", elective = "", knowledge = "") {
  const div = document.createElement("div");
  div.className = "spec";
  div.innerHTML = `
    <span class="qno"></span>
    <select class="k"><option value="fillblank">填空</option><option value="subjective">解答</option></select>
    <input type="text" class="l" value="${label}" placeholder="题干(可空)">
    <input type="number" class="s" value="${score}" title="满分">
    <button class="mv" title="上移" onclick="moveSpec(this,-1)">▲</button>
    <button class="mv" title="下移" onclick="moveSpec(this,1)">▼</button>
    <button class="del" title="删除本题" onclick="delSpec(this)">×</button>
    <input type="number" class="h" value="${height}" min="4" max="120" title="作答区高度 mm" style="grid-column:span 2">
    <input type="text" class="p" value="${parts}" placeholder="拆小问分值,如 6,5,6(留空=整题一问)">
    <input type="text" class="e" value="${elective}" placeholder="选做组(如 A;同组题互为多选一,2~4 道)" title="选做题:卡面印题号区,判分只取学生涂选的题">
    <input type="text" class="kn know" placeholder="知识点标签(可空,多个用 , 或 、 分隔)" title="用于学情掌握度分析">`;
  div.querySelector(".k").value = kind;
  if (knowledge) div.querySelector(".kn").value = knowledge;
  $("subSpecs").appendChild(div);
  updateTotal();
  return div;
}
for (let i = 0; i < 20; i++) addObj("choice", 4, 2);
for (let i = 0; i < 5; i++) addObj("judge", 2, 2);
for (let i = 0; i < 5; i++) addObj("multiple", 4, 2);
addSub("fillblank", "", 5, 16); addSub("subjective", "", 10, 42);

function buildLayout() {
  const questions = [];
  [...$("objSpecs").children].forEach((d, i) => {
    const kind = d.querySelector(".k").value;
    const options = +d.querySelector(".o").value, score = +d.querySelector(".s").value;
    const knowledge = d.querySelector(".kn").value.trim();
    const bankId = d.dataset.bankId || "";
    questions.push({ kind, options, score, knowledge, bankId });
  });
  const subjectives = [...$("subSpecs").children].map(d => {
    const subj = {
      kind: d.querySelector(".k").value, label: d.querySelector(".l").value,
      score: +d.querySelector(".s").value, heightMM: +d.querySelector(".h").value,
      knowledge: d.querySelector(".kn").value.trim(),
    };
    const parts = d.querySelector(".p").value.split(/[,，\s]+/).map(x => parseFloat(x)).filter(x => x > 0);
    if (parts.length) subj.parts = parts.map(s => ({ score: s })); // 版式 v3:一道大题拆多问分别给分
    const elective = d.querySelector(".e").value.trim();
    if (elective) subj.elective = elective; // 版式 v3:同组选做题,判分只取学生所涂题号
    if (d.dataset.bankId) subj.bankId = d.dataset.bankId; // 题库选题:建考后回记使用史
    return subj;
  });
  const regMode = $("regMode").value;
  return { version: 2, title: $("title").value, regDigits: +$("reg").value, regMode, columns: +$("columns").value, questions, subjectives };
}

// —— 校本题库选题:插入版式(题型/选项/分值/知识点随题带出),客观题答案随题记录 ——
let bankCache = [];
async function pickBank() {
  const box = $("bankPick");
  if (!box.hidden) { box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = `<p class="hint">题库加载中…(先到「教师工作台 → 题库」录入)</p>`;
  try { bankCache = await (await fetch("/api/v1/bank")).json(); } catch (e) { bankCache = []; }
  if (!bankCache.length) { box.innerHTML = `<p class="hint">题库为空。到「教师工作台 → 题库」录入后即可在此选题。</p>`; return; }
  const kn = { choice: "单选", judge: "判断", multiple: "多选", fillblank: "填空", subjective: "解答" };
  box.innerHTML = bankCache.map(it => `<label style="display:block;font-size:13px;padding:3px 0">
      <input type="checkbox" data-id="${it.id}">
      [${kn[it.kind] || it.kind}${it.options ? " " + it.options + "选" : ""} ${it.score || "?"} 分] ${it.stem || "(无题干)"}
      <span class="hint">答:${it.answer || "-"} · ${it.knowledge || ""}${it.difficulty ? " · " + it.difficulty : ""}</span>
    </label>`).join("") + `<button class="primary" onclick="insertBank()">插入所选</button> <span class="hint" id="pickMsg"></span>`;
}
function insertBank() {
  const boxes = [...document.querySelectorAll("#bankPick input[type=checkbox]:checked")];
  let n = 0;
  for (const cb of boxes) {
    const it = bankCache.find(x => x.id === cb.dataset.id);
    if (!it) continue;
    if (it.kind === "fillblank" || it.kind === "subjective") {
      const div = addSub(it.kind, it.stem, it.score || (it.kind === "fillblank" ? 5 : 10),
        it.kind === "fillblank" ? 16 : 42, "", "", it.knowledge);
      div.dataset.answer = it.answer || "";
      div.dataset.bankId = it.id; // 建考后自动回记「被本场考试使用」
    } else {
      const div = addObj(it.kind, it.options || 4, it.score || 2, it.knowledge);
      div.dataset.answer = it.answer || "";
      div.dataset.bankId = it.id;
    }
    n++;
  }
  $("pickMsg").textContent = `已插入 ${n} 题。客观题答案在「建考与阅卷」页用「从题库带出客观题答案」一键生成。`;
}

// 按当前版式客观题题序从题库带出参考答案(dataset.answer 随题库插入记录;缺答案的题为 ?)
function bankKey() {
  const key = [];
  [...$("objSpecs").children].forEach(d => { // 逐题模式:一题一行
    key.push(d.dataset.answer || "?");
  });
  $("examKey").value = JSON.stringify(key);
  $("examMsg").className = "ok";
  $("examMsg").textContent = `已按题库带出 ${key.length} 道客观题答案(?处请手工补齐)。`;
  stashLastKey();
}
// 答案随版式同步到教师工作台(og.lastKey):工作台「载入最近版式」时一并带出,建考零手填
function stashLastKey() {
  const raw = $("examKey").value.trim();
  if (!raw) return;
  try {
    const arr = JSON.parse(raw);
    if (Array.isArray(arr) && arr.every(v => typeof v === "string")) {
      localStorage.setItem("og.lastKey", JSON.stringify(arr.map(v => v.toUpperCase())));
    }
  } catch (_) { /* 手填中的半成品不阻断 */ }
}

let currentSVG = null;
function setDesignMode(mode) {
  const main = document.getElementById("tab-design");
  main.dataset.mode = mode;
  document.getElementById("modeEdit").classList.toggle("active", mode === "edit");
  document.getElementById("modePreview").classList.toggle("active", mode === "preview");
}
let pageCount = 1, pageNow = 1;
async function gen() {
  $("designMsg").textContent = "";
  const res = await fetch(`/api/v1/cards?page=${pageNow}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ layout: buildLayout() }) });
  if (!res.ok) { $("designMsg").className = "err"; $("designMsg").textContent = (await res.json()).error; return; }
  pageCount = +(res.headers.get("X-Pages") || 1);
  currentSVG = await res.text();
  $("preview").innerHTML = currentSVG;
  $("pageTabs").innerHTML = pageCount > 1
    ? `版式自动分 ${pageCount} 页(每生需连续扫描上传 ${pageCount} 页):` +
      [...Array(pageCount)].map((_, i) => `<button class="ghost ${i + 1 === pageNow ? 'primary' : ''}" style="margin-left:6px" onclick="gotoPage(${i + 1})">第 ${i + 1} 页</button>`).join("")
    : "";
  $("download").disabled = false;
  $("download2").disabled = false;
  $("examLayout").value = JSON.stringify(buildLayout());
  localStorage.setItem("og.lastLayout", $("examLayout").value); // 供教师工作台「新建考试」一键载入
  setDesignMode("preview"); // 生成成功自动切到预览
  $("designMsg").className = "ok";
  $("designMsg").textContent = pageCount > 1
    ? `已生成。内容超出单页,已自动分 ${pageCount} 页(A4):第 2 页起重印考号与条码,扫描时每名学生连续 ${pageCount} 页上传即可。版式 JSON 已同步到「建考与阅卷」页。`
    : "已生成。版式 JSON 已同步到「建考与阅卷」页。";
}
async function gotoPage(k) { pageNow = k; await gen(); }
$("gen").onclick = () => { pageNow = 1; return gen(); };
$("download").onclick = () => {
  const blob = new Blob([currentSVG], { type: "image/svg+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "opengrade-sheet.svg"; a.click();
  URL.revokeObjectURL(a.href);
};

// —— 建考与阅卷 ——
$("createExam").onclick = async () => {
  $("examMsg").className = "err"; $("examMsg").textContent = "";
  try {
    const layout = JSON.parse($("examLayout").value);
    const key = JSON.parse($("examKey").value);
    const files = $("examImages").files;
    if (!files.length) throw new Error("请选择至少一张整卷扫描件");
    const fd = new FormData();
    fd.append("layout", JSON.stringify(layout));
    fd.append("key", JSON.stringify(key));
    fd.append("threshold", $("threshold").value);
    const rosterText = $("examRoster").value.trim();
    if (rosterText) fd.append("roster", rosterText);
    if ($("examSubject").value.trim()) fd.append("subject", $("examSubject").value.trim());
    for (const f of files) fd.append("images", f);
    const r = await fetch("/api/v1/exams", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    $("examMsg").className = "ok";
    $("examMsg").textContent = `考试 ${j.id} 已创建:${j.students} 卷,客观 ${j.objectiveCount} 题,主观 ${j.subjectiveCount} 题。`;
    refreshExams();
  } catch (e) { $("examMsg").textContent = e.message; }
};

async function refreshExams() {
  const list = await (await fetch("/api/v1/exams")).json();
  const t = $("examList");
  t.innerHTML = "<tr><th>考试</th><th>时间</th><th>卷数</th><th>题型</th><th>操作</th></tr>";
  for (const e of list) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${e.id}</td><td>${e.createdAt}</td><td>${e.students}</td>
      <td>${e.subject ? e.subject + " · " : ""}客观 ${e.objective} + 主观 ${e.subjective}</td>
      <td style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        <a href="/grader.html?exam=${e.id}">阅卷</a>
        <a href="/api/v1/exams/${e.id}/export.xlsx">成绩册</a>
        <details class="more"><summary>更多</summary><div class="menu">
          <a href="/api/v1/exams/${e.id}/review.pptx">讲评课件</a>
          <a href="/api/v1/exams/${e.id}/export.zip">数据包</a>
          <a href="#" class="danger" onclick="delExam('${e.id}');return false">删除</a>
        </div></details>
      </td>`;
    t.appendChild(tr);
  }
  if (!list.length) t.insertAdjacentHTML("beforeend", "<tr><td colspan='5'><div class='empty' style='padding:26px 0'><div class='pic'>🗂️</div>当前暂无考试~ 先在设计页生成版式,再回到本页创建考试</div></td></tr>");
}
async function delExam(id) {
  if (!confirm(`删除考试 ${id} 及其全部数据?此操作不可恢复。`)) return;
  const r = await fetch(`/api/v1/exams/${id}`, { method: "DELETE" });
  if (r.ok) refreshExams();
}
</script>
