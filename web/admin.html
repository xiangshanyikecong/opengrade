<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户管理 · OpenGrade</title>
<style>
  :root { --ink:#1c2430; --line:#dde3ea; --brand:#0b6e4f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:#f5f7fa; }
  header { display:flex; align-items:center; gap:14px; padding:12px 24px; background:#fff; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; }
  header .u { font-size:13px; color:#66707d; }
  main { max-width:1050px; margin:0 auto; padding:20px 24px; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; }
  a { color:var(--brand); text-decoration:none; }
  a.danger { color:#c2410c; }
  input, select { padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:13px; }
  button.primary { padding:8px 14px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-size:13px; cursor:pointer; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:10px; }
  .hint { font-size:12px; color:#8a94a3; }
  .err { color:#c2410c; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>用户管理</h1>
  <span class="u" id="ogUser"></span>
  <span style="flex:1"></span>
  <a href="/teacher.html">返回工作台</a>
</header>
<main>
  <div class="panel">
    <b>新建账号</b>
    <div class="grid" style="margin-top:10px">
      <input id="nu_username" placeholder="用户名(如 t03 / s20250011)">
      <input id="nu_display" placeholder="姓名/显示名">
      <select id="nu_role">
        <option value="teacher">教师</option>
        <option value="leader">年级组长</option>
        <option value="student">学生</option>
        <option value="parent">家长</option>
        <option value="admin">管理员</option>
      </select>
      <input id="nu_password" placeholder="初始密码(至少 5 位)" type="text">
      <input id="nu_reg" placeholder="考号(学生必填)">
      <input id="nu_class" placeholder="班级(如 三年二班)">
      <input id="nu_subjects" placeholder="任教学科(教师,逗号分隔)">
      <input id="nu_grades" placeholder="管辖年级(组长,逗号分隔)">
      <input id="nu_children" placeholder="子女考号(家长,逗号分隔)">
      <button class="primary" onclick="createUser()">创建账号</button>
    </div>
    <div class="err" id="msg"></div>
    <p class="hint">学生账号绑定考号后,可在「学生端」免费查分、看错题本与答卷回溯;家长账号绑定子女考号后,只能查看已发布成绩的子女数据。教师班级字段用于报告参照。</p>
  </div>
  <div class="panel">
    <b>批量导入(CSV)</b>
    <p class="hint" style="margin:8px 0">Excel 另存为「CSV UTF-8」后选择文件;列序:<code>用户名,姓名,角色,密码,考号,班级,学科,管辖年级,绑定子女</code>(角色可填 学生/教师/家长/组长/管理员;多值用 | 分隔;首行表头自动跳过)。已存在的账号仅更新行内给出的非空字段。</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0">
      <input type="file" id="impFile" accept=".csv,text/csv" style="flex:1;min-width:220px">
      <input id="impPwd" placeholder="默认初始密码(行内密码优先)" style="width:210px">
      <button class="primary" onclick="importUsers()">导入</button>
    </div>
    <textarea id="impText" rows="4" style="width:100%;box-sizing:border-box;font-family:monospace;font-size:12px"
      placeholder='或直接粘贴 CSV 内容,如:
s20250011,李雷,学生,,00000011,三年二班
s20250012,韩梅梅,学生,,00000012,三年二班
t03,王老师,教师,,三年三班,数学|物理'></textarea>
    <div class="err" id="impMsg" style="white-space:pre-wrap"></div>
  </div>
  <div class="panel">
    <b>全部账号</b>
    <div id="userList" style="margin-top:10px"></div>
  </div>
</main>
<script src="/common.js"></script>
<script>
async function main() {
  if (!await OG.init()) return;
  if (!OG.is("admin")) { document.body.innerHTML = "<p style='padding:40px'>仅管理员可访问本页。<a href='/teacher.html'>返回</a></p>"; return; }
  refresh();
}
async function refresh() {
  const users = await OG.jget("/api/v1/users");
  let html = `<table><tr><th>用户名</th><th>姓名</th><th>角色</th><th>考号/子女</th><th>班级</th><th>任教学科</th><th>管辖年级</th><th>操作</th></tr>`;
  for (const u of users) {
    const regCol = u.role === "parent" ? ((u.children || []).join(",") || "-") : (u.reg || "-");
    html += `<tr><td>${u.username}</td><td>${u.displayName}</td><td>${OG.roleName(u.role)}</td>
      <td>${regCol}</td><td>${u.class || "-"}</td><td>${(u.subjects || []).join(",") || "-"}</td><td>${(u.grades || []).join(",") || "-"}</td>
      <td style="display:flex;gap:8px">
        <a href="#" onclick="resetPwd('${u.username}');return false">重置密码</a>
        <a href="#" class="danger" onclick="delUser('${u.username}');return false">删除</a>
      </td></tr>`;
  }
  document.getElementById("userList").innerHTML = html + "</table>";
}
async function createUser() {
  const g = id => document.getElementById(id).value.trim();
  const body = {
    username: g("nu_username"), displayName: g("nu_display"),
    role: g("nu_role"), reg: g("nu_reg"), class: g("nu_class"),
    subjects: g("nu_subjects") ? g("nu_subjects").split(",").map(s => s.trim()).filter(Boolean) : [],
    grades: g("nu_grades") ? g("nu_grades").split(",").map(s => s.trim()).filter(Boolean) : [],
    children: g("nu_children") ? g("nu_children").split(",").map(s => s.trim()).filter(Boolean) : [],
  };
  try {
    await OG.jpost("/api/v1/users", { ...body, password: g("nu_password") });
    document.getElementById("msg").textContent = "";
    refresh();
  } catch (e) { document.getElementById("msg").textContent = e.message; }
}
async function resetPwd(username) {
  const np = prompt(`为 ${username} 设置新密码(至少 5 位):`);
  if (!np) return;
  try { await OG.jpost(`/api/v1/users/${username}/password`, { newPassword: np }); }
  catch (e) { alert(e.message); }
}
async function delUser(username) {
  if (!confirm(`删除账号 ${username}?`)) return;
  try { await OG.jpost(`/api/v1/users/${username}`, {}, "DELETE"); refresh(); }
  catch (e) { alert(e.message); }
}
async function importUsers() {
  const msg = document.getElementById("impMsg");
  msg.textContent = "";
  let csv = document.getElementById("impText").value.trim();
  const f = document.getElementById("impFile").files[0];
  if (f) csv = await f.text();
  if (!csv) { msg.textContent = "请选择 CSV 文件或粘贴内容"; return; }
  try {
    const r = await OG.jpost("/api/v1/users/import", { csv, defaultPassword: document.getElementById("impPwd").value });
    let text = `导入完成:新建 ${r.created},更新 ${r.updated}` + (r.failed.length ? `,失败 ${r.failed.length}` : "");
    for (const x of r.failed) text += `\n${x.error}`;
    msg.style.color = r.failed.length ? "#c2410c" : "var(--brand)";
    msg.textContent = text;
    refresh();
  } catch (e) { msg.style.color = "#c2410c"; msg.textContent = e.message; }
}
main();
</script>
</body>
</html>
