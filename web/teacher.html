<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教师工作台 · OpenGrade</title>
<link rel="stylesheet" href="/common.css">
<style>
  * { box-sizing:border-box; }
  body { font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:12px 24px; background:#fff; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; }
  header .u { font-size:13px; color:#66707d; }
  nav.tabs { display:flex; gap:4px; padding:0 24px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav.tabs button { border:0; background:none; padding:11px 16px; font-size:14px; cursor:pointer; color:#66707d; border-bottom:2px solid transparent; }
  nav.tabs button.active { color:var(--brand); border-bottom-color:var(--brand); font-weight:600; }
  main { max-width:1180px; margin:0 auto; padding:20px 24px; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:18px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; }
  a { color:var(--brand); text-decoration:none; }
  a.danger { color:var(--bad); }
  select, input { padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:13px; }
  button.primary { padding:9px 14px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-size:13px; cursor:pointer; }
  button.ghost { padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:13px; cursor:pointer; }
  .hint { font-size:12px; color:#8a94a3; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:10px; margin-bottom:14px; }
  .card { background:#f8fafc; border:1px solid var(--line); border-radius:9px; padding:10px 12px; }
  .card b { display:block; font-size:21px; line-height:1.3; }
  .card span { font-size:12px; color:#66707d; }
  .bar { height:8px; background:#eef2f6; border-radius:4px; overflow:hidden; width:130px; display:inline-block; vertical-align:middle; }
  .bar > div { height:100%; background:var(--brand); }
  .bad > div { background:#c2410c; }
  .pill { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; }
  .pill.on { background:#e7f5ef; color:var(--brand); }
  .pill.off { background:#fdece8; color:var(--bad); }
  canvas { max-width:100%; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:820px){ .grid2 { grid-template-columns:1fr; } }
  .keyinput { width:52px; text-align:center; }
  .acc-head { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; padding:2px 0; }
  .acc-head:hover { opacity:.75; }
  .acc-arrow { display:inline-block; width:12px; color:#66707d; transition:transform .15s; }
  .room { border:1px solid var(--line); border-radius:8px; padding:10px; margin:10px 0; }
  .room-head { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
  .seats { display:grid; grid-template-columns:repeat(auto-fill, minmax(92px,1fr)); gap:6px; }
  .seat { border:1px solid var(--line); border-radius:6px; padding:4px; font-size:12px; cursor:pointer; min-height:56px; }
  .seat.empty { opacity:.45; }
  .seat.sel { outline:2px solid var(--brand); }
  @media print {
    .sidebar, .topbar, .no-print { display:none !important; }
    .main-area { margin-left:0 !important; }
    .seat { break-inside:avoid; }
    .room { break-inside:avoid; }
  }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo"><span class="mark">开</span><span>开元智阅</span></div>
  <div class="user"><span class="avatar" id="sideAvatar">·</span><span class="name" id="sideUserName">…</span></div>
  <nav class="nav" id="tabs"></nav>
  <div class="side-foot"><button onclick="toggleSide()"><span>⇤</span><span class="txt"> 收起侧栏</span></button></div>
</aside>
<div class="main-area">
  <div class="topbar">
    <h1 id="pageTitle">考试</h1>
    <span style="flex:1"></span>
    <span class="hint" id="ogUser"></span>
    <a href="/">设计器</a> · <a href="/admin.html" id="adminLink" hidden>用户管理</a>
  </div>
  <div class="content">
    <div id="tab-exams"></div>
  <div id="tab-create" hidden></div>
    <div id="tab-bank" hidden></div>
    <div id="tab-tasks" hidden></div>
    <div id="tab-exam" hidden></div>
    <div id="tab-assign" hidden></div>
    <div id="tab-reports" hidden></div>
    <div id="tab-trends" hidden></div>
    <div id="tab-group" hidden></div>
    <div id="tab-rooms" hidden></div>
    <div id="tab-me" hidden></div>
  </div>
</div>

<script src="/common.js"></script>
<script>
let exams = [];

// 侧栏手风琴分组(智学网式):低频分组默认收起
const NAV_GROUPS = [
  { name: "考试", ico: "📋", open: true, items: [["exams", "考试列表"], ["create", "新建考试"], ["rooms", "考场编排"]] },
  { name: "阅卷", ico: "✍️", open: true, items: [["tasks", "我的任务"], ["assign", "任务分配"]] },
  { name: "学情", ico: "📈", open: true, items: [["reports", "学情分析"], ["trends", "纵向趋势"], ["group", "年级总表"]] },
  { name: "资源", ico: "📚", open: false, items: [["bank", "校本题库"]] },
  { name: "账号", ico: "👤", open: false, items: [["me", "账号设置"]] },
];
const PAGE_TITLES = { exams: "考试列表", create: "新建考试", rooms: "考场编排", tasks: "我的任务", exam: "考试详情", assign: "任务分配", reports: "学情分析", trends: "纵向趋势", group: "年级总表", bank: "校本题库", me: "账号设置" };

async function main() {
  if (!await OG.init()) return;
  if (OG.is("admin")) document.getElementById("adminLink").hidden = false;
  const me = OG.me || {};
  const av = document.getElementById("sideAvatar");
  if (av && me.displayName) av.textContent = me.displayName.trim().charAt(0) || "·";
  const un = document.getElementById("sideUserName");
  if (un) un.textContent = me.displayName || me.username || "";
  const groups = NAV_GROUPS
    .map(g => ({ ...g, items: g.items.filter(([id]) => id !== "assign" || OG.is("admin", "leader")) }))
    .filter(g => g.items.length);
  document.getElementById("tabs").innerHTML = groups.map((g, gi) => `
    <div class="nav-group ${g.open ? 'open' : ''}" data-g="${gi}">
      <div class="nav-head" onclick="this.parentNode.classList.toggle('open')">
        <span class="ico">${g.ico}</span><span class="txt">${g.name}</span><span class="arr">▾</span>
      </div>
      <div class="nav-sub">${g.items.map(([id, name]) =>
        `<button data-t="${id}" onclick="showTab('${id}')">${name}</button>`).join("")}</div>
    </div>`).join("");
  // 常规流程:教师登录落到「我的任务」(任务视角进入阅卷);管理端落考试列表
  showTab(OG.is("admin", "leader") ? "exams" : "tasks");
  // 外页深链回详情(复核页「← 考试详情」/ grader 返回):#exam-{id}
  const hm = location.hash.match(/^#exam-([0-9a-zA-Z]+)$/);
  if (hm) openExam(hm[1]);
  // 首登强制改密(P2):未改初始密码前锁住其它功能
  if (OG.me.mustChangePassword) enforcePasswordChange();
}

// 强制改密:横幅 + 阻断其它页签;改密成功后自动解除。
function enforcePasswordChange() {
  const bar = document.createElement("div");
  bar.id = "forcePwdBar";
  bar.style.cssText = "background:#fdece8;color:var(--bad);padding:10px 24px;font-size:14px;font-weight:600;border-bottom:1px solid var(--bad)";
  bar.innerHTML = "⚠ 当前仍在使用初始密码,请立即修改后再使用系统其它功能。";
  document.querySelector(".topbar").parentNode.insertBefore(bar, document.querySelector(".topbar"));
  showTab("me");
  document.querySelectorAll("#tabs .nav-sub button").forEach(b => {
    if (b.dataset.t !== "me") { b.disabled = true; b.title = "请先修改初始密码"; b.style.opacity = .45; }
  });
  const origChangePwd = changePwd;
  window.changePwd = async function () {
    await origChangePwd();
    const me = await OG.jget("/api/v1/auth/me");
    if (!me.mustChangePassword) {
      document.getElementById("forcePwdBar")?.remove();
      document.querySelectorAll("#tabs .nav-sub button").forEach(b => { b.disabled = false; b.style.opacity = ""; b.title = ""; });
      location.reload();
    }
  };
}

function toggleSide() { document.body.classList.toggle("side-collapsed"); }

function showTab(id) {
  document.querySelectorAll("#tabs .nav-sub button").forEach(b => b.classList.toggle("active", b.dataset.t === id));
  ["exams", "create", "bank", "tasks", "exam", "assign", "reports", "trends", "group", "rooms", "me"].forEach(t => document.getElementById(tab_(t)).hidden = t !== id);
  const title = document.getElementById("pageTitle");
  if (title) title.textContent = PAGE_TITLES[id] || "考试";
  // 激活的子项若在收起分组里,自动展开该分组
  const btn = document.querySelector(`#tabs .nav-sub button[data-t="${id}"]`);
  if (btn) btn.closest(".nav-group").classList.add("open");
  if (id === "exams") loadExams();
  if (id === "create") loadCreate();
  if (id === "bank") loadBank();
  if (id === "tasks") loadMyTasks();
  if (id === "assign") loadAssign();
  if (id === "reports") loadReports();
  if (id === "trends") loadTrendInit();
  if (id === "group") loadAggregate();
  if (id === "rooms") loadRooms();
  if (id === "me") renderMe();
}
function tab_(t) { return "tab-" + t; }

/* —— 考场编排(走班排考):生成 → 座位对调/监考指派 → 打印 —— */
let roomsExam = "", roomsPlan = null, swapSel = null, roomsStaff = [];

async function loadRooms() {
  exams = (await OG.jget("/api/v1/exams")) || [];
  const box = document.getElementById("tab-rooms");
  box.innerHTML = `<div class="panel">
    <div class="group-title">考场编排(按名册分场,生成后可微调并打印)</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center" class="no-print">
      <label>考试 <select id="roomsExamSel" onchange="roomsPick()">
        <option value="">选择考试…</option>
        ${exams.map(e => `<option value="${e.id}" ${roomsExam === e.id ? 'selected' : ''}>${e.id}(${e.createdAt}${e.subject ? '·' + e.subject : ''})</option>`).join("")}
      </select></label>
      <label>每场人数 <input id="roomsSize" type="number" value="30" min="5" max="200" style="width:64px"></label>
      <label>编排 <select id="roomsGroup"><option value="class">同班聚齐(按主班)</option><option value="reg">纯考号序</option></select></label>
      <button class="primary" onclick="genRooms()">生成分场</button>
      <button class="secondary" onclick="window.print()">打印座位表</button>
    </div>
    <p class="hint no-print">同班聚齐按名册主班排序装场(走班名册把教学班放 Classes 首位即可按教学班聚齐);生成后点击两个座位可对调,每场可下拉指派监考。</p>
    <div id="roomsArea"><p class="hint">选择考试后生成,或查看已保存的编排。</p></div>
  </div>`;
  if (roomsExam) fetchRooms();
}

async function roomsPick() {
  roomsExam = document.getElementById("roomsExamSel").value;
  swapSel = null;
  if (roomsExam) fetchRooms();
  else roomsPlan = null;
}

async function fetchRooms() {
  try {
    const [plan, detail] = await Promise.all([
      OG.jget(`/api/v1/exams/${roomsExam}/rooms`),
      OG.jget(`/api/v1/exams/${roomsExam}`),
    ]);
    roomsStaff = (detail.staff || []);
    roomsPlan = plan && plan.rooms ? plan : null;
  } catch (e) { roomsPlan = null; }
  renderRooms();
}

async function genRooms() {
  if (!roomsExam) { alert("先选择考试"); return; }
  const size = +document.getElementById("roomsSize").value || 30;
  const group = document.getElementById("roomsGroup").value;
  try {
    roomsPlan = await OG.jpost(`/api/v1/exams/${roomsExam}/rooms`, { size, group });
    swapSel = null;
    renderRooms();
  } catch (e) { alert(e.message); }
}

function renderRooms() {
  const area = document.getElementById("roomsArea");
  if (!area) return;
  if (!roomsPlan || !roomsPlan.rooms) { area.innerHTML = `<p class="hint">尚未生成编排。</p>`; return; }
  let html = "";
  // 监考冲突(同日同场次的其它考试已指派同一教师):红标提示,教务改人;指派本身不阻断
  const cByRoom = {};
  for (const c of (roomsPlan.conflicts || [])) (cByRoom[c.room] = cByRoom[c.room] || []).push(c);
  if ((roomsPlan.conflicts || []).length) {
    html += `<div class="err" style="margin-bottom:10px;padding:8px 12px;border-radius:8px">⚠ 监考冲突 ${roomsPlan.conflicts.length} 处(同日同场次其它考试已指派同一教师):<br>` +
      roomsPlan.conflicts.map(c => `· ${c.teacher} 在 ${c.room},同时被「${c.subject || c.examId}」的 ${c.otherRoom} 指派`).join("<br>") + `</div>`;
  }
  for (const room of roomsPlan.rooms) {
    const seats = room.seats.map(s => {
      const selMark = swapSel && swapSel.room === room.name && swapSel.idx === s.idx;
      const body = s.reg
        ? `<div>${s.name}</div><div class="hint">${s.reg}</div><div class="hint">${s.class || ""}</div>`
        : `<div class="hint">空座</div>`;
      return `<div class="seat ${s.reg ? '' : 'empty'} ${selMark ? 'sel' : ''}" onclick="seatClick('${room.name}',${s.idx})"><b>${s.idx}</b>${body}</div>`;
    }).join("");
    const conflictBadge = (cByRoom[room.name] || []).length
      ? ` <span class="err" title="${cByRoom[room.name].map(c => c.teacher + ' ↔ ' + (c.subject || c.examId) + ' ' + c.otherRoom).join('; ')}">⚠ 监考冲突</span>` : "";
    const proctors = `<select class="no-print" onchange="setProctor('${room.name}', this.value)">
        <option value="">监考…</option>
        ${roomsStaff.map(t => `<option value="${t.username}" ${room.proctor === t.username ? 'selected' : ''}>${t.displayName || t.username}</option>`).join("")}
      </select>`;
    html += `<div class="room">
      <div class="room-head"><b>${room.name}</b><span class="hint">${room.seats.filter(s => s.reg).length} 人 · 监考:${room.proctor || "未指派"}</span>${conflictBadge}${proctors}</div>
      <div class="seats">${seats}</div></div>`;
  }
  area.innerHTML = html;
}

async function seatClick(room, idx) {
  if (!roomsPlan) return;
  if (!swapSel) { swapSel = { room, idx }; renderRooms(); return; }
  const a = swapSel;
  swapSel = null;
  if (a.room === room && a.idx === idx) { renderRooms(); return; }
  try {
    roomsPlan = await OG.jpost(`/api/v1/exams/${roomsExam}/rooms`, { swap: { a, b: { room, idx } } }, "PATCH");
  } catch (e) { alert(e.message); }
  renderRooms();
}

async function setProctor(room, teacher) {
  try {
    roomsPlan = await OG.jpost(`/api/v1/exams/${roomsExam}/rooms`, { proctor: { room, teacher } }, "PATCH");
    renderRooms();
  } catch (e) { alert(e.message); }
}

/* —— 考试列表 —— */
// 阶段徽标配色:常规流程状态机(待扫描/扫描中/异常/阅卷中/待发布/已发布)
const STAGE_CLASS = {
  awaiting_scan: "off", scanning: "run", anomalies: "warn", grading: "run", ready: "on", published: "pub",
};
function stagePill(e) {
  const cls = STAGE_CLASS[e.stage] || "off";
  const notes = [];
  if (e.expected) notes.push(`应扫 ${e.expected}`);
  if (e.ungraded) notes.push(`未评 ${e.ungraded}/${e.total}`);
  if (e.warnings) notes.push(`异常 ${e.warnings}`);
  if (e.dirty) notes.push("发布后有变更,需重新发布");
  return `<span class="pill ${cls}" title="${notes.join(" · ")}">${e.stageLabel || (e.published ? "已发布" : "未发布")}${e.dirty ? " ⟳" : ""}</span>`;
}

async function loadExams() {
  exams = await OG.jget("/api/v1/exams");
  const box = document.getElementById("tab-exams");
  // 学期/类型过滤(教务口径:跨学年考试列表不再混排)
  const terms = [...new Set(exams.map(e => e.term).filter(Boolean))];
  const types = [...new Set(exams.map(e => e.examType).filter(Boolean))];
  const groups = [...new Set(exams.map(e => e.examGroup).filter(Boolean))];
  const when = e => e.examDate || e.createdAt.slice(0, 10);
  const sortKey = e => (e.examDate || e.createdAt.replace(" ", "T"));
  exams.sort((a, b) => (sortKey(b) > sortKey(a) ? 1 : sortKey(b) < sortKey(a) ? -1 : 0));
  let html = `<div class="panel">
    <div style="display:flex;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap">
      <b>考试列表</b><span class="hint">共 ${exams.length} 场 · 点考试号进入详情(扫描/异常/进度/发布)</span>
      <span style="flex:1"></span>
      <select id="fltTerm" onchange="saveExamFilters()"><option value="">全部学期</option>${terms.map(t => `<option>${OG.esc(t)}</option>`).join("")}</select>
      <select id="fltType" onchange="saveExamFilters()"><option value="">全部类型</option>${types.map(t => `<option>${OG.esc(t)}</option>`).join("")}</select>
      <select id="fltGroup" onchange="saveExamFilters()"><option value="">全部分组</option>${groups.map(t => `<option>${OG.esc(t)}</option>`).join("")}</select>
      <button class="primary" onclick="showTab('create')">+ 新建考试</button>
    </div>
    <div id="examTableBox"></div>`;
  box.innerHTML = exams.length ? html + "</div>" : `<div class="panel"><div class="empty"><div class="pic">🗂️</div>当前暂无考试~ 点右上「+ 新建考试」开始:建考(建档)→ 发卡 → 考后回详情传扫描件</div></div>`;
  if (exams.length) {
    restoreExamFilters(); // 刷新/换页回来保持上次的筛选(C-4:此前每次重置成"全部")
    renderExamTable();
  }
}

// 筛选状态持久化:学期/类型/分组选择存 sessionStorage,重进页面回填
function restoreExamFilters() {
  let f = {};
  try { f = JSON.parse(sessionStorage.getItem("og.examFilters") || "{}"); } catch (_) { }
  for (const [id, v] of [["fltTerm", f.term], ["fltType", f.type], ["fltGroup", f.group]]) {
    const sel = document.getElementById(id);
    if (sel && v && [...sel.options].some(o => o.value === v || o.text === v)) sel.value = v;
  }
}

function saveExamFilters() {
  const v = id => (document.getElementById(id) || {}).value || "";
  sessionStorage.setItem("og.examFilters", JSON.stringify({ term: v("fltTerm"), type: v("fltType"), group: v("fltGroup") }));
  renderExamTable();
}

function renderExamTable() {
  const flt = id => (document.getElementById(id) || {}).value || "";
  const term = flt("fltTerm"), type = flt("fltType"), group = flt("fltGroup");
  const list = exams.filter(e => (!term || e.term === term) && (!type || e.examType === type) && (!group || e.examGroup === group));
  const metaTxt = e => {
    const bits = [];
    if (e.examType) bits.push(OG.esc(e.examType));
    if (e.term) bits.push(OG.esc(e.term));
    if (e.examGroup) bits.push(`<span class="hint" title="同场分组,可在「年级总表」聚合查看">⧉ ${OG.esc(e.examGroup)}</span>`);
    return bits.join(" · ");
  };
  let html = `<table><tr><th>考试</th><th>日期</th><th>类型/学期</th><th>建卷人</th><th>学科</th><th>卷数</th><th>题型</th><th>状态</th><th>操作</th></tr>`;
  for (const e of list) {
    // 主操作随阶段推进:待扫描→去扫描;扫描中→续传;异常→去处理;阅卷中→阅卷;待发布→发布;已发布→成绩册(有变更→重新发布)
    let primary;
    if (e.stage === "awaiting_scan" || e.stage === "scanning") primary = `<a href="#" onclick="openExam('${e.id}');return false"><b>去扫描</b></a>`;
    else if (e.stage === "anomalies") primary = `<a href="#" onclick="openExam('${e.id}');return false"><b>处理异常</b></a>`;
    else if (e.stage === "grading") primary = `<a href="/grader.html?exam=${e.id}"><b>阅卷</b></a>`;
    else if (e.stage === "ready") primary = `<a href="#" onclick="pubExam('${e.id}',true).then(loadExams);return false"><b>发布成绩</b></a>`;
    else if (e.dirty) primary = `<a href="#" onclick="pubExam('${e.id}',true).then(loadExams);return false" title="发布后又有补传/改分:重新发布收口"><b>重新发布</b></a>`;
    else primary = `<a href="/api/v1/exams/${e.id}/export.xlsx"><b>成绩册</b></a>`;
    const badges = [];
    if (e.appeals) badges.push(`<span class="pill off" title="待处理的学生复核申请">复核 ${e.appeals}</span>`);
    if (e.flagged) badges.push(`<span class="pill" style="background:#fff3cd;color:#9a3412" title="⚑ 待复核切片">⚑ ${e.flagged}</span>`);
    const whenTxt = e.examDate ? `<b>${e.examDate}</b>` : e.createdAt;
    html += `<tr><td><a href="#" onclick="openExam('${e.id}');return false" title="打开考试详情">${e.id}</a></td><td>${whenTxt}</td><td>${metaTxt(e) || "-"}</td><td>${e.createdBy || "-"}</td>
      <td>${e.subject || "-"}</td><td>${e.students}${e.expected ? "/" + e.expected : ""}</td><td>客观 ${e.objective} + 主观 ${e.subjective}</td>
      <td>${stagePill(e)}${badges.length ? "<br>" + badges.join(" ") : ""}</td>
      <td style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        ${primary}
        <a href="/api/v1/exams/${e.id}/export.xlsx">成绩册</a>
        <details class="more"><summary>更多</summary><div class="menu">
          <a href="#" onclick="openExam('${e.id}');return false">考试详情(扫描/异常/进度)</a>
          <a href="#" onclick="pubExam('${e.id}',${!e.published}).then(loadExams);return false">${e.published ? (e.dirty ? '重新发布(同步变更)' : '撤回发布') : '发布成绩'}</a>
          <a href="/api/v1/exams/${e.id}/review.pptx">讲评课件</a>
          <a href="/api/v1/exams/${e.id}/slips.pdf">全班成绩条 PDF</a>
          <a href="/api/v1/exams/${e.id}/export.zip">数据包</a>
          ${OG.is("admin", "leader") ? `<a href="#" class="danger" onclick="delExam('${e.id}');return false">删除</a>` : ""}
        </div></details>
      </td></tr>`;
  }
  html += "</table>";
  if (!list.length) html = `<p class="hint">没有符合筛选条件的考试。</p>`;
  document.getElementById("examTableBox").innerHTML = html;
}

/* —— 考试详情枢纽(常规流程的"考试工作台"):扫描会话 → 异常裁决 → 进度 → 发布 —— */
let hubExam = null; // 当前详情数据缓存(动作完成后局部刷新)

let openExamSeq = 0; // 竞态守卫:快速连点/切换考试时,旧响应不得覆盖新页面(会丢已填输入)
let hubLastExamId = "", hubScrollY = 0; // 同一场考试内操作后整页重渲染:记住滚动位置,处理一条不跳回页顶
async function openExam(id) {
  const seq = ++openExamSeq;
  const keepScroll = id === hubLastExamId;
  if (hubLastExamId === id) hubScrollY = window.scrollY;
  showTab("exam");
  const box = document.getElementById("tab-exam");
  box.innerHTML = `<div class="panel">加载考试 ${id} …</div>`;
  let d;
  try { d = await OG.jget(`/api/v1/exams/${id}`); }
  catch (e) { if (seq === openExamSeq) box.innerHTML = `<div class="panel"><div class="err">${OG.esc(e.message)}</div></div>`; return; }
  if (seq !== openExamSeq) return; // 已切换到其它考试:丢弃过期响应
  hubExam = d;
  hubLastExamId = id;
  renderExamHub(d);
  if (keepScroll) window.scrollTo({ top: hubScrollY });
}

function hubStatNum(label, val, tone) {
  return `<div style="flex:1;min-width:96px;background:var(--bg);border-radius:10px;padding:10px 14px">
    <div style="font-size:12px;color:#8a94a3">${label}</div>
    <div style="font-size:22px;font-weight:700;${tone ? `color:${tone}` : ""}">${val}</div></div>`;
}

function renderExamHub(d) {
  const box = document.getElementById("tab-exam");
  const st = d.stage || {};
  const canEdit = !!d.canEditKey || OG.is("admin", "leader"); // 后端字段为 canEditKey(与学情分析页同口径)
  const objN = (d.objective || []).length;
  // 缺扫名单:名册里有、没扫到卷、也没登记缺考/补录的考号
  const missing = (d.roster || []).filter(st_ => !d.scannedReg[st_.reg] && !(d.absent || []).some(a => a.reg === st_.reg));
  const warnOpen = (d.warnings || []).filter(w => !w.resolved && !w.soft);
  const warnDone = (d.warnings || []).filter(w => w.resolved || w.soft);

  let html = `<div class="panel">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <a href="#" onclick="showTab('exams');return false">← 考试列表</a>
      <b style="font-size:16px">考试 ${d.id}</b>
      ${stagePill({ stage: st.stage, stageLabel: st.label, expected: st.expected, ungraded: st.ungraded, total: st.total, warnings: st.warnings })}
      <span class="hint">${d.createdAt} · 建卷 ${d.createdBy || "-"}${d.subject ? " · " + d.subject : ""}${d.examType ? " · " + d.examType : ""}${d.term ? " · " + d.term : ""}</span>
      <span style="flex:1"></span>
      <a href="/grader.html?exam=${d.id}">阅卷工作台 ↗</a>
      ${canEdit ? `<a href="#" onclick="pubExam('${d.id}',${!d.published}).then(()=>openExam('${d.id}')).then(loadExams);return false">${d.published ? (st.dirty ? "重新发布(同步变更)" : "撤回发布") : "发布成绩"}</a>` : ""}
    </div>
    ${st.dirty ? `<div class="err" style="padding:8px 12px;border-radius:8px;margin-bottom:10px">⚠ 发布后数据有变更(补传/改分/改答案),学生端已是最新分数 —— 核对后点「重新发布」收口并刷新发布时间。</div>` : ""}
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      ${hubStatNum("已扫 / 应扫", `${st.students}${st.expected ? "/" + st.expected : ""}`)}
      ${hubStatNum("未评切片", st.ungraded + "/" + st.total, st.ungraded ? "#3b62d9" : "")}
      ${hubStatNum("异常待裁决", warnOpen.length, warnOpen.length ? "var(--bad)" : "")}
      ${hubStatNum("缺考", st.absent)}
      ${hubStatNum("手工补录", st.manual)}
      ${hubStatNum("⚑ 待复核", (d.flagged || []).length, (d.flagged || []).length ? "var(--warn)" : "")}
      ${(d.appeals || []).some(a => a.status === "open") ? hubStatNum("复核待处理", (d.appeals || []).filter(a => a.status === "open").length, "var(--bad)") : ""}
      ${(d.voidedRows || []).length ? hubStatNum("已作废卷", (d.voidedRows || []).length, "#8a94a3") : ""}
    </div>`;

  // —— 考试信息(元数据:日期/学期/类型/分组/匿名阅卷;可编辑者展开) ——
  html += `<div class="group-title" style="margin-top:16px">考试信息</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px">
      <label>日期 <input id="metaDate" type="date" value="${d.examDate || ""}" ${canEdit ? "" : "disabled"} style="padding:5px 8px"></label>
      <label>学期 <input id="metaTerm" value="${d.term || ""}" placeholder="2026-2027上" ${canEdit ? "" : "disabled"} style="width:110px;padding:5px 8px"></label>
      <label>类型 <select id="metaType" ${canEdit ? "" : "disabled"} style="padding:5px 8px">
        ${["", "周测", "月考", "单元", "期中", "期末", "模拟", "其他"].map(t => `<option value="${t}" ${d.examType === t ? "selected" : ""}>${t || "(未设)"}</option>`).join("")}
      </select></label>
      <label>同场分组 <input id="metaGroup" value="${d.examGroup || ""}" placeholder="如 2026期中" ${canEdit ? "" : "disabled"} style="width:110px;padding:5px 8px"></label>
      <label title="场次来自全校场次表;同日同场次的不同考试指派同一监考会被标红">场次 <select id="metaSession" ${canEdit ? "" : "disabled"} style="max-width:170px;padding:5px 8px"></select></label>
      <label title="匿名阅卷:阅卷工作台不显示考号,评完再对分"><input type="checkbox" id="metaAnon" ${d.anonymous ? "checked" : ""} ${canEdit ? "" : "disabled"}> 匿名阅卷</label>
      ${d.hasB ? `<span class="hint" title="考试短号印在个性化卡的二维码里(短号+卷种位+考号),扫描时自动核对归属">AB 卷 · 短号 ${d.shortId || "-"} ·
        <a href="/api/v1/exams/${d.id}/cards.pdf?variant=A">打印 A 卷(按名册)</a> ·
        <a href="/api/v1/exams/${d.id}/cards.pdf?variant=B">打印 B 卷(按名册)</a></span>` : ""}
      ${canEdit ? `<button class="ghost" onclick="saveExamMeta('${d.id}')">保存考试信息</button>` : ""}
      <span class="hint" id="metaMsg"></span>
    </div>`;

  if (d.manualMode) {
    // —— 手工成绩科目:免版式直录(逐格 + 整表粘贴) ——
    html += manualScorePanel(d);
  } else {
    // —— ① 扫描会话:批量上传(PDF 自动拆页) + 内联反馈 ——
    html += `<div class="group-title" style="margin-top:16px">① 扫描上传(支持 PNG/JPG/多页 PDF;按每页考号自动归组,卡纸跳页只告警不连坐;同一学生分两批扫,系统会把页自动合并成一份卷)</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input type="file" id="hubScanFiles" multiple accept="image/png,image/jpeg,application/pdf" style="max-width:340px">
      <button class="primary" id="hubScanBtn" onclick="hubUpload('${d.id}')">上传本批扫描件</button>
      <span class="hint">${st.expected && st.students < st.expected ? `名册 ${st.expected} 人,还差 ${st.expected - st.students} 份 —— 全部补扫或登记缺考后,阶段才会离开「扫描中」` : "已扫齐或名册未提供"}</span>
    </div>
    <div id="hubScanMsg" style="margin-top:8px">${hubUploadState && hubUploadState.id === d.id
      ? `<div class="panel" style="padding:8px"><span class="err">上次上传在第 ${hubUploadState.nextBatch + 1} 批中断(已入库 ${hubUploadState.addedTotal} 卷不受影响)。</span>
         <button class="ghost" style="margin-left:8px" onclick="hubUploadResume()">从第 ${hubUploadState.nextBatch + 1} 批继续</button></div>`
      : ""}</div>`;
  }

  // —— 重复卷裁决(重扫/重复上传):保留一份,其余作废 ——
  if ((d.duplicates || []).length) {
    html += `<div class="group-title" style="margin-top:14px">重复卷裁决(${d.duplicates.length} 组 — 重扫/重复上传在此收口)</div>
      <table><tr><th>考号</th><th>卷号</th><th>操作(保留其一,其余作废)</th></tr>
      ${d.duplicates.map(g => {
        const reg = assignedRegOf(d, g[0]);
        const nm = ((d.roster || []).find(r => r.reg === reg) || {}).name;
        return `<tr><td>${OG.esc(reg || "?")}${nm ? "(" + OG.esc(nm) + ")" : ""}</td>
        <td>卷 ${g.join("、卷 ")}</td>
        <td style="display:flex;gap:8px;flex-wrap:wrap">${canEdit ? g.map(si =>
          `<a href="#" onclick="resolveDup('${d.id}',${si},${JSON.stringify(g).replace(/"/g, "&quot;")});return false">保留卷 ${si}</a>`).join("")
          : `<span class="hint">裁决需建卷人/年级组长/管理员</span>`}
        </td></tr>`; }).join("")}</table>
      <p class="hint">点「保留卷 N」= 其余同考号卷作废;作废卷可在下方恢复。重扫替换:直接上传新扫描件(自动归组),再在这里保留新卷即可。</p>`;
  }

  // —— ② 缺扫名单:名册有、卷没有 → 补录/缺考登记(阶段推进的收口:全部处理完才离开「扫描中」) ——
  if (missing.length) {
    html += `<div class="group-title" style="margin-top:14px">缺扫名单(${missing.length} 人 — 漏扫/缺考在此收口)</div>
      <p class="hint" style="margin:4px 0">这 ${missing.length} 人不处理,考试会一直停在「扫描中」:实考的走「补录客观作答」(学情分析页),缺考的登记缺考(统计自动剔除,不进阅卷)。</p>
      <table><tr><th>考号</th><th>姓名</th><th>班级</th><th>处理</th></tr>
      ${missing.map(m => `<tr><td>${OG.esc(m.reg)}</td><td>${OG.esc(m.name || "-")}</td><td>${OG.esc((m.classes || []).join("、") || "-")}</td>
        <td style="display:flex;gap:10px">
          <a href="#" onclick="hubManual('${d.id}','${OG.esc(m.reg)}');return false">登记缺考</a>
          <a href="#" onclick="hubManualEntry('${d.id}','${OG.esc(m.reg)}');return false" title="实考但漏扫:录入客观题作答(卷号续排,主观题可评分)">补录作答</a>
        </td></tr>`).join("")}</table>
      ${missing.length > 1 ? `<button class="ghost" style="margin-top:8px" onclick="hubAbsentAll('${d.id}')">以上 ${missing.length} 人全部登记缺考</button>` : ""}`;
  }

  // —— 缺考名单(详情页内取消缺考,不再只藏在学情分析页) ——
  if ((d.absent || []).length) {
    html += `<div class="group-title" style="margin-top:14px">缺考名单(${d.absent.length} 人 · 不进统计与阅卷;误标的可取消)</div>
      <table><tr><th>卷号</th><th>考号</th><th></th></tr>
      ${d.absent.map(a => `<tr><td>第 ${a.student} 卷</td><td>${OG.esc(a.reg)}</td>
        <td><a href="#" onclick="hubAbsent('${d.id}',${a.student});return false">取消缺考</a></td></tr>`).join("")}</table>`;
  }

  // —— ③ 异常清单:chips(待裁决/已裁决/提示类)+ 搜索 + 每页 10 条;百卷级异常不再全量堆在一页 ——
  if ((d.warnings || []).length) {
    html += `<div class="group-title" style="margin-top:14px">③ 异常清单(待裁决 ${warnOpen.length}${warnDone.length ? ` · 已裁决/提示 ${warnDone.length}` : ""})</div>
      <div id="ogList-warn"></div>
      <p class="hint">缺页/页序类告警:把该生全部页<b>整份重扫上传</b>会自动合并成完整卷;确实无页可补时才「接受残卷」。</p>
      <div id="hubSuggestBox" style="margin-top:8px"></div>`;
  }

  // —— 已作废卷:折叠收纳(默认收起)+ 搜索 + 分页;恢复限建卷人/组长/管理员 ——
  if ((d.voidedRows || []).length) {
    html += `<details class="fold" style="margin-top:12px"><summary>已作废卷 <span class="cnt">(${d.voidedRows.length} · 不进报告与阅卷,可恢复)</span></summary>
      <div id="ogList-void" style="margin-top:6px"></div></details>`;
  }

  // —— ④ ⚑ 待复核队列:阅卷标记的出口(改分后点「清除⚑」收口,队列才排空)——
  if ((d.flagged || []).length) {
    html += `<div class="group-title" style="margin-top:14px">⚑ 待复核队列(${d.flagged.length})</div>
      <div id="ogList-flag"></div>`;
  }

  // —— 成绩复核申请(发布后学生/家长发起):有待处理默认展开;已回复沉底 ——
  const appeals = d.appeals || [];
  const appealsOpen = appeals.filter(a => a.status === "open").length;
  if (appeals.length) {
    html += `<details class="fold" style="margin-top:12px" ${appealsOpen ? "open" : ""}>
      <summary>成绩复核申请 <span class="cnt">待处理 ${appealsOpen} · 已回复 ${appeals.length - appealsOpen}</span></summary>
      <div id="ogList-appeal" style="margin-top:6px"></div>
      <div id="appealBlockBox" style="margin-top:8px"></div></details>`;
  }

  // —— ⑤ 客观题参考答案(逐格编辑,修正后全班重统;判断 T/F、多选连写) ——
  if (objN) {
    const kinds = d.objective || [];
    const cell = (i, k, attr, ro) => {
      const kind = (kinds[i] || {}).kind || "choice";
      const ph = kind === "judge" ? "T/F" : kind === "multiple" ? "如 AC" : "A~F";
      const tag = kind === "judge" ? "判" : kind === "multiple" ? "多" : "";
      return `<label class="hint" style="display:grid;gap:2px;text-align:center">${i + 1}${tag}
        <input class="keyinput" data-${attr}="${i}" maxlength="4" value="${k || ""}" placeholder="${ph}" ${canEdit && !ro ? "" : "disabled"} style="font-family:monospace"></label>`;
    };
    html += `<div class="group-title" style="margin-top:14px">客观题参考答案${canEdit ? "(逐格修正后全班客观题自动重统;空格=该题不判分)" : ""}</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${kinds.map((_, i) => cell(i, (d.key || [])[i], "hubkey")).join("")}</div>
      ${canEdit ? `<button class="ghost" style="margin-top:10px" onclick="hubSaveKey('${d.id}')">保存并重统${d.hasB ? "(A/B 卷共用)" : ""}</button>` : ""}
      <span class="hint">共 ${objN} 题;判断题 T/F,多选连写如 AC</span><div id="hubKeyMsg" style="margin-top:6px"></div>`;
    if (d.hasB) {
      // B 卡面答案 = 规范答案按题序对照自动重排(判分按规范题号,两卷共用一份答案键)。
      // 只读展示:让老师核对印在 B 卡上的答案位置;要改答案改上方 A 卷网格,两卷同步重统。
      const orderB = d.orderB && d.orderB.length ? d.orderB : kinds.map((_, i) => i + 1);
      const keyBCard = orderB.map((canon) => ((d.key || [])[canon - 1] ?? "")); // 卡面第 i 题 ← 规范第 canon 题
      html += `<div class="group-title" style="margin-top:12px">B 卷卡面答案(自动派生,只读)</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">${kinds.map((_, i) => cell(i, keyBCard[i], "hubkeybro", true)).join("")}</div>
        <span class="hint">B 卡第 i 格 = 参考答案按题序对照(卡面第 i 题 = A 卷第 ${orderB.length && orderB.every((v, i2) => v === i2 + 1) ? "同序" : "打乱后的题序"}重排);判分按规范题号与 A 卷共用同一份答案。要改答案请改上方 A 卷网格。</span>`;
    }
  }

  // —— ⑥ 逐题阅卷进度(带阅卷人/⚑ 数,一键进入本题) ——
  if ((d.progress || []).length) {
    const flagCount = {};
    for (const f of (d.flagged || [])) flagCount[f.question] = (flagCount[f.question] || 0) + 1;
    html += `<div class="group-title" style="margin-top:14px">主观题阅卷进度</div>
      <table><tr><th>题号</th><th>题型</th><th>满分</th><th>阅卷人</th><th>截止</th><th>⚑</th><th>进度</th><th></th></tr>
      ${d.progress.map(p => {
        const pctv = p.total ? Math.round(p.graded * 100 / p.total) : 100;
        const due = (d.taskDue || {})["q" + p.question] || "";
        return `<tr><td>第 ${objN + p.question} 题</td><td>${p.kind === "fillblank" ? "填空" : "解答"}${p.elective ? "(选做)" : ""}</td><td>${p.max}</td>
          <td>${p.teacher || "-"}</td>
          <td>${due || "-"}</td>
          <td>${flagCount[p.question] ? `<b style="color:var(--warn)" title="待复核切片数">${flagCount[p.question]}</b>` : "-"}</td>
          <td><div class="progress" style="width:120px;display:inline-block;vertical-align:middle"><div style="width:${pctv}%"></div></div> ${p.graded}/${p.total}</td>
          <td><a href="/grader.html?exam=${d.id}&q=${p.question}">阅本题 ↗</a></td></tr>`;
      }).join("")}</table>
      <p class="hint">${OG.is("admin", "leader") ? `分配阅卷人与截止时间到「<a href="#" onclick="showTab('assign');return false">任务分配</a>」` : "任务由管理员/年级组长分配"}</p>`;
  }

  html += `</div>`;
  box.innerHTML = html;
  fillSessionOptions("metaSession", d.session);
  mountHubLists(d, canEdit, objN); // 四个大列表(异常/作废/⚑/复核)挂分页搜索套件
}

// mountHubLists 给详情页四个大列表挂 OG.listKit(chips + 防抖搜索 + 每页 10 条)。
// 状态(chips/搜索词/页码)存 OG.listState,操作后整页重渲染不丢上下文。
function mountHubLists(d, canEdit, objN) {
  const isResidual = w => (w.texts || []).some(t => t.includes("仅识别到") || t.includes("页点不可信") || t.includes("位置配对"));
  // ③ 异常清单:待裁决在前,已裁决/提示类沉底
  if (document.getElementById("ogList-warn")) {
    const warnActions = w => `<a href="#" onclick="hubSuggest('${d.id}',${w.student});return false">推荐考号…</a>
      <a href="#" onclick="hubAbsent('${d.id}',${w.student});return false">标记缺考</a>
      ${canEdit ? `<a href="#" onclick="hubVoid('${d.id}',${w.student},true);return false" title="重复卷/废卷:作废后不进报告与阅卷队列">作废此卷</a>` : ""}
      ${d.hasB && canEdit ? `<a href="#" onclick="hubAssignVariant('${d.id}',${w.student},'A');return false" title="按 A 卷重读客观题作答">指派A卷</a>
      <a href="#" onclick="hubAssignVariant('${d.id}',${w.student},'B');return false" title="按 B 卷重读客观题作答并归一题序">指派B卷</a>` : ""}
      ${isResidual(w) ? `<a href="#" onclick="hubAck('${d.id}',${w.student},true);return false" title="已线下核对该生各页:接受残卷,不再阻塞异常阶段(继续补扫会自动合并成完整卷)">接受残卷</a>` : ""}
      <a href="/grader.html?exam=${d.id}">去阅卷裁决</a>`;
    const warns = (d.warnings || []).slice().sort((a, b) =>
      (a.resolved - b.resolved) || (a.soft - b.soft) || (a.student - b.student)); // 未决在前、人工裁决次之、提示类沉底
    OG.listKit({
      id: "ogList-warn", state: OG.listState("warn"), rows: () => warns,
      chipOf: w => !w.resolved ? "open" : (w.soft ? "soft" : "done"),
      chips: [
        { k: "open", label: "待裁决", count: warns.filter(w => !w.resolved).length },
        { k: "done", label: "已裁决", count: warns.filter(w => w.resolved && !w.soft).length },
        { k: "soft", label: "提示类", count: warns.filter(w => w.soft).length },
      ],
      search: (w, q) => (w.reg || "").toLowerCase().includes(q) || String(w.student) === q ||
        (w.texts || []).some(t => t.toLowerCase().includes(q)),
      placeholder: "搜索卷号/考号/告警内容",
      headHTML: () => "<tr><th>卷号</th><th>考号</th><th>告警</th><th>处理</th></tr>",
      rowHTML: w => `<tr style="${w.resolved || w.soft ? "opacity:.55" : ""}"><td>${w.student}</td>
        <td>${OG.esc(w.reg || "?")}${w.variant ? ` <span class="pill on">${w.variant}卷</span>` : ""}</td>
        <td>${(w.texts || []).map(t => OG.esc(t)).join(";<br>")}</td>
        <td style="display:flex;gap:10px;flex-wrap:wrap">${w.resolved ? `<span class="hint">已裁决 ✓</span>` : warnActions(w)}</td></tr>`,
      empty: "没有符合条件的异常卷",
    }).render();
  }
  // 已作废卷(折叠区)
  if (document.getElementById("ogList-void")) {
    OG.listKit({
      id: "ogList-void", state: OG.listState("void"), rows: () => d.voidedRows || [], size: 10,
      search: (v, q) => (v.reg || "").toLowerCase().includes(q) || String(v.student) === q,
      placeholder: "搜索卷号/考号",
      headHTML: () => "<tr><th>卷号</th><th>考号</th><th>操作</th></tr>",
      rowHTML: v => `<tr style="opacity:.6"><td>卷 ${v.student}</td><td>${OG.esc(v.reg || "?")}</td>
        <td>${canEdit ? `<a href="#" onclick="hubVoid('${d.id}',${v.student},false);return false">恢复此卷</a>` : `<span class="hint">恢复需建卷人/年级组长/管理员</span>`}</td></tr>`,
      empty: "没有作废卷",
    }).render();
  }
  // ⚑ 待复核队列
  if (document.getElementById("ogList-flag")) {
    OG.listKit({
      id: "ogList-flag", state: OG.listState("flag"), rows: () => d.flagged || [],
      search: (f, q) => (f.reg || "").toLowerCase().includes(q) || String(f.student) === q || String(objN + f.question) === q,
      placeholder: "搜索题号/卷号/考号",
      headHTML: () => "<tr><th>题号</th><th>卷号</th><th>考号</th><th>当前分</th><th>操作</th></tr>",
      rowHTML: f => `<tr><td>第 ${objN + f.question} 题</td><td>${f.student}</td>
        <td>${d.anonymous ? "已匿名" : OG.esc(f.reg || "?")}</td><td>${f.score}</td>
        <td style="display:flex;gap:10px;flex-wrap:wrap">
          <a href="/grader.html?exam=${d.id}&q=${f.question}&student=${f.student}">复核改分 ↗</a>
          <a href="#" onclick="hubClearFlag('${d.id}',${f.student},${f.question});return false" title="复核完成的收口:清除 ⚑,队列排空(分数不变)">清除⚑</a>
        </td></tr>`,
      empty: "没有待复核切片",
    }).render();
  }
  // 成绩复核申请:待处理在前、已回复沉底;深链到学生个体复核页改分
  if (document.getElementById("ogList-appeal")) {
    const blockedLocal = d.appealBlocked || {}, blockedGlobal = d.appealBanned || {};
    const rows = (d.appeals || []).slice().sort((a, b) => {
      const ao = a.status === "open" ? 0 : 1, bo = b.status === "open" ? 0 : 1;
      return ao - bo || (a.time < b.time ? 1 : -1); // 已回复的按时间倒序沉底
    });
    const appealBadge = a => blockedGlobal[a.by] ? ` <span class="pill off" title="全校复核黑名单:${OG.esc(blockedGlobal[a.by] || "(无说明)")}">全局拉黑</span>`
      : blockedLocal[a.by] ? ` <span class="pill warn" title="本场已拉黑:${OG.esc(blockedLocal[a.by] || "(无说明)")}">本场拉黑</span>` : "";
    OG.listKit({
      id: "ogList-appeal", state: OG.listState("appeal"), rows: () => rows,
      chipOf: a => a.status === "open" ? "open" : "done",
      chips: [
        { k: "open", label: "待处理", count: rows.filter(a => a.status === "open").length },
        { k: "done", label: "已回复", count: rows.filter(a => a.status !== "open").length },
      ],
      search: (a, q) => (a.by || "").toLowerCase().includes(q) || (a.name || "").toLowerCase().includes(q) ||
        (a.reason || "").toLowerCase().includes(q) || (a.reply || "").toLowerCase().includes(q),
      placeholder: "搜索考号/姓名/理由/回复",
      headHTML: () => "<tr><th>#</th><th>时间</th><th>学生</th><th>理由</th><th>状态</th><th>处理</th></tr>",
      rowHTML: a => `<tr><td>${a.n}</td><td>${OG.esc(a.time)}</td>
        <td>${OG.esc(a.name || a.by)}${appealBadge(a)}</td>
        <td style="max-width:320px">${OG.esc(a.reason)}</td>
        <td>${a.status === "open" ? '<span class="pill off">待处理</span>' : `<span class="pill on">已回复</span>`}</td>
        <td style="min-width:260px">${a.status === "open"
          ? `${canEdit ? `<input id="appealReply${a.n}" placeholder="回复结论(可空)" style="width:150px;padding:4px 8px">
             <button class="ghost" onclick="resolveAppeal('${d.id}',${a.n})">标记已处理</button>
             <a href="#" class="danger" onclick="hubAppealBlock('${d.id}','${OG.esc(a.by)}');return false" title="拉黑后该生不能再对本场发起复核申请">拉黑本场</a>` : `<span class="hint">裁决需建卷人/年级组长/管理员</span>`}
             <a href="/review.html?exam=${d.id}&reg=${encodeURIComponent(a.by)}&appeal=${a.n}"><b>查看答卷并改分 ↗</b></a>`
          : `<span class="hint">${OG.esc(a.reply || "(无回复)")}<br>${OG.esc(a.resolvedBy || "")} ${OG.esc(a.resolvedAt || "")}</span>`}</td></tr>`,
      empty: "没有复核申请",
    }).render();
  }
}

// hubAppealBlock 弹出本场拉黑小面板(管理员可同时拉黑全校)。
function hubAppealBlock(id, reg) {
  const box = document.getElementById("appealBlockBox");
  if (!box) return;
  box.innerHTML = `<div class="panel" style="padding:10px 12px;background:var(--bg)">
    <b>限制复核申请资格 · 考号 ${OG.esc(reg)}</b>
    <p class="hint" style="margin:4px 0">该生将不能再对本场考试发起复核申请(已有申请不受影响,可正常裁决);已发起的待处理申请建议先裁决。</p>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <input id="blockReason" placeholder="原因(选填,仅教师可见)" maxlength="200" style="width:260px;padding:5px 8px">
      ${OG.is("admin") ? `<label title="全校黑名单:该生对所有考试的复核申请一律拒绝(用户管理页可解除)"><input type="checkbox" id="blockGlobal"> 同时加入全校黑名单</label>` : ""}
      <button class="ghost" style="color:var(--bad);border-color:var(--bad)" onclick="hubBlockSubmit('${OG.esc(id)}','${OG.esc(reg)}',true)">确认拉黑</button>
      <button class="ghost" onclick="document.getElementById('appealBlockBox').innerHTML=''">取消</button>
    </div></div>`;
  document.getElementById("blockReason").focus();
}

// hubBlockSubmit 拉黑提交:本场必拉;勾了全局(仅管理员界面可见)再加 PUT school/appeal-bans。
async function hubBlockSubmit(id, reg, blocked) {
  const reason = (document.getElementById("blockReason") || {}).value || "";
  const global = (document.getElementById("blockGlobal") || {}).checked;
  try {
    await OG.jpost(`/api/v1/exams/${id}/appeals/block`, { reg, blocked, reason });
    if (global && OG.is("admin")) await OG.jpost(`/api/v1/school/appeal-bans`, { reg, blocked, reason }, "PUT");
    OG.toast(blocked ? `已限制考号 ${reg} 的复核申请资格${global ? "(含全校)" : ""}` : `已恢复考号 ${reg} 的复核申请资格`);
    document.getElementById("appealBlockBox").innerHTML = "";
    await openExam(id);
  } catch (e) { OG.toast("操作失败:" + e.message, 3600); }
}

// 填充场次下拉(选项来自全校场次表 /api/v1/school/sessions;selected 缺省保留当前值)。
async function fillSessionOptions(selId, selected) {
  const sel = document.getElementById(selId);
  if (!sel) return;
  const cur = selected !== undefined ? selected : sel.value;
  sel.innerHTML = `<option value="">(不参与时段)</option>`;
  try {
    const list = await OG.jget("/api/v1/school/sessions");
    sel.innerHTML += list.map(s => `<option value="${s.name}" ${s.name === cur ? "selected" : ""}>${s.name} ${s.start}-${s.end}</option>`).join("");
  } catch (e) { /* 场次表读取失败:仅保留空选项,不影响其它功能 */ }
}

// assignedRegOf 从详情缓存推导某卷的考号(重复卷表头显示姓名用)。
function assignedRegOf(d, student) {
  if (d.regOf && d.regOf[String(student)]) return d.regOf[String(student)];
  for (const w of (d.warnings || [])) if (w.student === student && w.reg) return w.reg;
  return "";
}

// 重复卷裁决:保留 keep 卷,组内其余作废。
async function resolveDup(id, keep, group) {
  const others = group.filter(s => s !== keep);
  if (!others.length) return;
  if (!confirm(`保留卷 ${keep},作废卷 ${others.join("、")}(作废不进报告与阅卷,可恢复)?`)) return;
  try {
    for (const s of others) await OG.jpost(`/api/v1/exams/${id}/results/${s}/void`, { voided: true });
    await openExam(id); await loadExams();
  } catch (e) { alert(e.message); }
}

// AB 卷:人工指派卷种(卷种判不出/改派),按所指派卷种重读客观题并归一。
async function hubAssignVariant(id, student, variant) {
  if (!confirm(`将第 ${student} 卷指派为 ${variant} 卷?将按 ${variant} 卷版式重读客观题作答并归一题序`)) return;
  try {
    await OG.jpost(`/api/v1/exams/${id}/assign-variant`, { student, variant });
    await openExam(id);
  } catch (e) { alert(e.message); }
}

// 作废/恢复卷。
async function hubVoid(id, student, voided) {
  const verb = voided ? "作废" : "恢复";
  if (voided && !confirm(`确认作废卷 ${student}?作废后不进报告/统计/阅卷队列,可随时恢复。`)) return;
  try {
    await OG.jpost(`/api/v1/exams/${id}/results/${student}/void`, { voided });
    await openExam(id); await loadExams();
  } catch (e) { alert(e.message); }
}

// 保存考试元数据(日期/学期/类型/分组/匿名)。
async function saveExamMeta(id) {
  const msg = document.getElementById("metaMsg");
  try {
    await OG.jpost(`/api/v1/exams/${id}/meta`, {
      examDate: document.getElementById("metaDate").value || "",
      term: document.getElementById("metaTerm").value.trim(),
      examType: document.getElementById("metaType").value,
      examGroup: document.getElementById("metaGroup").value.trim(),
      session: document.getElementById("metaSession").value,
      anonymous: document.getElementById("metaAnon").checked,
    });
    msg.textContent = "已保存 ✓";
    await openExam(id); await loadExams();
  } catch (e) { msg.textContent = e.message; }
}

// 裁决复核申请。
async function resolveAppeal(id, n) {
  const reply = (document.getElementById("appealReply" + n) || {}).value || "";
  try {
    await OG.jpost(`/api/v1/exams/${id}/appeals/${n}/resolve`, { reply });
    OG.toast("复核申请已标记处理");
    await openExam(id);
  } catch (e) { OG.toast("裁决失败:" + e.message, 4200); }
}

// 手工成绩录入面板(免版式考试:逐格打分 + 整表粘贴)。已录分数回显(manualScores):
// 此前保存成功后表格仍是全空,教师无法核对谁已录,误以为没保存会重复录入。
function manualScorePanel(d) {
  const full = d.manualFull || 100;
  const done = d.manualScores || {};
  const rows = (d.roster || []).map(r => {
    const absent = (d.absent || []).some(a => a.reg === r.reg);
    const got = done[r.reg];
    return `<tr data-reg="${OG.esc(r.reg)}" style="${absent ? "opacity:.5" : ""}">
      <td>${OG.esc(r.reg)}</td><td>${OG.esc(r.name || "-")}</td><td>${OG.esc((r.classes || []).join("、") || "-")}</td>
      <td><input class="msc" data-reg="${OG.esc(r.reg)}" type="number" step="0.5" min="0" max="${full}"
        ${got != null ? `value="${got}" style="width:90px;padding:5px 8px;font-weight:600;color:var(--brand)"` : `placeholder="成绩" style="width:90px;padding:5px 8px"`}></td>
      <td>${got != null ? `<span class="hint">已录</span> · ` : ""}<a href="#" onclick="manualAbsent('${d.id}','${OG.esc(r.reg)}',${!absent});return false">${absent ? "取消缺考" : "标缺考"}</a></td>
    </tr>`;
  }).join("");
  const doneN = Object.keys(done).length;
  return `<div class="group-title" style="margin-top:16px">① 成绩录入(手工成绩科目 · 满分 ${full};已录 ${doneN}/${(d.roster || []).length})</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
      <button class="primary" onclick="saveManualScores('${d.id}')">保存全部已填成绩</button>
      <span class="hint">或把 Excel 两列(考号、成绩)复制到下面一键导入:</span>
      <textarea id="manualPaste" rows="2" placeholder="00000001 92.5&#10;00000002 88" style="width:260px;font-family:monospace;font-size:12px"></textarea>
      <button class="ghost" onclick="pasteManualScores('${d.id}')">导入粘贴内容</button>
      <span class="hint" id="manualMsg"></span>
    </div>
    <table><tr><th>考号</th><th>姓名</th><th>班级</th><th>成绩</th><th></th></tr>${rows}</table>`;
}

// 收集成绩录入表已填分数并批量保存。
async function saveManualScores(id) {
  const scores = [...document.querySelectorAll(".msc")].filter(i => i.value !== "")
    .map(i => ({ reg: i.dataset.reg, score: parseFloat(i.value) }));
  await postManualScores(id, scores);
}

// 粘贴导入:「考号 成绩」(兼容 Tab/逗号/空格分隔)。
async function pasteManualScores(id) {
  const raw = document.getElementById("manualPaste").value.trim();
  if (!raw) return;
  const scores = raw.split(/\n+/).map(line => {
    const m = line.trim().split(/[\s,\t,，]+/);
    return m.length >= 2 ? { reg: m[0], score: parseFloat(m[1]) } : null;
  }).filter(x => x && !isNaN(x.score));
  await postManualScores(id, scores);
}

async function postManualScores(id, scores) {
  const msg = document.getElementById("manualMsg");
  if (!scores.length) { msg.textContent = "没有可保存的成绩"; return; }
  try {
    const r = await OG.jpost(`/api/v1/exams/${id}/manual-scores`, { scores });
    const bad = (r.results || []).filter(x => !x.ok);
    msg.textContent = `已保存 ${r.results.filter(x => x.ok).length} 条` + (bad.length ? `,失败 ${bad.length} 条:${bad.map(b => b.reg + "(" + b.error + ")").join("、")}` : "");
    await openExam(id); await loadExams();
    const m2 = document.getElementById("manualMsg");
    if (m2) m2.textContent = msg.textContent;
  } catch (e) { msg.textContent = e.message; }
}

// 手工成绩科目的缺考登记。
async function manualAbsent(id, reg, absent) {
  try {
    await OG.jpost(`/api/v1/exams/${id}/manual-scores`, { scores: [{ reg, absent }] });
    await openExam(id);
  } catch (e) { alert(e.message); }
}

// 扫描上传(P1:多页 PDF 自动拆页 + 分批接力,替代单个大请求):
//   - PDF 拆页用共享工具 OG.collectScanFiles(common.js,与设计器「从试卷识别」同源);
//   - 全部图像按 15 张一批顺序 POST /scans(服务端按页考号归组,断点续传语义),
//     每批完成即入库,中途失败只丢当前批,已传批不重来。

async function hubUpload(id) {
  const files = [...(document.getElementById("hubScanFiles").files || [])];
  const msg = document.getElementById("hubScanMsg");
  if (!files.length) { msg.innerHTML = `<span class="err">请先选择扫描件</span>`; return; }
  let images;
  try {
    images = await OG.collectScanFiles(files, msg);
  } catch (e) { msg.innerHTML = `<span class="err">${OG.esc(e.message)}</span>`; return; }
  if (!images.length) { msg.innerHTML = `<span class="err">没有可上传的图像</span>`; return; }
  setUploadBusy(id, true); // 防连点双传(重复 POST 整批 → 误报重答)
  try { await uploadBatches(id, images, 0, 0, [], []); }
  finally { setUploadBusy(id, false); }
}

// 上传期间禁用文件框与上传按钮;离开详情页后 setUploadBusy 找不到元素,静默无害
function setUploadBusy(id, busy) {
  const inp = document.getElementById("hubScanFiles");
  if (inp) inp.disabled = busy;
  const btn = document.getElementById("hubScanBtn");
  if (btn) { btn.disabled = busy; btn.textContent = busy ? "上传中…" : "上传本批扫描件"; }
}

// 分批上传(15 张一批);断批后停在断点,点「继续」从失败批接着传,
// 不再引导"重新上传未完成的部分"造成已入库卷整批重传、误报重答。
// 进度渲染按"当下是否还在详情页"即时探测:上传中途切走不再中断传输,
// 断点状态挂在 hubUploadState,回详情页由渲染层给出「继续」入口。
let hubUploadState = null;
async function uploadBatches(id, images, startBatch, addedTotal, failedAll, notesAll) {
  const BATCH = 15;
  const batches = Math.ceil(images.length / BATCH);
  const say = html => { const m = document.getElementById("hubScanMsg"); if (m) m.innerHTML = html; };
  for (let b = startBatch; b < batches; b++) {
    const chunk = images.slice(b * BATCH, (b + 1) * BATCH);
    say(`<span class="hint">上传识别中:第 ${b + 1}/${batches} 批(共 ${images.length} 张,已入库 ${addedTotal} 卷)…</span>`);
    const fd = new FormData();
    for (const f of chunk) fd.append("images", f);
    try {
      const r = await fetch(`/api/v1/exams/${id}/scans`, { method: "POST", body: fd });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "上传失败");
      addedTotal += d.added || 0;
      failedAll = failedAll.concat(d.failed || []);
      notesAll = notesAll.concat(d.notes || []);
    } catch (e) {
      hubUploadState = { id, images, nextBatch: b, addedTotal, failedAll, notesAll };
      say(`<span class="err">第 ${b + 1} 批失败:${OG.esc(e.message)}(已入库 ${addedTotal} 卷不受影响)</span>
        <button class="ghost" style="margin-left:8px" onclick="hubUploadResume()">从第 ${b + 1} 批继续</button>`);
      return;
    }
  }
  hubUploadState = null;
  let inner = `✓ 本批入库 ${addedTotal} 卷(${images.length} 张)。`;
  if ((failedAll || []).length) inner += `<br>失败 ${failedAll.length} 张(未计入):<br>` + failedAll.map(f => `第 ${f.index} 张:${OG.esc(f.error)}`).join("<br>");
  if (notesAll.length) inner += `<br>归组提示:<br>` + [...new Set(notesAll)].map(n => `· ${OG.esc(n)}`).join("<br>");
  // 完成后只在用户仍停留在本考试详情时刷新详情(不把已离开的用户拽回来);列表静默刷新
  if (hubExam && hubExam.id === id && !document.getElementById("tab-exam").hidden) {
    await openExam(id);
    const m2 = document.getElementById("hubScanMsg");
    if (m2) m2.innerHTML = inner;
  }
  await loadExams();
}
function hubUploadResume() {
  if (!hubUploadState) return;
  const s = hubUploadState;
  setUploadBusy(s.id, true);
  uploadBatches(s.id, s.images, s.nextBatch, s.addedTotal, s.failedAll, s.notesAll)
    .finally(() => setUploadBusy(s.id, false));
}

// 推荐考号:逐位判涂 + 名册匹配 → 一键采纳
async function hubSuggest(id, student) {
  const boxEl = document.getElementById("hubSuggestBox");
  boxEl.innerHTML = `<span class="hint">读取推荐…</span>`;
  try {
    const s = await OG.jget(`/api/v1/exams/${id}/suggest/${student}`);
    const regs = (s.suggestions || []).map(x => x.reg);
    let html = `卷 ${student} 当前考号 <b>${OG.esc(s.reg || "?")}</b>(涂位 ${s.regValid ? "有效" : "异常"})`;
    if (regs.length) {
      html += ` ,推荐:` + regs.map(r =>
        `<button class="ghost" style="margin:2px 4px;padding:3px 10px" onclick="hubAdopt('${id}',${student},'${OG.esc(r)}')">${OG.esc(r)}</button>`).join("");
    } else {
      html += ` ,名册无可信推荐,可人工指派:<input id="hubAdoptReg" placeholder="考号" style="width:110px;padding:3px 8px">` +
        `<button class="ghost" style="margin-left:6px;padding:3px 10px" onclick="hubAdopt('${id}',${student},document.getElementById('hubAdoptReg').value)">指派</button>`;

}

// 批量登记缺考(缺扫几十人时不必逐个确认)
async function hubAbsentAll(id) {
  const d = hubExam;
  const missing = (d.roster || []).filter(st_ => !d.scannedReg[st_.reg] && !(d.absent || []).some(a => a.reg === st_.reg));
  if (!missing.length) return;
  if (!confirm(`为缺扫名单的 ${missing.length} 人全部登记缺考?\n(缺考不进统计与阅卷;误标的可稍后取消)`)) return;
  let ok = 0; const errs = [];
  for (const m of missing) {
    try { await OG.jpost(`/api/v1/exams/${id}/manual`, { reg: m.reg, absent: true }); ok++; }
    catch (e) { errs.push(`${m.reg}:${e.message}`); }
  }
  await openExam(id); await loadExams();
  if (errs.length) alert(`已登记 ${ok} 人,失败 ${errs.length} 人:\n${errs.join("\n")}`);
}

// 修正参考答案:逐格读取(判断 T/F、多选连写如 AC;空格=该题不判分)。
// AB 卷两卷共用规范答案键:保存后 A/B 同步重统;B 卡面答案是派生的只读展示,无独立保存入口。
async function hubSaveKey(id) {
  const msg = document.getElementById("hubKeyMsg");
  const n = (hubExam.objective || []).length;
  const cells = [...document.querySelectorAll("[data-hubkey]")].sort((a, b) => (+a.dataset.hubkey) - (+b.dataset.hubkey));
  if (cells.length !== n) { msg.innerHTML = `<span class="err">答案格子数 ${cells.length} 与客观题 ${n} 不一致</span>`; return; }
  const key = cells.map(c => c.value.trim().toUpperCase());
  for (let i = 0; i < key.length; i++) {
    const kind = (hubExam.objective[i] || {}).kind || "choice";
    const ok = key[i] === "" || (kind === "judge" ? /^[TF]$/.test(key[i]) : /^[A-F]{1,4}$/.test(key[i]));
    if (!ok) { msg.innerHTML = `<span class="err">第 ${i + 1} 题答案「${key[i]}」不合法(判断题用 T/F,多选连写如 AC,单选一个字母)</span>`; return; }
  }
  try {
    await OG.jpost(`/api/v1/exams/${id}/key`, { key, variant: "A" });
    msg.innerHTML = `<span class="hint">✓ 已保存并重统</span>`;
    await openExam(id); await loadExams();
  } catch (e) { msg.innerHTML = `<span class="err">${e.message}</span>`; }
}

// loadDesignerB 载入设计器「AB 卷助手」生成的 B 卷(og.lastLayoutAB = {a,b,order}):
// 一键填 B 版式 + 题序对照,答案格子按 B 版式重出(留空 = 建考时与 A 卷答案自动同步)。
function loadDesignerB() {
  const box = document.getElementById("examMsg");
  const raw = localStorage.getItem("og.lastLayoutAB");
  if (!raw) { box.className = "err"; box.textContent = "设计器还没有生成过 B 卷:到「设计器 → AB 卷助手」生成一次(打乱/倒序)。"; return; }
  let p;
  try { p = JSON.parse(raw); } catch (e) { box.className = "err"; box.textContent = "og.lastLayoutAB 无法解析,请到设计器重新生成 B 卷。"; return; }
  if (!p || !p.b || !Array.isArray(p.order)) { box.className = "err"; box.textContent = "设计器 B 卷数据不完整,请到设计器重新生成。"; return; }
  document.getElementById("examLayout2").value = JSON.stringify(p.b);
  document.getElementById("examOrder2").value = p.order.join(",");
  renderKeyGridB();
  box.className = "hint";
  box.textContent = `已载入设计器 B 卷版式(题序对照 ${p.order.join(",")});B 卷答案留空即建考时与 A 卷自动同步。`;
}

function loadLastLayout() {  const saved = localStorage.getItem("og.lastLayout");
  const box = document.getElementById("examMsg");
  box.className = "err";
  if (!saved) { box.textContent = "设计器还没有生成过版式:先点「打开设计器出卡」生成一次。"; return; }
  document.getElementById("examLayout").value = saved;
  box.className = "hint";
  box.textContent = "已载入设计器最近生成的版式。";
  renderLayoutMeta();
  // 设计器若已生成过答案(题库带出/手填),一并带出 —— 建考零手填。
  // 配对校验(C-3):答案数组必须与版式指纹、客观题数都对得上才自动填入 ——
  // 版式改过之后,旧答案按下标静默套进新题序会让全班按错答案判分。
  const savedKey = localStorage.getItem("og.lastKey");
  if (savedKey) {
    try {
      const p = JSON.parse(savedKey);
      const arr = Array.isArray(p) ? p : (p && Array.isArray(p.arr) ? p.arr : null);
      if (arr) {
        const cells = [...document.querySelectorAll("#keyGrid input[data-key]")];
        const legacy = Array.isArray(p); // 旧格式(纯数组)无指纹:仅按题数把关
        const sigOK = legacy || !p.sig || p.sig === OG.strHash(saved);
        const nOK = arr.length === cells.length && (legacy || !p.n || p.n === cells.length);
        if (sigOK && nOK) {
          let used = 0;
          arr.forEach((v, i) => { if (cells[i] && v) { cells[i].value = v; used++; } });
          if (used) box.textContent = `已载入设计器最近版式与 ${used} 题参考答案。`;
        } else {
          box.className = "hint";
          box.textContent = "已载入设计器最近版式;但它保存的参考答案与当前版式不匹配(版式已变更),请按新版式重新录入答案。";
        }
        keyFilledCount();
      }
    } catch (_) { /* 忽略坏数据 */ }
  }
}

  const byClass = {};
  for (const s of rosterStudents) for (const c of (s.classes || []).length ? s.classes : ["(未分班)"]) {
    (byClass[c] = byClass[c] || []).push(s);

function rosterPickApply() {
  const picked = [...document.querySelectorAll("#rosterPicker input:checked")].map(i => i.value);
  if (!picked.length) return;
  const rows = rosterStudents
    .filter(s => (s.classes || []).some(c => picked.includes(c)))
    .map(s => [s.reg, s.name || "", (s.classes || []).join("|")].join(","));
  document.getElementById("examRoster").value = rows.join("\n");
}

// 解析当前版式(失败返回 null 并提示)
function parseLayoutQuiet() {
  try {
    const l = JSON.parse(document.getElementById("examLayout").value);
    if (!l || (!l.questions && !l.subjectives)) throw new Error("版式里没有题目");
    return l;
  } catch (e) {
    const box = document.getElementById("examMsg");
    box.className = "err";
    box.textContent = "版式 JSON 无法解析:" + e.message;
    return null;
  }
}

// 版式摘要:教师不必看懂 JSON,只看人话
function renderLayoutMeta() {
  const l = parseLayoutQuiet();
  if (!l) { document.getElementById("layoutSummary").textContent = ""; return; }
  const qs = l.questions || [], subs = l.subjectives || [];
  const kinds = {};
  for (const q of qs) kinds[q.kind] = (kinds[q.kind] || 0) + 1;
  const kindTxt = Object.entries(kinds).map(([k, n]) => ({ choice: "单选", judge: "判断", multiple: "多选" }[k] || k) + "×" + n).join(" + ") || "无客观题";
  const subTxt = subs.length ? subs.map(s => ({ fillblank: "填空", subjective: "解答" }[s.kind] || s.kind) + `${s.score || ""}分`).join("、") : "无";
  const objScore = qs.reduce((a, q) => a + (+q.score || 1), 0);
  const subScore = subs.reduce((a, s) => {
    const parts = (s.parts || []).reduce((x, p) => x + (+p.score || 0), 0);
    return a + (parts || +s.score || 0);
  }, 0);
  const regTxt = { fill: "填涂", barcode: "条码", qr: "二维码", "fill+barcode": "填涂+条码", "fill+qr": "填涂+二维码" }[l.regMode || "fill"] || l.regMode;
  document.getElementById("layoutSummary").innerHTML =
    `卷头 <b>${(l.title || "未命名").replace(/</g, "&lt;")}</b> · 考号 ${l.regDigits || 0} 位(${regTxt}) · 客观 ${qs.length} 题(${kindTxt},${objScore} 分) · 主观 ${subs.length} 题(${subTxt},${subScore} 分) · 卷面合计 <b>${objScore + subScore} 分</b>`;
  renderKeyGrid();
}

// B 卷答案网格:粘贴 B 卷版式后按其客观题数出格子(答案按 B 卡面题号填);
// 同时按「B 卡面题规格 ↔ A 卷题规格」自动推导题序对照回填(手填值优先,不覆盖)。
function renderKeyGridB() {
  const grid = document.getElementById("keyGridB");
  if (!grid) return;
  const order2Input = document.getElementById("examOrder2");
  let qs = [];
  try {
    const t = document.getElementById("examLayout2").value.trim();
    if (!t) { grid.innerHTML = `<span class="hint">未填自定义 B 卷版式(勾选上方「启用 AB 卷」即自动生成)</span>`; return; }
    qs = (JSON.parse(t).questions) || [];
  } catch (e) { grid.innerHTML = `<span class="hint">B 卷版式 JSON 暂不可解析</span>`; return; }
  grid.innerHTML = qs.map((q, i) => `<label style="font-size:11px;text-align:center">B${i + 1}<input data-key maxlength="${(q.kind === "judge") ? 1 : 4}" style="width:100%;padding:4px;text-align:center;font-family:monospace"></label>`).join("");
  // 自动推导题序对照:卡面第 i 题的规格在 A 卷里逐题找第一个未占用的同规格位置。
  // 规格可区分时推导值即真实题序;规格完全相同的题互换无法区分,机器核对不了纸质卷的实际题序。
  try {
    const la = JSON.parse(document.getElementById("examLayout").value);
    const aqs = la.questions || [];
    const spec = q => [q.kind, q.options, q.score, q.knowledge || "", q.bankId || ""].join("\u0000");
    const used = new Array(aqs.length).fill(false);
    const order = [];
    let matched = true;
    for (const q of qs) {
      let at = -1;
      for (let j = 0; j < aqs.length; j++) {
        if (!used[j] && spec(aqs[j]) === spec(q)) { at = j; break; }
      }
      if (at < 0) { matched = false; break; }
      used[at] = true; order.push(at + 1);
    }
    if (matched && order.length === aqs.length && order2Input && !order2Input.value.trim()) {
      order2Input.value = order.join(",");
    }
    if (matched && order.length === aqs.length && new Set(qs.map(spec)).size === 1) {
      grid.innerHTML += `<div class="hint" style="grid-column:1/-1;color:var(--warn)">⚠ 本版式客观题规格完全相同,机器无法核对题序对照 —— 请务必对照 B 卷纸质试卷的实际题序,人工确认上方「题序对照」与之一致(否则 B 卷会按错位题序判分)。</div>`;
    }
  } catch (e) { /* A 卷版式暂不可解析:跳过推导,不阻塞答案格子 */ }
}

// 答案逐题网格:按版式客观题自动出格子
function renderKeyGrid() {
  const l = parseLayoutQuiet();
  const grid = document.getElementById("keyGrid");  if (!l) { grid.innerHTML = ""; return; }
  const qs = l.questions || [];
  grid.innerHTML = qs.map((q, i) => {
    const ph = q.kind === "judge" ? "T/F" : q.kind === "multiple" ? "如 AC" : "A~F";
    const tag = q.kind === "judge" ? "判" : q.kind === "multiple" ? "多" : "";
    return `<label style="font-size:12px;color:var(--text2);display:grid;gap:2px">${i + 1}${tag}
      <input data-key="${i}" maxlength="4" placeholder="${ph}" style="padding:6px 4px;text-align:center;font-size:14px" oninput="keyFilledCount()"></label>`;
  }).join("") || `<span class="hint">本版式没有客观题,无需答案。</span>`;
  keyFilledCount();
}
function keyFilledCount() {
  const cells = [...document.querySelectorAll("#keyGrid input[data-key]")];
  const filled = cells.filter(c => c.value.trim()).length;
  document.getElementById("keyFilled").textContent = cells.length ? `已填 ${filled}/${cells.length}` : "";
}
// 一串字母快速填入:ABCDABT... 按题序拆格(判断题吃 T/F,其余每格一个字母)
function quickFillKey() {
  const l = parseLayoutQuiet();
  if (!l) return;
  const raw = (document.getElementById("keyQuick").value || "").toUpperCase().replace(/[^A-FTF]/g, "");
  const qs = l.questions || [];
  const cells = [...document.querySelectorAll("#keyGrid input[data-key]")];
  let pos = 0, used = 0;
  for (let i = 0; i < qs.length && pos < raw.length; i++) {
    if (qs[i].kind === "judge") {
      const ch = raw[pos];
      if (ch === "T" || ch === "F") { cells[i].value = ch; pos++; used++; }
    } else {
      cells[i].value = raw[pos++];
      used++;
    }
  }
  keyFilledCount();
  const box = document.getElementById("examMsg");
  box.className = used ? "hint" : "err";
  box.textContent = used ? `快速填入 ${used} 题(判断题按 T/F 识别)。` : "没有识别到可填入的字母。";
}
// 从题库带出:版式题目携带 bankId 时按 id 匹配参考答案
async function bankFillKey() {
  const l = parseLayoutQuiet();
  if (!l) return;
  const qs = l.questions || [];
  const ids = [...new Set(qs.map(q => q.bankId).filter(Boolean))];
  if (!ids.length) {
    const box = document.getElementById("examMsg");
    box.className = "err";
    box.textContent = "版式里的题不是从题库选的(无题库编号),请手填或用快速填入。";
    return;
  }
  const bank = await (await fetch("/api/v1/bank")).json();
  const byId = Object.fromEntries(bank.map(it => [it.id, it]));
  const cells = [...document.querySelectorAll("#keyGrid input[data-key]")];
  let filled = 0;
  qs.forEach((q, i) => {
    const it = q.bankId && byId[q.bankId];
    if (it && it.answer) { cells[i].value = String(it.answer).toUpperCase(); filled++; }
  });
  keyFilledCount();
  const box = document.getElementById("examMsg");
  box.className = filled ? "hint" : "err";
  box.textContent = filled ? `从题库带出 ${filled} 题答案。` : "题库里没有这些题的参考答案。";
}

function toggleExamKind() {

function appendMetaFields(fd) {
  const g = id => (document.getElementById(id) || {}).value || "";
  const meta = { examDate: g("examDate").trim(), term: g("examTerm").trim(), examType: g("examType"), examGroup: g("examGroup").trim(), session: g("examSession") };

}

async function submitCreateExam() {
  const msg = document.getElementById("examMsg");
  msg.className = "err"; msg.textContent = "";
  try {
    const manual = document.querySelector('input[name=examkind]:checked').value === "manual";
    const fd = new FormData();
    appendMetaFields(fd);
    const rosterText = document.getElementById("examRoster").value.trim();
    const subject = document.getElementById("examSubject").value.trim();
    if (subject) fd.append("subject", subject);
    if (rosterText) fd.append("roster", rosterText);
    if (manual) {
      if (!rosterText) throw new Error("手工成绩科目必须提供学生名册(从班级勾选带出或粘贴 CSV)");
      fd.append("manual", "1");
      fd.append("full", document.getElementById("manualFull").value || "100");
    } else {
      const layout = JSON.parse(document.getElementById("examLayout").value);
      const cells = [...document.querySelectorAll("#keyGrid input[data-key]")];
      const key = cells.map(c => c.value.trim().toUpperCase()); // 允许留空:该题不判分,详情页可后补重统
      const files = document.getElementById("examImages").files; // 可选:不传=先建档,考后到详情续传
      fd.append("layout", JSON.stringify(layout));
      fd.append("key", JSON.stringify(key));
      fd.append("threshold", document.getElementById("threshold").value);
      // AB 卷:高级手填 layout2 走自定义路径(题序自定);否则勾选「启用 AB 卷」= 服务端
      // 自动生成 B 卷(打乱客观题序),答案键两卷共用、无需单独录 B 卷答案。
      const layout2 = document.getElementById("examLayout2").value.trim();
      if (layout2) {
        JSON.parse(layout2); // 语法预检,服务端还有结构校验
        fd.append("layout2", layout2);
        const key2 = [...document.querySelectorAll("#keyGridB input[data-key]")].map(c => c.value.trim().toUpperCase());
        fd.append("key2", JSON.stringify(key2.some(v => v) ? key2 : [])); // 全空 = 服务端按 A 卷答案自动同步
        fd.append("order2", document.getElementById("examOrder2").value.trim());
      } else if (document.getElementById("abAuto").checked) {
        fd.append("abAuto", "1");
      }
      for (const f of files) fd.append("images", f);
    }
    const r = await fetch("/api/v1/exams", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    msg.className = "hint";
    msg.textContent = manual
      ? `手工成绩考试 ${j.id} 已创建(${j.stageLabel}):${j.students} 名学生待录分,满分 ${j.manualFull}。正在打开考试详情…`
      : `考试 ${j.id} 已创建(${j.stageLabel}):${j.students} 卷,客观 ${j.objectiveCount} 题,主观 ${j.subjectiveCount} 题${j.pages > 1 ? `,版式共 ${j.pages} 页` : ""}。正在打开考试详情…`;
    setTimeout(() => openExam(j.id), 600);
  } catch (e) { msg.textContent = e.message; }
}

/* —— 补传扫描已并入「考试详情 → 扫描上传」(内联反馈 + 异常清单闭环) —— */
async function delExam(id) {
  if (!confirm(`删除考试 ${id} 及全部数据?不可恢复。`)) return;
  try {
    await OG.jpost(`/api/v1/exams/${id}`, {}, "DELETE");
    OG.toast(`考试 ${id} 已删除`);
    loadExams();
  } catch (e) { OG.toast("删除失败:" + e.message, 4200); } // 403(删他人考试)/网络失败不再静默
}
async function pubExam(id, pub) {
  // 撤回发布会让已查分的学生瞬间看不到成绩;重新发布会刷新发布时间 —— 高影响操作先确认
  if (!pub && !confirm("撤回发布后,学生/家长端将立即看不到本场成绩。确认撤回?")) return;
  try {
    await OG.jpost(`/api/v1/exams/${id}/publish`, { published: pub });
    OG.toast(pub ? "成绩已发布,学生/家长端可见" : "已撤回发布");
  } catch (e) {
    OG.toast(e.message, 4200); // 门禁拒绝(未评完/异常未裁决/答案未录)与权限问题都在这里说人话
    throw e;
  }
}

/* —— 阅卷任务分配 —— */
/* —— 我的任务(常规流程:教师从任务进入阅卷,不在考试列表里找) —— */
async function loadMyTasks() {
  const box = document.getElementById("tab-tasks");
  let items;
  try { items = await OG.jget("/api/v1/my/tasks"); }
  catch (e) { box.innerHTML = `<div class="panel"><div class="err">${e.message}</div></div>`; return; }
  if (!items.length) {
    box.innerHTML = `<div class="panel"><div class="empty"><div class="pic">☕️</div>当前没有分配给我的阅卷任务~<br>
      <span class="hint">任务由管理员/年级组长在「任务分配」里指派;自己建的考试会出现在「我创建的考试」。</span></div></div>`;
    return;
  }
  // 进行中的排前面(有剩余的优先),同组按时间倒序
  const prio = it => (it.graded >= it.total ? 2 : it.kind === "mine" ? 1 : 0);
  items.sort((a, b) => prio(a) - prio(b) || (a.createdAt < b.createdAt ? 1 : -1));
  let totalLeft = 0, totalAll = 0;
  for (const it of items) { totalLeft += it.total - it.graded; totalAll += it.total; }
  let html = `<div class="panel">
    <div style="display:flex;align-items:center;margin-bottom:10px;gap:10px">
      <b>我的阅卷任务</b><span class="hint">共 ${items.length} 项 · 待评 ${totalLeft} 份(共 ${totalAll})</span>
    </div>
    <table><tr><th>考试</th><th>任务</th><th>类型</th><th>截止</th><th>进度</th><th>考试阶段</th><th></th></tr>`;
  const today = new Date().toISOString().slice(0, 10);
  for (const it of items) {
    const left = it.total - it.graded;
    const pctv = it.total ? Math.round(it.graded * 100 / it.total) : 100;
    const kindTxt = { question: "按题", class: "按班", mine: "建卷人" }[it.kind] || it.kind;
    const link = it.kind === "question" ? `/grader.html?exam=${it.exam}&q=${it.question}` : `/grader.html?exam=${it.exam}`;
    const overdue = it.due && it.due < today && left > 0;
    const dueTxt = it.due
      ? `<span ${overdue ? 'style="color:var(--bad);font-weight:700" title="已截止且未评完" class="pill off"' : ""}>${it.due}${overdue ? " 已截止" : ""}</span>`
      : "-";
    html += `<tr><td><a href="#" onclick="openExam('${it.exam}');return false">${it.exam}</a><div class="hint">${it.createdAt}${it.subject ? " · " + it.subject : ""}</div></td>
      <td>${it.label}</td><td>${kindTxt}</td><td>${dueTxt}</td>
      <td><div class="progress" style="width:110px;display:inline-block;vertical-align:middle"><div style="width:${pctv}%"></div></div> ${it.graded}/${it.total}</td>
      <td><span class="pill ${STAGE_CLASS[it.stage] || "off"}">${it.stageLabel}</span></td>

const pct = v => (v == null ? "-" : (v * 100).toFixed(1) + "%");
const f1 = v => (v == null ? "-" : v.toFixed(1));

async function renderReport() {
  const id = document.getElementById("repExam").value;
  const a = await OG.jget(`/api/v1/exams/${id}/analytics`);
  const d = await OG.jget(`/api/v1/exams/${id}`);
  const ex = exams.find(e => e.id === id) || {};
  document.getElementById("pubState").innerHTML =
    `<span class="pill ${ex.published ? 'on' : 'off'}">${ex.published ? '已发布(学生/家长可查)' : '未发布'}</span>
     <button class="ghost" onclick="pubExam('${id}',${!ex.published}).then(renderReport)">${ex.published ? '撤回发布' : '发布成绩'}</button>`;

  const s = a.stats || {};
  let html = `<div class="cards">
    ${card(s.mean, "平均分 / " + f1(s.total))}
    ${card(s.max, "最高分")}
    ${card(s.min, "最低分")}
    ${card(f1(s.median), "中位数")}
    ${card(f1(s.stdDev), "标准差")}
    ${card(pct(s.passRate), "及格率 (≥" + f1(s.passLine) + ")")}
    ${card(pct(s.goodRate), "优秀率 (≥" + f1(s.goodLine) + ")")}
    ${card(pct(s.lowRate), "低分率 (<" + f1(s.lowLine) + ")")}
    ${card(s.count, "参考人数")}
  </div>`;
  // 分数段柱状图
  html += `<div class="grid2">
    <div><b>分数段分布</b><br><canvas id="segChart" width="520" height="220"></canvas></div>
    <div><b>班级对比</b><table><tr><th>班级</th><th>人数</th><th>均分</th><th>得分率</th></tr>`;
  for (const c of a.byClass) html += `<tr><td>${c.class}</td><td>${c.count}</td><td>${f1(c.mean)}</td><td>${pct(c.meanRate)}</td></tr>`;
  html += `</table></div></div>`;

  // 逐题分析:可选班级对比(班级得分率 + 与全体差值,对齐智学网高频错题表)
  const pcq = a.perClassQuestion || {};
  const cmpClasses = Object.keys(pcq).filter(c => c !== "未匹配").sort();
  const cmp = window.__cmpClass && pcq[window.__cmpClass] ? window.__cmpClass : "";
  html += `<div class="panel" style="margin-top:14px"><b>逐题分析</b>
    <span style="margin-left:12px" class="hint">对比班级
      <select onchange="window.__cmpClass=this.value;renderReport()">
        <option value="">不对比</option>
        ${cmpClasses.map(c => `<option value="${c}" ${c === cmp ? 'selected' : ''}>${c}</option>`).join("")}
      </select></span>
    <table><tr><th>题号</th><th>题型</th><th>满分</th><th>得分率/难度</th>${cmp ? "<th>班级得分率</th><th>与全体差值</th>" : ""}<th>区分度</th><th>作答分布</th></tr>`;
  for (const q of a.questions) {
    let dist = "-";
    if (q.options) {
      dist = Object.keys(q.options).map(k =>
        `<span class="hint">${k}:${q.options[k]}</span>`).join(" ");
    }
    if (q.elective) { // 选做题(版式 v3):统计口径为实际选做人数
      dist = `<span class="hint">选做 ${q.chosen || 0} 人</span>`;
    }
    const diff = q.difficulty != null ? (q.difficulty * 100).toFixed(0) + "%" : "-";
    let cmpCells = "";
    if (cmp) {
      const cr = pcq[cmp] ? pcq[cmp][q.index - 1] : -1;
      const crTxt = cr >= 0 ? pct(cr) : "-";
      let dTxt = "-", dCls = "";
      if (cr >= 0 && q.difficulty != null) {
        const d = cr - q.difficulty;
        dTxt = (d >= 0 ? "+" : "") + (d * 100).toFixed(1) + "pp";
        dCls = d >= 0.02 ? "color:var(--brand)" : d <= -0.02 ? "color:var(--bad)" : "";
      }
      cmpCells = `<td>${crTxt}</td><td style="${dCls}">${dTxt}</td>`;
    }
    html += `<tr><td>${q.index}</td><td>${q.label || q.kind}</td><td>${q.max}</td>
      <td>${diff}</td>${cmpCells}<td>${f1(q.discrimination)}</td><td>${dist}</td></tr>`;
    if (q.parts) { // 版式 v3:小问拆分的逐问明细
      html += `<tr><td></td><td colspan="${cmp ? 7 : 5}" class="hint">小问:` +
        q.parts.map(p => `${p.label || "(" + p.index + ")"} 均分 ${f1(p.mean)}/${p.max}(得分率 ${pct(p.rate)},已阅 ${p.graded})`).join(" · ") +
        `</td></tr>`;
    }
  }
  html += `</table><p class="hint">难度=得分率(越接近 100% 越易);区分度=高分组率−低分组率(<0.2 区分度偏低);差值=班级得分率−全体得分率(pp=百分点)。</p></div>`;

  // 知识点掌握度(CE 轨道 G2:建考录入标签 → 班级掌握雷达)
  html += `<div class="panel"><b>知识点掌握度</b> <span class="hint">掌握度 = 该知识点下所有题目的分值加权得分率;掌握度低的排前面。</span>
    <div id="knowBody" style="margin-top:10px"></div></div>`;

  // 错题重练卡(按学生):后端 /exams/{id}/practice?student=N 出重组版式,交 /api/v1/cards 渲染打印
  html += `<div class="panel"><b>错题重练卡</b> <span class="hint">按学生抽取其错题/丢分题,重组成一张可打印的新答题卡(保留题型/分值/知识点),打印作答后可走正常扫描判读。</span>
    <div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <select id="pracStu"></select>
      <button class="primary" onclick="makePracticeStaff('${id}')">生成练习卡</button>
      <span class="hint" id="pracMsg"></span>
    </div></div>`;

  // 知识点标签编辑(仅可编辑者)
  if (d.canEditKey) {
    html += `<div class="panel"><b>知识点标签</b> <span class="hint">为逐题录入知识点(多个用 , 或 、 分隔),保存后可出掌握度雷达。</span>
      <div id="knowEdit" style="margin-top:10px"></div></div>`;
  }

  // 客观题答案修正
  if (d.canEditKey) {
    html += `<div class="panel"><b>客观题参考答案</b> <span class="hint">录错答案键可在此修正,保存后全班客观分自动重统。</span>
      <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px">`;
    (d.key || []).forEach((k, i) => {
      html += `<label class="hint">${i + 1}<input class="keyinput" id="key_${i}" value="${k}"></label>`;
    });
    html += `</div><button class="primary" style="margin-top:12px" onclick="saveKey('${id}',${(d.key || []).length})">保存并重统</button>
      <span class="hint" id="keyMsg" style="margin-left:10px"></span></div>`;
  }

  // 等级赋分
  html += `<div class="panel"><b>新高考等级赋分换算</b>
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="ghost" onclick="convert('${id}',false)">五等(3+1+2)</button>
      <button class="ghost" onclick="convert('${id}',true)">21 级细分档</button>
    </div>
    <div id="convBody" style="margin-top:12px"></div></div>`;

  // 审计日志:智学网式手风琴——标题栏一行常驻(默认收起),展开时才拉明细
  if (OG.is("admin", "leader")) {
    html += `<div class="panel">
      <div class="acc-head" onclick="toggleAudit('${id}')">
        <span class="acc-arrow" id="auditArrow">▸</span><b>操作审计</b>
        <span class="hint" id="auditCount">改答案 / 改分 / 发布 / 指派留痕,点击展开</span>
      </div>
      <div id="auditBody" style="margin-top:8px" hidden></div></div>`;
  }

  // 补录与缺考:漏扫/答题卡作废的补救语义
  html += `<div class="panel"><b>补录与缺考</b> <span class="hint">漏扫、答题卡作废的学生在此补救:按考号手工补录(卷号续排),缺考不计入统计与排名。</span>
    <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      考号 <input id="manualReg" placeholder="如 00000006" style="width:110px">
      <label class="hint"><input type="checkbox" id="manualAbsent"> 登记为缺考</label>
      客观题作答 <input id="manualAns" placeholder="如 A,B,AB,C(可留空)" style="width:190px">
      <button class="primary" onclick="submitManual('${id}')">补录</button>
      <span class="hint" id="manualMsg"></span>
    </div>
    <div style="margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      已扫卷标记缺考 · <select id="absentIdx"><option value="">选择学生…</option></select>
      <button class="ghost" onclick="markAbsent('${id}')">标记缺考</button>
      <span class="hint">列表按「卷号 · 考号 · 分数」排列,不必再手抄卷号</span>
    </div>
    <div id="absentBox" style="margin-top:10px"></div></div>`;

  document.getElementById("repBody").innerHTML = html;
  drawSegments(a.stats ? a.stats.segments : []);
  renderKnowledge(id, a);
  renderPracticeStudents(id);
  renderAbsent(id, d);
  auditLoadedFor = ""; // 切换考试:重置审计懒加载缓存
}

function renderKnowledge(id, a) {

  if (!box) return;

  if (!ks.length) {
    box.innerHTML = `<p class="hint">本场尚未录入知识点标签。在下方「知识点标签」为逐题填写后即可出掌握度雷达。</p>`;
  } else {
    let html = `<canvas id="knowChart" width="820" height="${Math.max(120, ks.length * 30 + 30)}"></canvas>
      <table style="margin-top:10px"><tr><th>知识点</th><th>题数</th><th>掌握度</th><th>涉及总分</th><th>实际得分</th></tr>`;
    for (const k of ks) {
      html += `<tr><td>${k.name}</td><td>${k.questions}</td>
        <td><span class="bar"><div style="width:${Math.round(k.rate * 100)}%;background:${k.rate < 0.5 ? 'var(--bad)' : k.rate < 0.75 ? 'var(--warn)' : 'var(--brand)'}"></div></span> ${pct(k.rate)}</td>
        <td>${f1(k.max)}</td><td>${f1(k.earned)}</td></tr>`;
    }
    html += `</table>`;

        <button class="primary" style="margin-top:12px" onclick="saveKnowledge('${id}')">保存知识点</button>
        <span class="hint" id="knowMsg" style="margin-left:10px"></span>`;
    });

}
function drawKnowledge(ks) {
  const cv = document.getElementById("knowChart");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height, padL = 130, padR = 60, rowH = 30;
  ctx.clearRect(0, 0, W, H);
  ctx.font = "12px sans-serif";
  ks.forEach((k, i) => {
    const y = 14 + i * rowH;
    ctx.fillStyle = "#1c2430"; ctx.textAlign = "right";
    ctx.fillText(k.name.length > 12 ? k.name.slice(0, 12) + "…" : k.name, padL - 8, y + 12);
    const barW = W - padL - padR;
    ctx.fillStyle = "#eef2f6"; ctx.fillRect(padL, y, barW, 16);
    ctx.fillStyle = k.rate < 0.5 ? "#e34d59" : k.rate < 0.75 ? "#ff8c00" : "#00b389";
    ctx.fillRect(padL, y, barW * Math.max(0, Math.min(1, k.rate)), 16);
    ctx.fillStyle = "#1c2430"; ctx.textAlign = "left";
    ctx.fillText((k.rate * 100).toFixed(0) + "%", padL + barW + 8, y + 12);
  });
}

/* 原生 canvas 画分数段柱状图(零依赖) */
function drawSegments(segs) {
  const cv = document.getElementById("segChart");
  if (!cv || !segs) return;
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height, pad = 26, base = H - 24;
  ctx.clearRect(0, 0, W, H);
  const maxC = Math.max(1, ...segs.map(s => s.count));
  const bw = (W - 2 * pad) / segs.length;
  ctx.font = "11px sans-serif";
  segs.forEach((s, i) => {
    const h = (base - 16) * (s.count / maxC);
    const x = pad + i * bw + bw * 0.15, w = bw * 0.7;
    ctx.fillStyle = s.count ? "#00b389" : "#eef2f6";
    ctx.fillRect(x, base - h, w, h);
    ctx.fillStyle = "#1c2430";
    ctx.textAlign = "center";
    if (s.count) ctx.fillText(s.count, x + w / 2, base - h - 3);
    ctx.fillStyle = "#8a94a3";
    ctx.fillText(`${s.low.toFixed(0)}-${s.high.toFixed(0)}`, x + w / 2, base + 14);
  });
  ctx.strokeStyle = "#e8ecf0";
  ctx.beginPath(); ctx.moveTo(pad, base); ctx.lineTo(W - pad, base); ctx.stroke();
}
