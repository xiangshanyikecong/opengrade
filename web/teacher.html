/* —— 纵向趋势(跨考试按考号对齐) —— */
let trendData = null;

async function loadTrendInit() {
  const subjects = [...new Set(exams.map(e => e.subject).filter(Boolean))];
  document.getElementById("tab-trends").innerHTML = `<div class="panel">
    班级 <select id="trendClass" onchange="loadTrend()"></select>
    学科 <select id="trendSubject" onchange="loadTrend()">
      <option value="">全部学科</option>${subjects.map(s => `<option>${s}</option>`).join("")}
    </select>
    <span class="hint" style="margin-left:10px">跨考试按考号对齐;不同学科/满分混排时得分率与名次无可比性,建议按学科筛选。</span>
  </div><div id="trendBody"></div>`;
  await loadTrend();
}

async function loadTrend() {
  const cls = document.getElementById("trendClass").value;
  const subj = document.getElementById("trendSubject").value;
  const q = new URLSearchParams();
  if (cls) q.set("class", cls);
  if (subj) q.set("subject", subj);
  trendData = await OG.jget("/api/v1/trends" + (q.toString() ? "?" + q.toString() : ""));
  const sel = document.getElementById("trendClass"), cur = sel.value;
  sel.innerHTML = `<option value="">全部班级</option>` +
    (trendData.classes || []).map(c => `<option ${c === cur ? "selected" : ""}>${c}</option>`).join("");
  renderTrend();
}

function renderTrend() {
  const box = document.getElementById("trendBody");
  const t = trendData;
  if (!(t.exams || []).length) { box.innerHTML = `<div class="panel hint">没有符合条件的考试</div>`; return; }
  const labels = t.exams.map(e => e.date.slice(5) + (t.subject ? "" : "·" + (e.subject || "无")));
  const hasClass = !!t.class;
  let html = `<div class="panel"><b>${hasClass ? t.class + " · " : ""}均分走势</b><br>
    <canvas id="classTrendCv" width="860" height="240"></canvas></div>`;
  html += `<div class="panel"><b>考试序列</b>
    <table><tr><th>#</th><th>日期</th><th>学科</th><th>实考</th><th>满分</th><th>全体均分</th>${hasClass ? "<th>本班均分</th><th>本班人数</th>" : ""}</tr>`;
  t.exams.forEach((e, i) => {
    html += `<tr><td>${i + 1}</td><td>${e.date}</td><td>${e.subject || "-"}</td><td>${e.students}</td>
      <td>${f1(e.total)}</td><td>${f1(e.mean)}</td>
      ${hasClass ? `<td><b>${f1(e.classMean)}</b></td><td>${e.classCount}</td>` : ""}</tr>`;
  });
  html += `</table></div>`;

  // 学生跨考对齐表:最近得分/名次与进退步;点击行画个人曲线
  html += `<div class="panel"><b>学生名次进退</b>
    <table><tr><th>考号</th><th>姓名</th><th>班级</th><th>场数</th><th>最近得分</th><th>最近名次</th><th>名次进退</th><th></th></tr>`;
  for (const s of t.students) {
    const pts = s.points.filter(p => !p.absent);
    const last = pts[pts.length - 1], prev = pts[pts.length - 2];
    let delta = "-";
    if (last && prev && last.rank && prev.rank) {
      const d = prev.rank - last.rank;
      delta = d === 0 ? "—" : d > 0 ? `<b style="color:var(--brand)">↑${d}</b>` : `<b style="color:var(--bad)">↓${-d}</b>`;
    }
    html += `<tr><td>${s.reg}</td><td>${s.name || "-"}</td><td>${s.class || "-"}</td><td>${pts.length}</td>
      <td>${last ? f1(last.score) : "-"}</td><td>${last && last.rank ? last.rank : "-"}</td><td>${delta}</td>
      <td><a href="#" onclick="drawStudentTrend('${s.reg}');return false">曲线</a></td></tr>`;
  }
  html += `</table><canvas id="studentTrendCv" width="860" height="240" style="margin-top:12px"></canvas>
    <p class="hint" id="studentTrendTip">点「曲线」查看个人历次得分率与班级对照。</p></div>`;
  box.innerHTML = html;

  const series = [];
  if (hasClass) {
    series.push({ name: "本班均分", color: "#00b389", values: t.exams.map(e => e.classMean) });
    series.push({ name: "全体均分", color: "#9aa7b6", values: t.exams.map(e => e.mean) });
  } else {
    series.push({ name: "均分", color: "#00b389", values: t.exams.map(e => e.mean) });
  }
  OG.chartLine(document.getElementById("classTrendCv"), labels, series, v => f1(v));
}

function drawStudentTrend(reg) {
  const t = trendData;
  const s = (t.students || []).find(x => x.reg === reg);
  if (!s) return;
  const labels = t.exams.map(e => e.date.slice(5) + (t.subject ? "" : "·" + (e.subject || "无")));
  const byId = {};
  for (const p of s.points) byId[p.examId] = p;
  const mine = t.exams.map(e => { const p = byId[e.id]; return p && !p.absent ? Math.round(p.rate * 1000) / 10 : null; });
  const clsRate = t.exams.map(e => e.total > 0 ? Math.round(e.classMean / e.total * 1000) / 10 : null);
  const cv = document.getElementById("studentTrendCv");
  OG.chartLine(cv, labels, [
    { name: `${s.name || s.reg} 得分率%`, color: "#00b389", values: mine },
    { name: "班级均分率%", color: "#9aa7b6", values: clsRate },
  ], v => v.toFixed(0) + "%");
  document.getElementById("studentTrendTip").textContent =
    `${s.name || s.reg}:共 ${s.points.filter(p => !p.absent).length} 场有效成绩` +
    (s.points.some(p => p.absent) ? ",含缺考场次(图中断点)" : "");
  cv.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* —— 年级总分工表(P1 教务第一张表):同场分组多科汇总 → 总分/排名/总分趋势 —— */
let aggData = null;

async function loadAggregate() {
  // 自取考试列表(C-2):此前直接读全局缓存,而教师默认落在「我的任务」不刷缓存,
  // 首次点开年级总表必是空数组 → 误报"还没有可聚合的考试分组"误导去反复配置分组。
  exams = (await OG.jget("/api/v1/exams")) || [];
  const groups = [...new Set(exams.map(e => e.examGroup).filter(Boolean))];
  const box = document.getElementById("tab-group");
  if (!groups.length) {
    box.innerHTML = `<div class="panel"><div class="empty"><div class="pic">🧮</div>还没有可聚合的考试分组。<br>
      <span class="hint">建考或「考试详情 → 考试信息」里给同一次考试的多科填同一个「同场分组」标签(如 2026期中),即可在此聚合出年级总分工表与总分排名。</span></div></div>`;
    return;
  }
  box.innerHTML = `<div class="panel">
    同场分组 <select id="aggGroup" onchange="loadAggData()">${groups.map(g => `<option>${OG.esc(g)}</option>`).join("")}</select>
    <label title="全科缺考/无卷的学生保留行但不进排名池;取消则按 0 分垫底参与排名(旧口径)"><input type="checkbox" id="aggAbsentRank" checked onchange="loadAggData()"> 全科缺考不参与排名</label>
    <button class="ghost" onclick="exportAggCsv()">导出 CSV</button>
    <span class="hint" style="margin-left:10px">一行一名学生:各科得分 + 总分 + 年级/班级排名;「—」= 该生不在该科名册;缺考计 0 分。</span>
  </div><div id="aggBody"></div>`;
  await loadAggData();
}

async function loadAggData() {
  const g = document.getElementById("aggGroup").value;
  const box = document.getElementById("aggBody");
  const q = "group=" + encodeURIComponent(g) + (document.getElementById("aggAbsentRank").checked ? "" : "&absentRank=include");
  box.innerHTML = `<span class="hint">聚合中…</span>`;
  try { aggData = await OG.jget("/api/v1/aggregate?" + q); }
  catch (e) { box.innerHTML = `<div class="panel"><div class="err">${e.message}</div></div>`; return; }
  renderAgg();
}

function renderAgg() {
  const box = document.getElementById("aggBody");
  const t = aggData;
  if (!(t.exams || []).length) { box.innerHTML = `<div class="panel hint">该分组下没有可见考试</div>`; return; }
  // 口径提示:账号不可见分组内的全部科目时,总分/排名只按可见科目计算
  const scopeNote = (t.totalExams || 0) > (t.exams || []).length
    ? `<div class="err" style="margin:6px 0">口径提示:该分组共 ${t.totalExams} 科,你当前可见 ${(t.exams || []).length} 科 —— 总分与排名仅按可见科目计算,请以组长/管理员的完整总表为准。</div>` : "";
  const pendingNote = (t.pendingExams || 0) > 0
    ? `<div class="err" style="margin:6px 0">口径提示:${t.pendingExams} 科尚未发布(未评完/扫描中,已排除出总分排名)或发布后数据有变更 —— 收敛后数字才可作为正式口径。</div>` : "";
  const colHead = t.exams.map((e, i) => `<th title="${OG.esc(e.id)}">${OG.esc(e.subject) || "科" + (i + 1)}<div class="hint">满分 ${+e.total.toFixed(0)} · 均 ${+e.mean.toFixed(1)} · ${e.count} 人</div></th>`).join("");
  let html = `<div class="panel"><b>年级总分工表(${OG.esc(t.group)})</b>${scopeNote}${pendingNote}
    <table style="margin-top:8px"><tr><th>班级</th><th>姓名</th><th>考号</th>${colHead}<th>总分</th><th>年级排名</th><th>班排名</th></tr>`;
  for (const s of t.students) {
    const cells = s.cells.map(c => c.found
      ? (c.absent ? '<span class="hint">缺考</span>' : `<b>${+c.score.toFixed(1)}</b>`)
      : "—").join("</td><td>");
    html += `<tr><td>${OG.esc(s.class || "-")}</td><td>${OG.esc(s.name || "-")}</td><td class="hint">${OG.esc(s.reg)}</td><td>${cells}</td>
      <td><b>${+s.total.toFixed(1)}</b></td><td>${s.rank ? s.rank : '<span class="hint">未参与</span>'}</td><td>${s.classRank || "-"}</td></tr>`;
  }
  html += `</table></div>`;

  // 总分趋势:各科列随日期排序,画年级均分/总分走势(单科均分 + 均分总和)
  const means = t.exams.map(e => +e.mean.toFixed(1));
  const cv = `<div class="panel"><b>各科均分走势(按考试日期)</b><br>
    <canvas id="aggTrendCv" width="860" height="240"></canvas>
    <p class="hint">总分工表建立后,同一学生跨多科的「总分曲线」即可在学生趋势中纵向比较。</p></div>`;
  box.innerHTML = html + cv;
  OG.chartLine(document.getElementById("aggTrendCv"),
    t.exams.map(e => e.date.slice(5) + "·" + (e.subject || "?")),
    [{ name: "均分(各科)", color: "#00b389", values: means }], v => v.toFixed(0));
}

// 导出 CSV(前端拼装,与本表一致;Excel 直接打开)
function exportAggCsv() {
  if (!aggData) return;
  // CSV 单元格:引号包裹 + 双写引号;首字符为 = + - @ 制表/回车时前置单引号,
  // 阻断公式注入(姓名/班级填成 =cmd|... 会在 Excel/WPS 打开时被执行)。
  const esc = v => {
    let s = String(v == null ? "" : v).replace(/"/g, '""');
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return `"${s}"`;
  };
  const head = ["班级", "姓名", "考号", ...aggData.exams.map(e => e.subject || e.id), "总分", "年级排名", "班排名"];
  const lines = [head.map(esc).join(",")];
  for (const s of aggData.students) {
    const cells = s.cells.map(c => c.found ? (c.absent ? "缺考" : c.score.toFixed(1)) : "");
    lines.push([s.class, s.name, s.reg, ...cells, s.total.toFixed(1), s.rank || "未参与", s.classRank || ""].map(esc).join(","));
  }
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `年级总表-${String(aggData.group || "").replace(/[\\/:*?"<>|]/g, "_")}.csv`;
  a.click();
}
