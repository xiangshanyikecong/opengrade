<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教师工作台 · OpenGrade</title>
<link rel="stylesheet" href="/common.css">
<style>
  * { box-sizing:border-box; }
  body { font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:12px 24px; background:#fff; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; }
  header .u { font-size:13px; color:#66707d; }
  nav.tabs { display:flex; gap:4px; padding:0 24px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav.tabs button { border:0; background:none; padding:11px 16px; font-size:14px; cursor:pointer; color:#66707d; border-bottom:2px solid transparent; }
  nav.tabs button.active { color:var(--brand); border-bottom-color:var(--brand); font-weight:600; }
  main { max-width:1180px; margin:0 auto; padding:20px 24px; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:18px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; }
  a { color:var(--brand); text-decoration:none; }
  a.danger { color:var(--bad); }
  select, input { padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:13px; }
  button.primary { padding:9px 14px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-size:13px; cursor:pointer; }
  button.ghost { padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:13px; cursor:pointer; }
  .hint { font-size:12px; color:#8a94a3; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:10px; margin-bottom:14px; }
  .card { background:#f8fafc; border:1px solid var(--line); border-radius:9px; padding:10px 12px; }
  .card b { display:block; font-size:21px; line-height:1.3; }
  .card span { font-size:12px; color:#66707d; }
  .bar { height:8px; background:#eef2f6; border-radius:4px; overflow:hidden; width:130px; display:inline-block; vertical-align:middle; }
  .bar > div { height:100%; background:var(--brand); }
  .bad > div { background:#c2410c; }
  .pill { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; }
  .pill.on { background:#e7f5ef; color:var(--brand); }
  .pill.off { background:#fdece8; color:var(--bad); }
  canvas { max-width:100%; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:820px){ .grid2 { grid-template-columns:1fr; } }
  .keyinput { width:52px; text-align:center; }
  .acc-head { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; padding:2px 0; }
  .acc-head:hover { opacity:.75; }
  .acc-arrow { display:inline-block; width:12px; color:#66707d; transition:transform .15s; }
  .room { border:1px solid var(--line); border-radius:8px; padding:10px; margin:10px 0; }
  .room-head { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
  .seats { display:grid; grid-template-columns:repeat(auto-fill, minmax(92px,1fr)); gap:6px; }
  .seat { border:1px solid var(--line); border-radius:6px; padding:4px; font-size:12px; cursor:pointer; min-height:56px; }
  .seat.empty { opacity:.45; }
  .seat.sel { outline:2px solid var(--brand); }
  @media print {
    .sidebar, .topbar, .no-print { display:none !important; }
    .main-area { margin-left:0 !important; }
    .seat { break-inside:avoid; }
    .room { break-inside:avoid; }
  }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo"><span class="mark">开</span><span>开元智阅</span></div>
  <div class="user"><span class="avatar" id="sideAvatar">·</span><span class="name" id="sideUserName">…</span></div>
  <nav class="nav" id="tabs"></nav>
  <div class="side-foot"><button onclick="toggleSide()"><span>⇤</span><span class="txt"> 收起侧栏</span></button></div>
</aside>
<div class="main-area">
  <div class="topbar">
    <h1 id="pageTitle">考试</h1>
    <span style="flex:1"></span>
    <span class="hint" id="ogUser"></span>
    <a href="/">设计器</a> · <a href="/admin.html" id="adminLink" hidden>用户管理</a>
  </div>
  <div class="content">
    <div id="tab-exams"></div>
  <div id="tab-create" hidden></div>
    <div id="tab-bank" hidden></div>
    <div id="tab-tasks" hidden></div>
    <div id="tab-exam" hidden></div>
    <div id="tab-assign" hidden></div>
    <div id="tab-reports" hidden></div>
    <div id="tab-trends" hidden></div>
    <div id="tab-rooms" hidden></div>
    <div id="tab-me" hidden></div>
  </div>
</div>

<script src="/common.js"></script>
<script>
let exams = [];

// 侧栏手风琴分组(智学网式):低频分组默认收起
const NAV_GROUPS = [
  { name: "考试", ico: "📋", open: true, items: [["exams", "考试列表"], ["create", "新建考试"], ["rooms", "考场编排"]] },
  { name: "阅卷", ico: "✍️", open: true, items: [["tasks", "我的任务"], ["assign", "任务分配"]] },
  { name: "学情", ico: "📈", open: true, items: [["reports", "学情分析"], ["trends", "纵向趋势"]] },
  { name: "资源", ico: "📚", open: false, items: [["bank", "校本题库"]] },
  { name: "账号", ico: "👤", open: false, items: [["me", "账号设置"]] },
];
const PAGE_TITLES = { exams: "考试列表", create: "新建考试", rooms: "考场编排", tasks: "我的任务", exam: "考试详情", assign: "任务分配", reports: "学情分析", trends: "纵向趋势", bank: "校本题库", me: "账号设置" };

async function main() {
  if (!await OG.init()) return;
  if (OG.is("admin")) document.getElementById("adminLink").hidden = false;
  const me = OG.me || {};
  const av = document.getElementById("sideAvatar");
  if (av && me.displayName) av.textContent = me.displayName.trim().charAt(0) || "·";
  const un = document.getElementById("sideUserName");
  if (un) un.textContent = me.displayName || me.username || "";
  const groups = NAV_GROUPS
    .map(g => ({ ...g, items: g.items.filter(([id]) => id !== "assign" || OG.is("admin", "leader")) }))
    .filter(g => g.items.length);
  document.getElementById("tabs").innerHTML = groups.map((g, gi) => `
    <div class="nav-group ${g.open ? 'open' : ''}" data-g="${gi}">
      <div class="nav-head" onclick="this.parentNode.classList.toggle('open')">
        <span class="ico">${g.ico}</span><span class="txt">${g.name}</span><span class="arr">▾</span>
      </div>
      <div class="nav-sub">${g.items.map(([id, name]) =>
        `<button data-t="${id}" onclick="showTab('${id}')">${name}</button>`).join("")}</div>
    </div>`).join("");
  // 常规流程:教师登录落到「我的任务」(任务视角进入阅卷);管理端落考试列表
  showTab(OG.is("admin", "leader") ? "exams" : "tasks");
}

function toggleSide() { document.body.classList.toggle("side-collapsed"); }

function showTab(id) {
  document.querySelectorAll("#tabs .nav-sub button").forEach(b => b.classList.toggle("active", b.dataset.t === id));
  ["exams", "create", "bank", "tasks", "exam", "assign", "reports", "trends", "rooms", "me"].forEach(t => document.getElementById(tab_(t)).hidden = t !== id);
  const title = document.getElementById("pageTitle");
  if (title) title.textContent = PAGE_TITLES[id] || "考试";
  // 激活的子项若在收起分组里,自动展开该分组
  const btn = document.querySelector(`#tabs .nav-sub button[data-t="${id}"]`);
  if (btn) btn.closest(".nav-group").classList.add("open");
  if (id === "exams") loadExams();
  if (id === "create") loadCreate();
  if (id === "bank") loadBank();
  if (id === "tasks") loadMyTasks();
  if (id === "assign") loadAssign();
  if (id === "reports") loadReports();
  if (id === "trends") loadTrendInit();
  if (id === "rooms") loadRooms();
  if (id === "me") renderMe();
}
function tab_(t) { return "tab-" + t; }

/* —— 考场编排(走班排考):生成 → 座位对调/监考指派 → 打印 —— */
let roomsExam = "", roomsPlan = null, swapSel = null, roomsStaff = [];

async function loadRooms() {
  exams = (await OG.jget("/api/v1/exams")) || [];
  const box = document.getElementById("tab-rooms");
  box.innerHTML = `<div class="panel">
    <div class="group-title">考场编排(按名册分场,生成后可微调并打印)</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center" class="no-print">
      <label>考试 <select id="roomsExamSel" onchange="roomsPick()">
        <option value="">选择考试…</option>
        ${exams.map(e => `<option value="${e.id}" ${roomsExam === e.id ? 'selected' : ''}>${e.id}(${e.createdAt}${e.subject ? '·' + e.subject : ''})</option>`).join("")}
      </select></label>
      <label>每场人数 <input id="roomsSize" type="number" value="30" min="5" max="200" style="width:64px"></label>
      <label>编排 <select id="roomsGroup"><option value="class">同班聚齐(按主班)</option><option value="reg">纯考号序</option></select></label>
      <button class="primary" onclick="genRooms()">生成分场</button>
      <button class="secondary" onclick="window.print()">打印座位表</button>
    </div>
    <p class="hint no-print">同班聚齐按名册主班排序装场(走班名册把教学班放 Classes 首位即可按教学班聚齐);生成后点击两个座位可对调,每场可下拉指派监考。</p>
    <div id="roomsArea"><p class="hint">选择考试后生成,或查看已保存的编排。</p></div>
  </div>`;
  if (roomsExam) fetchRooms();
}

async function roomsPick() {
  roomsExam = document.getElementById("roomsExamSel").value;
  swapSel = null;
  if (roomsExam) fetchRooms();
  else roomsPlan = null;
}

async function fetchRooms() {
  try {
    const [plan, detail] = await Promise.all([
      OG.jget(`/api/v1/exams/${roomsExam}/rooms`),
      OG.jget(`/api/v1/exams/${roomsExam}`),
    ]);
    roomsStaff = (detail.staff || []);
    roomsPlan = plan && plan.rooms ? plan : null;
  } catch (e) { roomsPlan = null; }
  renderRooms();
}

async function genRooms() {
  if (!roomsExam) { alert("先选择考试"); return; }
  const size = +document.getElementById("roomsSize").value || 30;
  const group = document.getElementById("roomsGroup").value;
  try {
    roomsPlan = await OG.jpost(`/api/v1/exams/${roomsExam}/rooms`, { size, group });
    swapSel = null;
    renderRooms();
  } catch (e) { alert(e.message); }
}

function renderRooms() {
  const area = document.getElementById("roomsArea");
  if (!area) return;
  if (!roomsPlan || !roomsPlan.rooms) { area.innerHTML = `<p class="hint">尚未生成编排。</p>`; return; }
  let html = "";
  for (const room of roomsPlan.rooms) {
    const seats = room.seats.map(s => {
      const selMark = swapSel && swapSel.room === room.name && swapSel.idx === s.idx;
      const body = s.reg
        ? `<div>${s.name}</div><div class="hint">${s.reg}</div><div class="hint">${s.class || ""}</div>`
        : `<div class="hint">空座</div>`;
      return `<div class="seat ${s.reg ? '' : 'empty'} ${selMark ? 'sel' : ''}" onclick="seatClick('${room.name}',${s.idx})"><b>${s.idx}</b>${body}</div>`;
    }).join("");
    const proctors = `<select class="no-print" onchange="setProctor('${room.name}', this.value)">
        <option value="">监考…</option>
        ${roomsStaff.map(t => `<option value="${t.username}" ${room.proctor === t.username ? 'selected' : ''}>${t.displayName || t.username}</option>`).join("")}
      </select>`;
    html += `<div class="room">
      <div class="room-head"><b>${room.name}</b><span class="hint">${room.seats.filter(s => s.reg).length} 人 · 监考:${room.proctor || "未指派"}</span>${proctors}</div>
      <div class="seats">${seats}</div></div>`;
  }
  area.innerHTML = html;
}

async function seatClick(room, idx) {
  if (!roomsPlan) return;
  if (!swapSel) { swapSel = { room, idx }; renderRooms(); return; }
  const a = swapSel;
  swapSel = null;
  if (a.room === room && a.idx === idx) { renderRooms(); return; }
  try {
    roomsPlan = await OG.jpost(`/api/v1/exams/${roomsExam}/rooms`, { swap: { a, b: { room, idx } } }, "PATCH");
  } catch (e) { alert(e.message); }
  renderRooms();
}

async function setProctor(room, teacher) {
  try {
    roomsPlan = await OG.jpost(`/api/v1/exams/${roomsExam}/rooms`, { proctor: { room, teacher } }, "PATCH");
    renderRooms();
  } catch (e) { alert(e.message); }
}

/* —— 考试列表 —— */
// 阶段徽标配色:常规流程状态机(待扫描/扫描中/异常/阅卷中/待发布/已发布)
const STAGE_CLASS = {
  awaiting_scan: "off", scanning: "run", anomalies: "warn", grading: "run", ready: "on", published: "pub",
};
function stagePill(e) {
  const cls = STAGE_CLASS[e.stage] || "off";
  return `<span class="pill ${cls}" title="${e.expected ? `应扫 ${e.expected} · ` : ""}未评 ${e.ungraded}/${e.total}${e.warnings ? ` · 异常 ${e.warnings}` : ""}">${e.stageLabel || (e.published ? "已发布" : "未发布")}</span>`;
}

async function loadExams() {
  exams = await OG.jget("/api/v1/exams");
  const box = document.getElementById("tab-exams");
  let html = `<div class="panel">
    <div style="display:flex;align-items:center;margin-bottom:10px">
      <b>考试列表</b><span class="hint" style="margin-left:10px">共 ${exams.length} 场 · 点考试号进入详情(扫描/异常/进度/发布)</span>
      <span style="flex:1"></span>
      <button class="primary" onclick="showTab('create')">+ 新建考试</button>
    </div>
    <table><tr><th>考试</th><th>时间</th><th>建卷人</th><th>学科</th><th>卷数</th><th>题型</th><th>状态</th><th>操作</th></tr>`;
  for (const e of exams) {
    // 主操作随阶段推进:待扫描→去扫描;扫描中→续传;异常→去处理;阅卷中→阅卷;待发布→发布;已发布→成绩册
    let primary;
    if (e.stage === "awaiting_scan" || e.stage === "scanning") primary = `<a href="#" onclick="openExam('${e.id}');return false"><b>去扫描</b></a>`;
    else if (e.stage === "anomalies") primary = `<a href="#" onclick="openExam('${e.id}');return false"><b>处理异常</b></a>`;
    else if (e.stage === "grading") primary = `<a href="/grader.html?exam=${e.id}"><b>阅卷</b></a>`;
    else if (e.stage === "ready") primary = `<a href="#" onclick="pubExam('${e.id}',true).then(loadExams);return false"><b>发布成绩</b></a>`;
    else primary = `<a href="/api/v1/exams/${e.id}/export.xlsx"><b>成绩册</b></a>`;
    html += `<tr><td><a href="#" onclick="openExam('${e.id}');return false" title="打开考试详情">${e.id}</a></td><td>${e.createdAt}</td><td>${e.createdBy || "-"}</td>
      <td>${e.subject || "-"}</td><td>${e.students}${e.expected ? "/" + e.expected : ""}</td><td>客观 ${e.objective} + 主观 ${e.subjective}</td>
      <td>${stagePill(e)}</td>
      <td style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        ${primary}
        <a href="/api/v1/exams/${e.id}/export.xlsx">成绩册</a>
        <details class="more"><summary>更多</summary><div class="menu">
          <a href="#" onclick="openExam('${e.id}');return false">考试详情(扫描/异常/进度)</a>
          <a href="#" onclick="pubExam('${e.id}',${!e.published}).then(loadExams);return false">${e.published ? '撤回发布' : '发布成绩'}</a>
          <a href="/api/v1/exams/${e.id}/review.pptx">讲评课件</a>
          <a href="/api/v1/exams/${e.id}/export.zip">数据包</a>
          ${OG.is("admin", "leader") ? `<a href="#" class="danger" onclick="delExam('${e.id}');return false">删除</a>` : ""}
        </div></details>
      </td></tr>`;
  }
  html += "</table>";
  if (!exams.length) html = `<div class="empty"><div class="pic">🗂️</div>当前暂无考试~ 点右上「+ 新建考试」开始:建考(建档)→ 发卡 → 考后回详情传扫描件</div>`;
  box.innerHTML = exams.length ? html + "</div>" : `<div class="panel">${html}</div>`;
}

/* —— 考试详情枢纽(常规流程的"考试工作台"):扫描会话 → 异常裁决 → 进度 → 发布 —— */
let hubExam = null; // 当前详情数据缓存(动作完成后局部刷新)

async function openExam(id) {
  showTab("exam");
  const box = document.getElementById("tab-exam");
  box.innerHTML = `<div class="panel">加载考试 ${id} …</div>`;
  let d;
  try { d = await OG.jget(`/api/v1/exams/${id}`); }
  catch (e) { box.innerHTML = `<div class="panel"><div class="err">${e.message}</div></div>`; return; }
  hubExam = d;
  renderExamHub(d);
}

function hubStatNum(label, val, tone) {
  return `<div style="flex:1;min-width:96px;background:var(--bg);border-radius:10px;padding:10px 14px">
    <div style="font-size:12px;color:#8a94a3">${label}</div>
    <div style="font-size:22px;font-weight:700;${tone ? `color:${tone}` : ""}">${val}</div></div>`;
}

function renderExamHub(d) {
  const box = document.getElementById("tab-exam");
  const st = d.stage || {};
  const canEdit = !!d.canEdit || OG.is("admin", "leader");
  const objN = (d.objective || []).length;
  // 缺扫名单:名册里有、没扫到卷、也没登记缺考/补录的考号
  const missing = (d.roster || []).filter(st_ => !d.scannedReg[st_.reg] && !(d.absent || []).some(a => a.reg === st_.reg));
  const warnOpen = (d.warnings || []).filter(w => !w.resolved);
  const warnDone = (d.warnings || []).filter(w => w.resolved);

  let html = `<div class="panel">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <a href="#" onclick="showTab('exams');return false">← 考试列表</a>
      <b style="font-size:16px">考试 ${d.id}</b>
      ${stagePill({ stage: st.stage, stageLabel: st.label, expected: st.expected, ungraded: st.ungraded, total: st.total, warnings: st.warnings })}
      <span class="hint">${d.createdAt} · 建卷 ${d.createdBy || "-"}${d.subject ? " · " + d.subject : ""}</span>
      <span style="flex:1"></span>
      <a href="/grader.html?exam=${d.id}">阅卷工作台 ↗</a>
      ${canEdit ? `<a href="#" onclick="pubExam('${d.id}',${!d.published}).then(()=>openExam('${d.id}')).then(loadExams);return false">${d.published ? "撤回发布" : "发布成绩"}</a>` : ""}
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      ${hubStatNum("已扫 / 应扫", `${st.students}${st.expected ? "/" + st.expected : ""}`)}
      ${hubStatNum("未评切片", st.ungraded + "/" + st.total, st.ungraded ? "#3b62d9" : "")}
      ${hubStatNum("异常待裁决", warnOpen.length, warnOpen.length ? "var(--bad)" : "")}
      ${hubStatNum("缺考", st.absent)}
      ${hubStatNum("手工补录", st.manual)}
      ${hubStatNum("⚑ 待复核", (d.flagged || []).length, (d.flagged || []).length ? "var(--warn)" : "")}
    </div>`;

  // —— ① 扫描会话:批量上传 + 内联反馈(常规流程:建考后在这里续传整批) ——
  html += `<div class="group-title" style="margin-top:16px">① 扫描上传(多页版式按份连续上传全部页)</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input type="file" id="hubScanFiles" multiple accept="image/png,image/jpeg" style="max-width:340px">
      <button class="primary" onclick="hubUpload('${d.id}')">上传本批扫描件</button>
      <span class="hint">${st.expected && st.students < st.expected ? `名册 ${st.expected} 人,还差 ${st.expected - st.students} 份` : "已扫齐或名册未提供"}</span>
    </div>
    <div id="hubScanMsg" style="margin-top:8px"></div>`;

  // —— ② 缺扫名单:名册有、卷没有 → 提示手工补录/缺考登记 ——
  if (missing.length) {
    html += `<div class="group-title" style="margin-top:14px">缺扫名单(${missing.length} 人 — 漏扫/缺考在此收口)</div>
      <table><tr><th>考号</th><th>姓名</th><th>班级</th><th>处理</th></tr>
      ${missing.map(m => `<tr><td>${m.reg}</td><td>${m.name || "-"}</td><td>${(m.classes || []).join("、") || "-"}</td>
        <td style="display:flex;gap:10px">
          <a href="#" onclick="hubManual('${d.id}','${m.reg}');return false">手工补录(缺考登记)</a>
        </td></tr>`).join("")}</table>`;
  }

  // —— ③ 异常清单:重答/空白卡/考号异常,逐条裁决(采纳推荐考号/标缺考/去阅卷) ——
  if ((d.warnings || []).length) {
    const warnRow = w => {
      const actions = w.resolved
        ? `<span class="hint">已裁决 ✓</span>`
        : `<a href="#" onclick="hubSuggest('${d.id}',${w.student});return false">推荐考号…</a>
           <a href="#" onclick="hubAbsent('${d.id}',${w.student});return false">标记缺考</a>
           <a href="/grader.html?exam=${d.id}">去阅卷裁决</a>`;
      return `<tr style="${w.resolved ? "opacity:.55" : ""}"><td>${w.student}</td><td>${w.reg || "?"}</td>
        <td>${(w.texts || []).join(";<br>")}</td>
        <td style="display:flex;gap:10px;flex-wrap:wrap">${actions}</td></tr>`;
    };
    html += `<div class="group-title" style="margin-top:14px">③ 异常清单(待裁决 ${warnOpen.length}${warnDone.length ? ` · 已裁决 ${warnDone.length}` : ""})</div>
      <table><tr><th>卷号</th><th>考号</th><th>告警</th><th>处理</th></tr>
      ${warnOpen.map(warnRow).join("")}${warnDone.map(warnRow).join("")}</table>
      <div id="hubSuggestBox" style="margin-top:8px"></div>`;
  }

  // —— ④ ⚑ 待复核队列:阅卷标记的出口 ——
  if ((d.flagged || []).length) {
    html += `<div class="group-title" style="margin-top:14px">⚑ 待复核队列(${d.flagged.length})</div>
      <table><tr><th>题号</th><th>卷号</th><th>考号</th><th>当前分</th><th></th></tr>
      ${d.flagged.map(f => `<tr><td>第 ${objN + f.question} 题</td><td>${f.student}</td><td>${f.reg || "?"}</td><td>${f.score}</td>
        <td><a href="/grader.html?exam=${d.id}&q=${f.question}&student=${f.student}">复核改分 ↗</a></td></tr>`).join("")}</table>`;
  }

  // —— ⑤ 客观题参考答案(可修正,修正后全班重统) ——
  if (objN) {
    const keyArr = d.key || [];
    html += `<div class="group-title" style="margin-top:14px">客观题参考答案${canEdit ? "(修正后全班客观题自动重统)" : ""}</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input id="hubKey" value="${keyArr.join("")}" placeholder="按题序连写,如 ABTTAC…(多选连写 AC;判断 T/F)" style="width:320px;font-family:monospace" ${canEdit ? "" : "disabled"}>
        ${canEdit ? `<button class="ghost" onclick="hubSaveKey('${d.id}')">保存并重统</button>` : ""}
        <span class="hint">空题不判分;共 ${objN} 题</span>
      </div><div id="hubKeyMsg" style="margin-top:6px"></div>`;
  }

  // —— ⑥ 逐题阅卷进度(带阅卷人,一键进入本题) ——
  if ((d.progress || []).length) {
    html += `<div class="group-title" style="margin-top:14px">主观题阅卷进度</div>
      <table><tr><th>题号</th><th>题型</th><th>满分</th><th>阅卷人</th><th>进度</th><th></th></tr>
      ${d.progress.map(p => {
        const pctv = p.total ? Math.round(p.graded * 100 / p.total) : 100;
        return `<tr><td>第 ${objN + p.question} 题</td><td>${p.kind === "fillblank" ? "填空" : "解答"}${p.elective ? "(选做)" : ""}</td><td>${p.max}</td>
          <td>${p.teacher || "-"}</td>
          <td><div class="progress" style="width:120px;display:inline-block;vertical-align:middle"><div style="width:${pctv}%"></div></div> ${p.graded}/${p.total}</td>
          <td><a href="/grader.html?exam=${d.id}&q=${p.question}">阅本题 ↗</a></td></tr>`;
      }).join("")}</table>
      <p class="hint">${OG.is("admin", "leader") ? `分配阅卷人到「<a href="#" onclick="showTab('assign');return false">任务分配</a>」` : "任务由管理员/年级组长分配"}</p>`;
  }

  html += `</div>`;
  box.innerHTML = html;
}

// 扫描上传(详情页内联反馈,替代从前的 alert;multipart 用原生 fetch,不走 JSON 封装)
async function hubUpload(id) {
  const files = [...(document.getElementById("hubScanFiles").files || [])];
  const msg = document.getElementById("hubScanMsg");
  if (!files.length) { msg.innerHTML = `<span class="err">请先选择扫描件</span>`; return; }
  msg.innerHTML = `<span class="hint">上传识别中(${files.length} 张)…</span>`;
  const fd = new FormData();
  for (const f of files) fd.append("images", f);
  let inner;
  try {
    const r = await fetch(`/api/v1/exams/${id}/scans`, { method: "POST", body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "上传失败");
    inner = `✓ 本批入库 ${d.added} 卷,考试现有 ${d.students} 卷。`;
    if ((d.failed || []).length) inner += `<br>失败 ${d.failed.length} 张(未计入):<br>` + d.failed.map(f => `第 ${f.index} 张:${f.error}`).join("<br>");
  } catch (e) { msg.innerHTML = `<span class="err">${e.message}</span>`; return; }
  await openExam(id); await loadExams();
  const m2 = document.getElementById("hubScanMsg");
  if (m2) m2.innerHTML = `<span class="hint">${inner}</span>`;
}

// 推荐考号:逐位判涂 + 名册匹配 → 一键采纳
async function hubSuggest(id, student) {
  const boxEl = document.getElementById("hubSuggestBox");
  boxEl.innerHTML = `<span class="hint">读取推荐…</span>`;
  try {
    const s = await OG.jget(`/api/v1/exams/${id}/suggest/${student}`);
    const regs = (s.suggestions || []).map(x => x.reg);
    let html = `卷 ${student} 当前考号 <b>${s.reg || "?"}</b>(涂位 ${s.regValid ? "有效" : "异常"})`;
    if (regs.length) {
      html += ` ,推荐:` + regs.map(r =>
        `<button class="ghost" style="margin:2px 4px;padding:3px 10px" onclick="hubAdopt('${id}',${student},'${r}')">${r}</button>`).join("");
    } else {
      html += ` ,名册无可信推荐,可人工指派:<input id="hubAdoptReg" placeholder="考号" style="width:110px;padding:3px 8px">` +
        `<button class="ghost" style="margin-left:6px;padding:3px 10px" onclick="hubAdopt('${id}',${student},document.getElementById('hubAdoptReg').value)">指派</button>`;
    }
    boxEl.innerHTML = html;
  } catch (e) { boxEl.innerHTML = `<span class="err">${e.message}</span>`; }
}
async function hubAdopt(id, student, reg) {
  if (!reg) return;
  try {
    await OG.jpost("/api/v1/assign", { examId: id, student, reg });
    await openExam(id); await loadExams();
  } catch (e) { alert(e.message); }
}

// 标记缺考(再点一次恢复)
async function hubAbsent(id, student) {
  try {
    const cur = (hubExam.absent || []).some(a => a.student === student);
    await OG.jpost(`/api/v1/exams/${id}/absent`, { student, absent: !cur });
    await openExam(id); await loadExams();
  } catch (e) { alert(e.message); }
}

// 手工补录(缺扫名单收口:登记缺考卷,卷号续排,客观题可后补)
async function hubManual(id, reg) {
  if (!confirm(`为考号 ${reg} 登记缺考补录?(生成缺考卷占位,统计自动剔除;若实考可稍后改回)`)) return;
  try {
    await OG.jpost(`/api/v1/exams/${id}/manual`, { reg, absent: true });
    await openExam(id); await loadExams();
  } catch (e) { alert(e.message); }
}

// 修正参考答案:整串连写(如 ABTTAC;多选 AC)→ 数组 → /key
async function hubSaveKey(id) {
  const raw = document.getElementById("hubKey").value.trim().toUpperCase();
  const msg = document.getElementById("hubKeyMsg");
  const n = (hubExam.objective || []).length;
  if (!/^[A-F]*$/.test(raw) || raw.length !== n) { msg.innerHTML = `<span class="err">需 ${n} 个字母(判断题用 T/F,多选连写如 AC),当前「${raw}」</span>`; return; }
  try {
    await OG.jpost(`/api/v1/exams/${id}/key`, { key: raw.split("") });
    msg.innerHTML = `<span class="hint">✓ 已保存并重统</span>`;
    await openExam(id); await loadExams();
  } catch (e) { msg.innerHTML = `<span class="err">${e.message}</span>`; }
}

function loadLastLayout() {
  const saved = localStorage.getItem("og.lastLayout");
  const box = document.getElementById("examMsg");
  box.className = "err";
  if (!saved) { box.textContent = "设计器还没有生成过版式:先点「打开设计器出卡」生成一次。"; return; }
  document.getElementById("examLayout").value = saved;
  box.className = "hint";
  box.textContent = "已载入设计器最近生成的版式。";
  renderLayoutMeta();
  // 设计器若已生成过答案(题库带出/手填),一并带出 —— 建考零手填
  const savedKey = localStorage.getItem("og.lastKey");
  if (savedKey) {
    try {
      const arr = JSON.parse(savedKey);
      const cells = [...document.querySelectorAll("#keyGrid input[data-key]")];
      let used = 0;
      arr.forEach((v, i) => { if (cells[i] && v) { cells[i].value = v; used++; } });
      if (used) box.textContent = `已载入设计器最近版式与 ${used} 题参考答案。`;
      keyFilledCount();
    } catch (_) { /* 忽略坏数据 */ }
  }
}

// 从班级选名册:学生账号按班级汇总,勾选即生成 CSV 名册(常规流程"选班级带出名单")

function rosterPickSum() {

// 解析当前版式(失败返回 null 并提示)
function parseLayoutQuiet() {
  try {
    const l = JSON.parse(document.getElementById("examLayout").value);
    if (!l || (!l.questions && !l.subjectives)) throw new Error("版式里没有题目");
    return l;
  } catch (e) {
    const box = document.getElementById("examMsg");
    box.className = "err";
    box.textContent = "版式 JSON 无法解析:" + e.message;
    return null;
  }
}

// 版式摘要:教师不必看懂 JSON,只看人话
function renderLayoutMeta() {
  const l = parseLayoutQuiet();
  if (!l) { document.getElementById("layoutSummary").textContent = ""; return; }
  const qs = l.questions || [], subs = l.subjectives || [];
  const kinds = {};
  for (const q of qs) kinds[q.kind] = (kinds[q.kind] || 0) + 1;
  const kindTxt = Object.entries(kinds).map(([k, n]) => ({ choice: "单选", judge: "判断", multiple: "多选" }[k] || k) + "×" + n).join(" + ") || "无客观题";
  const subTxt = subs.length ? subs.map(s => ({ fillblank: "填空", subjective: "解答" }[s.kind] || s.kind) + `${s.score || ""}分`).join("、") : "无";
  const objScore = qs.reduce((a, q) => a + (+q.score || 1), 0);
  const subScore = subs.reduce((a, s) => {
    const parts = (s.parts || []).reduce((x, p) => x + (+p.score || 0), 0);
    return a + (parts || +s.score || 0);
  }, 0);
  const regTxt = { fill: "填涂", barcode: "条码", qr: "二维码", "fill+barcode": "填涂+条码", "fill+qr": "填涂+二维码" }[l.regMode || "fill"] || l.regMode;
  document.getElementById("layoutSummary").innerHTML =
    `卷头 <b>${(l.title || "未命名").replace(/</g, "&lt;")}</b> · 考号 ${l.regDigits || 0} 位(${regTxt}) · 客观 ${qs.length} 题(${kindTxt},${objScore} 分) · 主观 ${subs.length} 题(${subTxt},${subScore} 分) · 卷面合计 <b>${objScore + subScore} 分</b>`;
  renderKeyGrid();
}

// 答案逐题网格:按版式客观题自动出格子
function renderKeyGrid() {
  const l = parseLayoutQuiet();
  const grid = document.getElementById("keyGrid");
  if (!l) { grid.innerHTML = ""; return; }
  const qs = l.questions || [];
  grid.innerHTML = qs.map((q, i) => {
    const ph = q.kind === "judge" ? "T/F" : q.kind === "multiple" ? "如 AC" : "A~F";
    const tag = q.kind === "judge" ? "判" : q.kind === "multiple" ? "多" : "";
    return `<label style="font-size:12px;color:var(--text2);display:grid;gap:2px">${i + 1}${tag}
      <input data-key="${i}" maxlength="4" placeholder="${ph}" style="padding:6px 4px;text-align:center;font-size:14px" oninput="keyFilledCount()"></label>`;
  }).join("") || `<span class="hint">本版式没有客观题,无需答案。</span>`;
  keyFilledCount();
}
function keyFilledCount() {
  const cells = [...document.querySelectorAll("#keyGrid input[data-key]")];
  const filled = cells.filter(c => c.value.trim()).length;
  document.getElementById("keyFilled").textContent = cells.length ? `已填 ${filled}/${cells.length}` : "";
}
// 一串字母快速填入:ABCDABT... 按题序拆格(判断题吃 T/F,其余每格一个字母)
function quickFillKey() {
  const l = parseLayoutQuiet();
  if (!l) return;
  const raw = (document.getElementById("keyQuick").value || "").toUpperCase().replace(/[^A-FTF]/g, "");
  const qs = l.questions || [];
  const cells = [...document.querySelectorAll("#keyGrid input[data-key]")];
  let pos = 0, used = 0;
  for (let i = 0; i < qs.length && pos < raw.length; i++) {
    if (qs[i].kind === "judge") {
      const ch = raw[pos];
      if (ch === "T" || ch === "F") { cells[i].value = ch; pos++; used++; }
    } else {
      cells[i].value = raw[pos++];
      used++;
    }
  }
  keyFilledCount();
  const box = document.getElementById("examMsg");
  box.className = used ? "hint" : "err";
  box.textContent = used ? `快速填入 ${used} 题(判断题按 T/F 识别)。` : "没有识别到可填入的字母。";
}
// 从题库带出:版式题目携带 bankId 时按 id 匹配参考答案
async function bankFillKey() {
  const l = parseLayoutQuiet();
  if (!l) return;
  const qs = l.questions || [];
  const ids = [...new Set(qs.map(q => q.bankId).filter(Boolean))];
  if (!ids.length) {
    const box = document.getElementById("examMsg");
    box.className = "err";
    box.textContent = "版式里的题不是从题库选的(无题库编号),请手填或用快速填入。";
    return;
  }
  const bank = await (await fetch("/api/v1/bank")).json();
  const byId = Object.fromEntries(bank.map(it => [it.id, it]));
  const cells = [...document.querySelectorAll("#keyGrid input[data-key]")];
  let filled = 0;
  qs.forEach((q, i) => {
    const it = q.bankId && byId[q.bankId];
    if (it && it.answer) { cells[i].value = String(it.answer).toUpperCase(); filled++; }
  });
  keyFilledCount();
  const box = document.getElementById("examMsg");
  box.className = filled ? "hint" : "err";
  box.textContent = filled ? `从题库带出 ${filled} 题答案。` : "题库里没有这些题的参考答案。";
}

async function submitCreateExam() {
  const msg = document.getElementById("examMsg");
  msg.className = "err"; msg.textContent = "";
  try {
    const layout = JSON.parse(document.getElementById("examLayout").value);
    const cells = [...document.querySelectorAll("#keyGrid input[data-key]")];
    const key = cells.map(c => c.value.trim().toUpperCase()); // 允许留空:该题不判分,详情页可后补重统
    const files = document.getElementById("examImages").files; // 可选:不传=先建档,考后到详情续传
    const fd = new FormData();
    fd.append("layout", JSON.stringify(layout));
    fd.append("key", JSON.stringify(key));
    fd.append("threshold", document.getElementById("threshold").value);
    const rosterText = document.getElementById("examRoster").value.trim();
    if (rosterText) fd.append("roster", rosterText);
    const subject = document.getElementById("examSubject").value.trim();
    if (subject) fd.append("subject", subject);
    for (const f of files) fd.append("images", f);
    const r = await fetch("/api/v1/exams", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    msg.className = "hint";
    msg.textContent = `考试 ${j.id} 已创建(${j.stageLabel}):${j.students} 卷,客观 ${j.objectiveCount} 题,主观 ${j.subjectiveCount} 题${j.pages > 1 ? `,版式共 ${j.pages} 页` : ""}。正在打开考试详情…`;
    setTimeout(() => openExam(j.id), 600);
  } catch (e) { msg.textContent = e.message; }
}

/* —— 我的任务(常规流程:教师从任务进入阅卷,不在考试列表里找) —— */
async function loadMyTasks() {
  const box = document.getElementById("tab-tasks");
  let items;
  try { items = await OG.jget("/api/v1/my/tasks"); }
  catch (e) { box.innerHTML = `<div class="panel"><div class="err">${e.message}</div></div>`; return; }
  if (!items.length) {
    box.innerHTML = `<div class="panel"><div class="empty"><div class="pic">☕️</div>当前没有分配给我的阅卷任务~<br>
      <span class="hint">任务由管理员/年级组长在「任务分配」里指派;自己建的考试会出现在「我创建的考试」。</span></div></div>`;
    return;
  }
  // 进行中的排前面(有剩余的优先),同组按时间倒序
  const prio = it => (it.graded >= it.total ? 2 : it.kind === "mine" ? 1 : 0);
  items.sort((a, b) => prio(a) - prio(b) || (a.createdAt < b.createdAt ? 1 : -1));
  let totalLeft = 0, totalAll = 0;
  for (const it of items) { totalLeft += it.total - it.graded; totalAll += it.total; }
  let html = `<div class="panel">
    <div style="display:flex;align-items:center;margin-bottom:10px;gap:10px">
      <b>我的阅卷任务</b><span class="hint">共 ${items.length} 项 · 待评 ${totalLeft} 份(共 ${totalAll})</span>
    </div>
    <table><tr><th>考试</th><th>任务</th><th>类型</th><th>进度</th><th>考试阶段</th><th></th></tr>`;
  for (const it of items) {
    const left = it.total - it.graded;
    const pctv = it.total ? Math.round(it.graded * 100 / it.total) : 100;
    const kindTxt = { question: "按题", class: "按班", mine: "建卷人" }[it.kind] || it.kind;
    const link = it.kind === "question" ? `/grader.html?exam=${it.exam}&q=${it.question}` : `/grader.html?exam=${it.exam}`;
    html += `<tr><td><a href="#" onclick="openExam('${it.exam}');return false">${it.exam}</a><div class="hint">${it.createdAt}${it.subject ? " · " + it.subject : ""}</div></td>
      <td>${it.label}</td><td>${kindTxt}</td>
      <td><div class="progress" style="width:110px;display:inline-block;vertical-align:middle"><div style="width:${pctv}%"></div></div> ${it.graded}/${it.total}</td>
      <td><span class="pill ${STAGE_CLASS[it.stage] || "off"}">${it.stageLabel}</span></td>
      <td><a href="${link}">${left ? `<b>开始/继续(剩 ${left})</b>` : "查看"}</a></td></tr>`;
  }
  box.innerHTML = html + `</table></div>`;
}

const pct = v => (v == null ? "-" : (v * 100).toFixed(1) + "%");
const f1 = v => (v == null ? "-" : v.toFixed(1));

async function renderReport() {
  const id = document.getElementById("repExam").value;
  const a = await OG.jget(`/api/v1/exams/${id}/analytics`);
  const d = await OG.jget(`/api/v1/exams/${id}`);
  const ex = exams.find(e => e.id === id) || {};
  document.getElementById("pubState").innerHTML =
    `<span class="pill ${ex.published ? 'on' : 'off'}">${ex.published ? '已发布(学生/家长可查)' : '未发布'}</span>
     <button class="ghost" onclick="pubExam('${id}',${!ex.published}).then(renderReport)">${ex.published ? '撤回发布' : '发布成绩'}</button>`;

  const s = a.stats || {};
  let html = `<div class="cards">
    ${card(s.mean, "平均分 / " + f1(s.total))}
    ${card(s.max, "最高分")}
    ${card(s.min, "最低分")}
    ${card(f1(s.median), "中位数")}
    ${card(f1(s.stdDev), "标准差")}
    ${card(pct(s.passRate), "及格率 (≥" + f1(s.passLine) + ")")}
    ${card(pct(s.goodRate), "优秀率 (≥" + f1(s.goodLine) + ")")}
    ${card(pct(s.lowRate), "低分率 (<" + f1(s.lowLine) + ")")}
    ${card(s.count, "参考人数")}
  </div>`;
  // 分数段柱状图
  html += `<div class="grid2">
    <div><b>分数段分布</b><br><canvas id="segChart" width="520" height="220"></canvas></div>
    <div><b>班级对比</b><table><tr><th>班级</th><th>人数</th><th>均分</th><th>得分率</th></tr>`;
  for (const c of a.byClass) html += `<tr><td>${c.class}</td><td>${c.count}</td><td>${f1(c.mean)}</td><td>${pct(c.meanRate)}</td></tr>`;
  html += `</table></div></div>`;

  // 逐题分析:可选班级对比(班级得分率 + 与全体差值,对齐智学网高频错题表)
  const pcq = a.perClassQuestion || {};
  const cmpClasses = Object.keys(pcq).filter(c => c !== "未匹配").sort();
  const cmp = window.__cmpClass && pcq[window.__cmpClass] ? window.__cmpClass : "";
  html += `<div class="panel" style="margin-top:14px"><b>逐题分析</b>
    <span style="margin-left:12px" class="hint">对比班级
      <select onchange="window.__cmpClass=this.value;renderReport()">
        <option value="">不对比</option>
        ${cmpClasses.map(c => `<option value="${c}" ${c === cmp ? 'selected' : ''}>${c}</option>`).join("")}
      </select></span>
    <table><tr><th>题号</th><th>题型</th><th>满分</th><th>得分率/难度</th>${cmp ? "<th>班级得分率</th><th>与全体差值</th>" : ""}<th>区分度</th><th>作答分布</th></tr>`;
  for (const q of a.questions) {
    let dist = "-";
    if (q.options) {
      dist = Object.keys(q.options).map(k =>
        `<span class="hint">${k}:${q.options[k]}</span>`).join(" ");
    }
    if (q.elective) { // 选做题(版式 v3):统计口径为实际选做人数
      dist = `<span class="hint">选做 ${q.chosen || 0} 人</span>`;
    }
    const diff = q.difficulty != null ? (q.difficulty * 100).toFixed(0) + "%" : "-";
    let cmpCells = "";
    if (cmp) {
      const cr = pcq[cmp] ? pcq[cmp][q.index - 1] : -1;
      const crTxt = cr >= 0 ? pct(cr) : "-";
      let dTxt = "-", dCls = "";
      if (cr >= 0 && q.difficulty != null) {
        const d = cr - q.difficulty;
        dTxt = (d >= 0 ? "+" : "") + (d * 100).toFixed(1) + "pp";
        dCls = d >= 0.02 ? "color:var(--brand)" : d <= -0.02 ? "color:var(--bad)" : "";
      }
      cmpCells = `<td>${crTxt}</td><td style="${dCls}">${dTxt}</td>`;
    }
    html += `<tr><td>${q.index}</td><td>${q.label || q.kind}</td><td>${q.max}</td>
      <td>${diff}</td>${cmpCells}<td>${f1(q.discrimination)}</td><td>${dist}</td></tr>`;
    if (q.parts) { // 版式 v3:小问拆分的逐问明细
      html += `<tr><td></td><td colspan="${cmp ? 7 : 5}" class="hint">小问:` +
        q.parts.map(p => `${p.label || "(" + p.index + ")"} 均分 ${f1(p.mean)}/${p.max}(得分率 ${pct(p.rate)},已阅 ${p.graded})`).join(" · ") +
        `</td></tr>`;
    }
  }
  html += `</table><p class="hint">难度=得分率(越接近 100% 越易);区分度=高分组率−低分组率(<0.2 区分度偏低);差值=班级得分率−全体得分率(pp=百分点)。</p></div>`;

  // 知识点掌握度(CE 轨道 G2:建考录入标签 → 班级掌握雷达)
  html += `<div class="panel"><b>知识点掌握度</b> <span class="hint">掌握度 = 该知识点下所有题目的分值加权得分率;掌握度低的排前面。</span>
    <div id="knowBody" style="margin-top:10px"></div></div>`;

  // 错题重练卡(按学生):后端 /exams/{id}/practice?student=N 出重组版式,交 /api/v1/cards 渲染打印
  html += `<div class="panel"><b>错题重练卡</b> <span class="hint">按学生抽取其错题/丢分题,重组成一张可打印的新答题卡(保留题型/分值/知识点),打印作答后可走正常扫描判读。</span>
    <div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <select id="pracStu"></select>
      <button class="primary" onclick="makePracticeStaff('${id}')">生成练习卡</button>
      <span class="hint" id="pracMsg"></span>
    </div></div>`;

  // 知识点标签编辑(仅可编辑者)
  if (d.canEditKey) {
    html += `<div class="panel"><b>知识点标签</b> <span class="hint">为逐题录入知识点(多个用 , 或 、 分隔),保存后可出掌握度雷达。</span>
      <div id="knowEdit" style="margin-top:10px"></div></div>`;
  }

  // 客观题答案修正
  if (d.canEditKey) {
    html += `<div class="panel"><b>客观题参考答案</b> <span class="hint">录错答案键可在此修正,保存后全班客观分自动重统。</span>
      <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px">`;
    (d.key || []).forEach((k, i) => {
      html += `<label class="hint">${i + 1}<input class="keyinput" id="key_${i}" value="${k}"></label>`;
    });
    html += `</div><button class="primary" style="margin-top:12px" onclick="saveKey('${id}',${(d.key || []).length})">保存并重统</button>
      <span class="hint" id="keyMsg" style="margin-left:10px"></span></div>`;
  }

  // 等级赋分
  html += `<div class="panel"><b>新高考等级赋分换算</b>
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="ghost" onclick="convert('${id}',false)">五等(3+1+2)</button>
      <button class="ghost" onclick="convert('${id}',true)">21 级细分档</button>
    </div>
    <div id="convBody" style="margin-top:12px"></div></div>`;

  // 审计日志:智学网式手风琴——标题栏一行常驻(默认收起),展开时才拉明细
  if (OG.is("admin", "leader")) {
    html += `<div class="panel">
      <div class="acc-head" onclick="toggleAudit('${id}')">
        <span class="acc-arrow" id="auditArrow">▸</span><b>操作审计</b>
        <span class="hint" id="auditCount">改答案 / 改分 / 发布 / 指派留痕,点击展开</span>
      </div>
      <div id="auditBody" style="margin-top:8px" hidden></div></div>`;
  }

  // 补录与缺考:漏扫/答题卡作废的补救语义
  html += `<div class="panel"><b>补录与缺考</b> <span class="hint">漏扫、答题卡作废的学生在此补救:按考号手工补录(卷号续排),缺考不计入统计与排名。</span>
    <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      考号 <input id="manualReg" placeholder="如 00000006" style="width:110px">
      <label class="hint"><input type="checkbox" id="manualAbsent"> 登记为缺考</label>
      客观题作答 <input id="manualAns" placeholder="如 A,B,AB,C(可留空)" style="width:190px">
      <button class="primary" onclick="submitManual('${id}')">补录</button>
      <span class="hint" id="manualMsg"></span>
    </div>
    <div style="margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      已扫卷标记缺考 · 卷号 <input id="absentIdx" type="number" min="1" style="width:70px">
      <button class="ghost" onclick="markAbsent('${id}')">标记缺考</button>
    </div>
    <div id="absentBox" style="margin-top:10px"></div></div>`;

  document.getElementById("repBody").innerHTML = html;
  drawSegments(a.stats ? a.stats.segments : []);
  renderKnowledge(id, a);
  renderPracticeStudents(id);
  renderAbsent(id, d);
  auditLoadedFor = ""; // 切换考试:重置审计懒加载缓存
}

/* —— 错题重练卡(按学生) —— */
async function renderPracticeStudents(id) {

  if (!sel) return;

      `<option value="${s.index}">卷 ${s.index} · ${s.regNumber || "?"} · ${f1(s.score)}/${f1(s.total)} 分${s.absent ? " · 缺考" : ""}</option>`).join("");
  } catch (e) { sel.innerHTML = `<option value="">无法读取学生名单</option>`; }
}
async function makePracticeStaff(id) {
  const msg = document.getElementById("pracMsg");
  const stu = document.getElementById("pracStu").value;
  if (!stu) { msg.textContent = "请选择学生"; return; }
  msg.textContent = "生成中…";
  try {
    const r = await OG.jget(`/api/v1/exams/${id}/practice?student=${stu}`);
    const svg = await fetch("/api/v1/cards", {
      method: "POST", headers: { "Content-Type": "application/json" },

    }).then(x => x.text());

      <div style="font-family:sans-serif;padding:12px">

      <button onclick="print()">🖨 打印</button></div>${svg}`);

/* —— 知识点掌握度 —— */
function renderKnowledge(id, a) {
  const box = document.getElementById("knowBody");
  if (!box) return;
  const ks = a.knowledge || [];
  if (!ks.length) {
    box.innerHTML = `<p class="hint">本场尚未录入知识点标签。在下方「知识点标签」为逐题填写后即可出掌握度雷达。</p>`;
  } else {
    let html = `<canvas id="knowChart" width="820" height="${Math.max(120, ks.length * 30 + 30)}"></canvas>
      <table style="margin-top:10px"><tr><th>知识点</th><th>题数</th><th>掌握度</th><th>涉及总分</th><th>实际得分</th></tr>`;
    for (const k of ks) {
      html += `<tr><td>${k.name}</td><td>${k.questions}</td>
        <td><span class="bar"><div style="width:${Math.round(k.rate * 100)}%;background:${k.rate < 0.5 ? 'var(--bad)' : k.rate < 0.75 ? 'var(--warn)' : 'var(--brand)'}"></div></span> ${pct(k.rate)}</td>
        <td>${f1(k.max)}</td><td>${f1(k.earned)}</td></tr>`;
    }
    html += `</table>`;
    box.innerHTML = html;
    drawKnowledge(ks);
  }
  // 标签编辑器
  const ed = document.getElementById("knowEdit");
  if (ed) {
    OG.jget(`/api/v1/exams/${id}/knowledge`).then(k => {
      ed.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:8px">` +
        (a.questions || []).map(q => `<label class="hint">${q.label || q.index}<input class="keyinput" id="know_${q.index}" style="width:150px" value="${(k.tags||{})[q.index] || ''}" placeholder="如 函数、导数"></label>`).join("") + `</div>
        <button class="primary" style="margin-top:12px" onclick="saveKnowledge('${id}')">保存知识点</button>
        <span class="hint" id="knowMsg" style="margin-left:10px"></span>`;
    });
  }
}
function drawKnowledge(ks) {
  const cv = document.getElementById("knowChart");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height, padL = 130, padR = 60, rowH = 30;
  ctx.clearRect(0, 0, W, H);
  ctx.font = "12px sans-serif";
  ks.forEach((k, i) => {
    const y = 14 + i * rowH;
    ctx.fillStyle = "#1c2430"; ctx.textAlign = "right";
    ctx.fillText(k.name.length > 12 ? k.name.slice(0, 12) + "…" : k.name, padL - 8, y + 12);
    const barW = W - padL - padR;
    ctx.fillStyle = "#eef2f6"; ctx.fillRect(padL, y, barW, 16);
    ctx.fillStyle = k.rate < 0.5 ? "#e34d59" : k.rate < 0.75 ? "#ff8c00" : "#00b389";
    ctx.fillRect(padL, y, barW * Math.max(0, Math.min(1, k.rate)), 16);
    ctx.fillStyle = "#1c2430"; ctx.textAlign = "left";
    ctx.fillText((k.rate * 100).toFixed(0) + "%", padL + barW + 8, y + 12);
  });
}
async function saveKnowledge(id) {
  const tags = {};
  document.querySelectorAll("#knowEdit input[id^=know_]").forEach(inp => {
    tags[parseInt(inp.id.slice(5), 10)] = inp.value.trim();
  });
  try {
    await OG.jpost(`/api/v1/exams/${id}/knowledge`, { tags });
    document.getElementById("knowMsg").textContent = "已保存 ✓";
    renderReport();
  } catch (e) { document.getElementById("knowMsg").textContent = e.message; }
}

/* —— 补录与缺考 —— */
function renderAbsent(id, d) {
  const box = document.getElementById("absentBox");
  if (!box) return;
  let html = "";
  if ((d.absent || []).length) {
    html += `<table><tr><th>缺考卷</th><th>考号</th><th></th></tr>`;
    for (const a of d.absent) {
      html += `<tr><td>第 ${a.student} 卷</td><td>${a.reg}</td>
        <td><a href="#" onclick="setAbsent('${id}',${a.student},false);return false">取消缺考</a></td></tr>`;
    }
    html += `</table>`;
  }
  const tips = [];
  if (d.absent) tips.push(`缺考 ${d.absent.length} 人`);
  if (d.manual) tips.push(`手工补录卷 ${d.manual} 张`);
  if (!tips.length) tips.push("当前无缺考登记、无补录卷");
  html = `<p class="hint" style="margin:4px 0">${tips.join(" · ")}</p>` + html;
  box.innerHTML = html;
}
async function setAbsent(id, student, absent) {
  await OG.jpost(`/api/v1/exams/${id}/absent`, { student, absent });
  renderReport();
}
async function markAbsent(id) {
  const idx = parseInt(document.getElementById("absentIdx").value, 10);
  if (!idx) return;
  await setAbsent(id, idx, true);
}
async function submitManual(id) {
  const reg = document.getElementById("manualReg").value.trim();
  const absent = document.getElementById("manualAbsent").checked;
  const raw = document.getElementById("manualAns").value.trim();
  const answers = raw ? raw.split(/[,，\s]+/).filter(x => x !== "") : [];
  try {
    await OG.jpost(`/api/v1/exams/${id}/manual`, { reg, absent, answers });
    document.getElementById("manualMsg").textContent = "已补录 ✓";
    renderReport();
  } catch (e) { document.getElementById("manualMsg").textContent = e.message; }
}
function card(v, label) { return `<div class="card"><b>${v == null ? "-" : v}</b><span>${label}</span></div>`; }

/* 原生 canvas 画分数段柱状图(零依赖) */
function drawSegments(segs) {
  const cv = document.getElementById("segChart");
  if (!cv || !segs) return;
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height, pad = 26, base = H - 24;
  ctx.clearRect(0, 0, W, H);
  const maxC = Math.max(1, ...segs.map(s => s.count));
  const bw = (W - 2 * pad) / segs.length;
  ctx.font = "11px sans-serif";
  segs.forEach((s, i) => {
    const h = (base - 16) * (s.count / maxC);
    const x = pad + i * bw + bw * 0.15, w = bw * 0.7;
    ctx.fillStyle = s.count ? "#00b389" : "#eef2f6";
    ctx.fillRect(x, base - h, w, h);
    ctx.fillStyle = "#1c2430";
    ctx.textAlign = "center";
    if (s.count) ctx.fillText(s.count, x + w / 2, base - h - 3);
    ctx.fillStyle = "#8a94a3";
    ctx.fillText(`${s.low.toFixed(0)}-${s.high.toFixed(0)}`, x + w / 2, base + 14);
  });
  ctx.strokeStyle = "#e8ecf0";
  ctx.beginPath(); ctx.moveTo(pad, base); ctx.lineTo(W - pad, base); ctx.stroke();
}

async function saveKey(id, n) {
  const key = [];
  for (let i = 0; i < n; i++) key.push(document.getElementById("key_" + i).value.trim().toUpperCase());
  try {
    await OG.jpost(`/api/v1/exams/${id}/key`, { key });
    document.getElementById("keyMsg").textContent = "已保存并重统 ✓";
    renderReport();
  } catch (e) { document.getElementById("keyMsg").textContent = e.message; }
}

async function convert(id, fine) {
  const r = await OG.jpost(`/api/v1/exams/${id}/grade-convert`, { fine: !!fine });
  let html = `<table><tr><th>考号</th><th>原始分</th><th>等级</th><th>赋分</th><th>原始排名</th></tr>`;
  for (const c of r.converted) {
    html += `<tr><td>${c.reg}</td><td>${c.raw}</td><td>${c.grade}</td><td><b>${c.converted}</b></td><td>${c.rank}</td></tr>`;
  }
  html += `</table><p class="hint">赋分方案:${fine ? "21 级细分档(等级内 3 分一档)" : "A " + (r.scale.bands[0].ratio * 100).toFixed(0) + "% · 均衡五等"},赋分起点 ${r.scale.start}。</p>`;
  document.getElementById("convBody").innerHTML = html;
}

let auditLoadedFor = ""; // 已展开加载过的考试(切换考试后重新拉)

async function toggleAudit(id) {
  const body = document.getElementById("auditBody");
  const arrow = document.getElementById("auditArrow");
  const count = document.getElementById("auditCount");
  if (!body.hidden) { body.hidden = true; arrow.textContent = "▸"; return; } // 收起
  body.hidden = false;
  arrow.textContent = "▾";
  if (auditLoadedFor === id) return; // 同一场考试展开过,不重复拉取
  body.innerHTML = `<span class="hint">加载中…</span>`;
  try {
    const a = await OG.jget(`/api/v1/exams/${id}/audit`);
    auditLoadedFor = id;
    count.textContent = `共 ${a.entries.length} 条`;
    if (!a.entries.length) { body.innerHTML = `<span class="hint">暂无操作记录</span>`; return; }
    let html = `<table><tr><th>时间</th><th>操作人</th><th>动作</th><th>说明</th></tr>`;
    for (const e of a.entries) html += `<tr><td>${e.time}</td><td>${e.by}</td><td>${e.action}</td><td>${e.detail}</td></tr>`;
    body.innerHTML = html + "</table>";
  } catch (e) { body.innerHTML = `<span class="hint">无权查看审计</span>`; }
}

/* —— 纵向趋势(跨考试按考号对齐) —— */
let trendData = null;

async function loadTrendInit() {
  const subjects = [...new Set(exams.map(e => e.subject).filter(Boolean))];
  document.getElementById("tab-trends").innerHTML = `<div class="panel">
    班级 <select id="trendClass" onchange="loadTrend()"></select>
    学科 <select id="trendSubject" onchange="loadTrend()">
      <option value="">全部学科</option>${subjects.map(s => `<option>${s}</option>`).join("")}
    </select>
    <span class="hint" style="margin-left:10px">跨考试按考号对齐;不同学科/满分混排时得分率与名次无可比性,建议按学科筛选。</span>
  </div><div id="trendBody"></div>`;
  await loadTrend();
}

async function loadTrend() {
  const cls = document.getElementById("trendClass").value;
  const subj = document.getElementById("trendSubject").value;
  const q = new URLSearchParams();
  if (cls) q.set("class", cls);
  if (subj) q.set("subject", subj);
  trendData = await OG.jget("/api/v1/trends" + (q.toString() ? "?" + q.toString() : ""));
  const sel = document.getElementById("trendClass"), cur = sel.value;
  sel.innerHTML = `<option value="">全部班级</option>` +
    (trendData.classes || []).map(c => `<option ${c === cur ? "selected" : ""}>${c}</option>`).join("");
  renderTrend();
}

function renderTrend() {
  const box = document.getElementById("trendBody");
  const t = trendData;
  if (!(t.exams || []).length) { box.innerHTML = `<div class="panel hint">没有符合条件的考试</div>`; return; }
  const labels = t.exams.map(e => e.date.slice(5) + (t.subject ? "" : "·" + (e.subject || "无")));
  const hasClass = !!t.class;
  let html = `<div class="panel"><b>${hasClass ? t.class + " · " : ""}均分走势</b><br>
    <canvas id="classTrendCv" width="860" height="240"></canvas></div>`;
  html += `<div class="panel"><b>考试序列</b>
    <table><tr><th>#</th><th>日期</th><th>学科</th><th>实考</th><th>满分</th><th>全体均分</th>${hasClass ? "<th>本班均分</th><th>本班人数</th>" : ""}</tr>`;
  t.exams.forEach((e, i) => {
    html += `<tr><td>${i + 1}</td><td>${e.date}</td><td>${e.subject || "-"}</td><td>${e.students}</td>
      <td>${f1(e.total)}</td><td>${f1(e.mean)}</td>
      ${hasClass ? `<td><b>${f1(e.classMean)}</b></td><td>${e.classCount}</td>` : ""}</tr>`;
  });
  html += `</table></div>`;

  // 学生跨考对齐表:最近得分/名次与进退步;点击行画个人曲线
  html += `<div class="panel"><b>学生名次进退</b>
    <table><tr><th>考号</th><th>姓名</th><th>班级</th><th>场数</th><th>最近得分</th><th>最近名次</th><th>名次进退</th><th></th></tr>`;
  for (const s of t.students) {
    const pts = s.points.filter(p => !p.absent);
    const last = pts[pts.length - 1], prev = pts[pts.length - 2];
    let delta = "-";
    if (last && prev && last.rank && prev.rank) {
      const d = prev.rank - last.rank;
      delta = d === 0 ? "—" : d > 0 ? `<b style="color:var(--brand)">↑${d}</b>` : `<b style="color:var(--bad)">↓${-d}</b>`;
    }
    html += `<tr><td>${s.reg}</td><td>${s.name || "-"}</td><td>${s.class || "-"}</td><td>${pts.length}</td>
      <td>${last ? f1(last.score) : "-"}</td><td>${last && last.rank ? last.rank : "-"}</td><td>${delta}</td>
      <td><a href="#" onclick="drawStudentTrend('${s.reg}');return false">曲线</a></td></tr>`;
  }
  html += `</table><canvas id="studentTrendCv" width="860" height="240" style="margin-top:12px"></canvas>
    <p class="hint" id="studentTrendTip">点「曲线」查看个人历次得分率与班级对照。</p></div>`;
  box.innerHTML = html;

  const series = [];
  if (hasClass) {
    series.push({ name: "本班均分", color: "#00b389", values: t.exams.map(e => e.classMean) });
    series.push({ name: "全体均分", color: "#9aa7b6", values: t.exams.map(e => e.mean) });
  } else {
    series.push({ name: "均分", color: "#00b389", values: t.exams.map(e => e.mean) });
  }
  OG.chartLine(document.getElementById("classTrendCv"), labels, series, v => f1(v));
}

function drawStudentTrend(reg) {
  const t = trendData;
  const s = (t.students || []).find(x => x.reg === reg);
  if (!s) return;
  const labels = t.exams.map(e => e.date.slice(5) + (t.subject ? "" : "·" + (e.subject || "无")));
  const byId = {};
  for (const p of s.points) byId[p.examId] = p;
  const mine = t.exams.map(e => { const p = byId[e.id]; return p && !p.absent ? Math.round(p.rate * 1000) / 10 : null; });
  const clsRate = t.exams.map(e => e.total > 0 ? Math.round(e.classMean / e.total * 1000) / 10 : null);
  const cv = document.getElementById("studentTrendCv");
  OG.chartLine(cv, labels, [
    { name: `${s.name || s.reg} 得分率%`, color: "#00b389", values: mine },
    { name: "班级均分率%", color: "#9aa7b6", values: clsRate },
  ], v => v.toFixed(0) + "%");
  document.getElementById("studentTrendTip").textContent =
    `${s.name || s.reg}:共 ${s.points.filter(p => !p.absent).length} 场有效成绩` +
    (s.points.some(p => p.absent) ? ",含缺考场次(图中断点)" : "");
  cv.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
